        body {

        .badge {

            font-size: 9.5px;
            font-weight: 700;

            width: 130px;
            height: 130px;
            margin: 0 auto 35px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .circle-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3.5px solid rgba(255, 255, 255, 0.06);
            box-sizing: border-box;
        }

        .circle-progress {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3.5px solid transparent;
            border-top-color: #00d2ff;
            border-right-color: #0084ff;
            transform: rotate(-30deg);
            box-sizing: border-box;
        }

        .timer-inner {
            width: 90%;
            height: 90%;
            background: radial-gradient(circle, #1a3c6d 0%, #0c1a30 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.6);
        }

        .timer-number {
            font-size: 46px;
            font-weight: 600;
            color: #ffffff;
        }

        /* Status & Description (Normal caps text matching image) */
        .status-title {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .status-desc {
            font-size: 13px;
            color: #a0aec0;
            margin-bottom: 25px;
        }

        /* Button Main Styles */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px;
            margin-bottom: 14px;
            border-radius: 12px;
            border: none;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        /* Verifying Button Loading State (Same to Same caps) */
        .btn-primary {

            color: #637b9c;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-transform: uppercase;
            cursor: not-allowed;
        }

        .btn-primary.active {
            background: linear-gradient(90deg, #0084ff, #00c6ff);
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 132, 255, 0.3);
        }

        /* Channel Secondary Button Layout */
        .btn-secondary {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .btn-secondary .icon-arrow {
            color: #00d2ff;
            margin-right: 10px;
            font-size: 11px;
        }
        .btn-secondary .icon-lightning {
            color: #ffcc00;
            margin-right: 6px;
        }
        .btn-secondary .btn-text-content {
            text-transform: uppercase;
            font-weight: 700;
        }

        /* Live View Tracker Style */
        .views-tracker {
            font-size: 11px;
            color: #00ffcc;
            margin-top: 12px;
            opacity: 0.75;
        }

        /* Footer Security Label */
        .footer-brand {
            font-size: 9.5px;
            color: #556b8f;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-top: 25px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }
        .footer-brand span {
            color: #ffcc00;
        }
    </style>
</head>
