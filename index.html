<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--cyan:#37e4ff;--blue:#168df5;--purple:#9d45ed;--pink:#ef4bd0}
body{
 min-height:100svh;display:flex;align-items:center;justify-content:center;
 padding:26px 14px;color:#fff;font-family:Poppins,Arial,sans-serif;overflow-x:hidden;
 background:
  radial-gradient(ellipse at 12% 24%,rgba(0,176,255,.58),transparent 34%),
  radial-gradient(ellipse at 91% 34%,rgba(231,47,193,.43),transparent 34%),
  radial-gradient(ellipse at 78% 92%,rgba(121,37,230,.50),transparent 35%),
  linear-gradient(145deg,#07172c 0%,#10132b 52%,#09091b 100%);
}
body:before,body:after{content:"";position:fixed;width:230px;height:230px;border-radius:50%;filter:blur(85px);opacity:.38;pointer-events:none;z-index:-1}
body:before{left:-125px;top:14%;background:#00bfff}
body:after{right:-120px;bottom:7%;background:#df31db}
.page{width:min(100%,390px);display:flex;justify-content:center}
.panel{
 width:100%;position:relative;overflow:hidden;text-align:center;
 padding:27px 19px 18px;border-radius:22px;
 background:linear-gradient(135deg,rgba(63,147,198,.34),rgba(39,43,88,.52) 48%,rgba(161,48,166,.35));
 border:1px solid rgba(190,219,255,.46);
 box-shadow:0 18px 55px rgba(0,0,0,.46),0 0 28px rgba(35,191,255,.18),0 0 32px rgba(224,54,208,.14),inset 0 1px 0 rgba(255,255,255,.22);
 backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)
}
.panel:before{content:"";position:absolute;left:8%;right:8%;top:0;height:1px;background:linear-gradient(90deg,transparent,#a9f5ff,#f6a8ef,transparent)}
.logo{
 width:49px;height:49px;margin:0 auto 9px;border-radius:50%;display:grid;place-items:center;
 background:radial-gradient(circle at 35% 25%,#252b42,#050711 72%);
 border:1px solid rgba(255,255,255,.45);box-shadow:0 0 12px rgba(50,220,255,.2),inset 0 0 12px rgba(255,255,255,.08);
 font:800 8px Orbitron,sans-serif;line-height:1.35;letter-spacing:.4px;color:#f5fbff;text-align:center
}
.logo span{display:block;color:#8eefff;font-size:7px}
.brand{font:800 16px Orbitron,sans-serif;letter-spacing:1.35px;color:#f4fbff;text-shadow:0 0 12px rgba(74,218,255,.32)}
.tagline{margin-top:5px;font-size:8px;letter-spacing:1.25px;color:#b8d6e9}
.verified{
 display:inline-flex;align-items:center;gap:6px;margin:11px auto 0;padding:5px 11px;border-radius:20px;
 color:#9ff5ef;background:rgba(22,190,181,.12);border:1px solid rgba(65,231,213,.36);
 font-size:7px;letter-spacing:1px;text-transform:uppercase
}
.verified .dot{width:5px;height:5px;border-radius:50%;background:#42f4d6;box-shadow:0 0 8px #42f4d6}
.timer-wrap{width:112px;height:112px;position:relative;margin:22px auto 17px;display:grid;place-items:center}
.dots{position:absolute;inset:0;border-radius:50%;border:1.5px dotted rgba(116,222,255,.76);animation:spin 15s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ring{position:absolute;inset:5px;border-radius:50%;border:2px solid rgba(80,187,255,.23);box-shadow:0 0 12px rgba(36,178,255,.13)}
svg.progress{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.track,.bar{fill:none;stroke-width:3.2}
.track{stroke:rgba(116,204,255,.12)}
.bar{stroke:url(#grad);stroke-linecap:round;stroke-dasharray:326.73;stroke-dashoffset:0;filter:drop-shadow(0 0 4px rgba(43,217,255,.8));transition:stroke-dashoffset 1s linear}
.core{
 position:relative;width:87px;height:87px;border-radius:50%;overflow:hidden;display:grid;place-items:center;
 background:radial-gradient(circle at 33% 22%,#66778a 0%,#31445b 34%,#15233b 72%,#080f20 100%);
 border:2px solid rgba(137,215,255,.72);
 box-shadow:0 0 0 4px rgba(49,157,226,.12),0 0 17px rgba(34,194,255,.28),inset 0 5px 12px rgba(255,255,255,.17),inset 0 -10px 16px rgba(0,0,0,.6)
}
.core:after{content:"";position:absolute;left:10px;top:6px;width:64px;height:33px;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent);pointer-events:none;z-index:3}
.water{position:absolute;left:-50%;bottom:0;width:200%;height:0;background:linear-gradient(180deg,#a5ffb4 0%,#35e878 18%,#08b957 52%,#087b48 100%);box-shadow:inset 0 7px 12px rgba(230,255,231,.48),inset 0 -10px 15px rgba(0,47,30,.42),0 -3px 12px rgba(63,255,135,.28);transition:none}
.wave{position:absolute;top:-9px;left:0;width:200%;height:17px;border-radius:42%;background:linear-gradient(180deg,rgba(224,255,224,.96),rgba(111,255,156,.82) 48%,rgba(22,202,94,.42));box-shadow:0 0 10px rgba(101,255,145,.65);animation:wave 3.2s linear infinite}
.wave.alt{left:-55%;top:-5px;opacity:.42;animation-duration:5.1s;filter:blur(1px)}
@keyframes wave{to{transform:rotate(360deg)}}
.number{position:relative;z-index:2;font:800 31px Orbitron,sans-serif;text-shadow:0 2px 8px #000}
.sec{position:relative;z-index:2;font-size:6px;letter-spacing:2px;margin-top:-22px;color:#e2f7ff}
.section-title{font:700 9px Orbitron,sans-serif;letter-spacing:1px;color:#f2f7ff;margin-top:1px}
.status-copy{font-size:8px;color:#b6c5da;margin-top:5px;min-height:14px}
.action{
 width:100%;min-height:35px;margin-top:15px;border-radius:10px;border:1px solid rgba(113,207,255,.34);
 display:flex;align-items:center;justify-content:center;gap:7px;
 background:linear-gradient(100deg,#087fb9,#236fd0 52%,#7543b9);
 color:#eafaff;text-decoration:none;font:600 8px Poppins,sans-serif;letter-spacing:.8px;
 box-shadow:0 5px 16px rgba(0,0,0,.23),inset 0 1px rgba(255,255,255,.17);
}
.action.wait{opacity:.8}
.action.ready{background:linear-gradient(100deg,#00a9d5,#287ce5 52%,#9a42c8);box-shadow:0 0 17px rgba(25,191,255,.26);cursor:pointer}
.action.secondary{margin-top:8px;background:rgba(65,82,119,.43);border-color:rgba(189,207,255,.25);font-size:8px}
.action:active{transform:scale(.99)}
.small-note{margin-top:10px;color:#a9b4ce;font-size:7px;letter-spacing:.65px}
.footer{margin-top:12px;color:#a9b5d0;font-size:7px;letter-spacing:1.1px}
.footer b{color:#e7d6ff;font-weight:600}
@media(max-width:360px){.panel{padding:23px 15px 16px}.timer-wrap{margin:18px auto 14px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="page">
<section class="panel" aria-label="Rudra Movies link preparation">
 <div class="logo">RUDRA MOVIES<span>OFFICIAL</span></div>
 <div class="brand">RUDRA MOVIES</div>
 <div class="tagline">YOUR CINEMA DESTINATION</div>
 <div class="verified"><i class="dot"></i> LINK READY CHECK</div>

 <div class="timer-wrap">
  <div class="dots"></div><div class="ring"></div>
  <svg class="progress" viewBox="0 0 112 112" aria-hidden="true">
   <defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#37eaff"/><stop offset="52%" stop-color="#328aff"/><stop offset="100%" stop-color="#ed65d8"/>
   </linearGradient></defs>
   <circle class="track" cx="56" cy="56" r="52"/>
   <circle class="bar" id="progress" cx="56" cy="56" r="52"/>
  </svg>
  <div class="core">
   <div class="water" id="water"><div class="wave"></div><div class="wave alt"></div></div>
   <div class="number" id="number">5</div>
   <div class="sec">SECONDS</div>
  </div>
 </div>

 <div class="section-title">LINK PREPARATION</div>
 <div class="status-copy" id="status">Preparing your destination link...</div>

 <a class="action wait" id="mainAction" href="#" aria-disabled="true">
  <span>◌</span> VERIFYING LINK...
 </a>
 <a class="action secondary" href="https://t.me/RudraMoviez" target="_blank" rel="noopener noreferrer">
  <span>➤</span> JOIN RUDRA MAIN CHANNEL
 </a>
 <div class="small-note">Please use official links and authorized content.</div>
 <div class="footer">✦ <b>RUDRA MOVIES</b> SECURITY ✦</div>
</section>
</main>
<script>
(() => {
 const number=document.getElementById('number');
 const water=document.getElementById('water');
 const progress=document.getElementById('progress');
 const status=document.getElementById('status');
 const action=document.getElementById('mainAction');
 const total=5, circumference=2*Math.PI*52;
 let remaining=total, destination=null;

 const params=new URLSearchParams(location.search);
 const raw=params.get('redirect');
 if(raw){
  try{
   const parsed=new URL(raw);
   if(parsed.protocol==='https:') destination=parsed.href;
  }catch(_){ destination=null; }
 }

 progress.style.strokeDasharray=String(circumference);
 progress.style.strokeDashoffset='0';

 const startTime=performance.now();
 let lastShown=-1;

 function animate(now){
  const elapsed=Math.min((now-startTime)/1000,total);
  const done=elapsed/total;

  // Smooth, continuous water rise and circular progress over the full countdown.
  water.style.height=(done*100)+'%';
  progress.style.strokeDashoffset=String(circumference*done);

  const secondsLeft=Math.max(0,Math.ceil(total-elapsed));
  if(secondsLeft!==lastShown){
   number.textContent=String(secondsLeft);
   lastShown=secondsLeft;
  }

  if(elapsed<total){
   window.requestAnimationFrame(animate);
  }else{
   number.textContent='0';
   water.style.height='100%';
   if(destination){
    status.textContent='Your destination link is ready.';
    action.textContent='➜  PROCEED TO DESTINATION';
    action.href=destination;
    action.classList.remove('wait');
    action.classList.add('ready');
    action.setAttribute('aria-disabled','false');
   }else{
    status.textContent='No valid destination link was provided.';
    action.textContent='LINK UNAVAILABLE';
    action.removeAttribute('href');
    action.setAttribute('aria-disabled','true');
   }
  }
 }
 window.requestAnimationFrame(animate);
})();
</script>
</body>
