
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#10132b">

<title>ᴘʀᴇᴘᴀʀɪɴɢ ʏᴏᴜʀ ᴅᴏᴡɴʟᴏᴀᴅ ʟɪɴᴋ... | ʀᴜᴅʀᴀ ᴍᴏᴠɪᴇꜱ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
  --blue: #168cff;
  --cyan: #35d8ff;
  --purple: #a52cff;
  --bg: #10132b;
  --white: #ffffff;
  --muted: #c2c5df;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  padding: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow-x: hidden;

  background:
    radial-gradient(circle at 10% 15%, rgba(0,174,255,.48), transparent 38%),
    radial-gradient(circle at 95% 85%, rgba(174,24,255,.48), transparent 40%),
    linear-gradient(145deg,#10152c,#111027,#17102c);

  color: var(--white);
  font-family: 'Inter', sans-serif;
}

/* UNICODE SMALL CAPS STYLE */

body,
body * {
  font-family: 'Inter', sans-serif;
  font-variant-caps: normal;
}

.brand-title,
.tagline,
.verified-text,
.status-heading,
.status-sub,
.btn,
.card-footer,
.error-banner {
  letter-spacing: 1.2px;
}

/* BACKGROUND LIGHTS */

.ambient {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.glow {
  position: absolute;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  filter: blur(90px);
  opacity: .65;
  animation: glowMove 9s ease-in-out infinite alternate;
}

.glow-one {
  background: #008cff;
  top: 0;
  left: -150px;
}

.glow-two {
  background: #9b20ff;
  right: -140px;
  bottom: 0;
  animation-delay: -4s;
}

.glow-three {
  background: #00c9ff;
  right: -160px;
  top: 20%;
  opacity: .25;
}

@keyframes glowMove {
  from { transform: scale(1) translateY(0); }
  to { transform: scale(1.2) translateY(-20px); }
}

/* MAIN CARD */

.card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 360px;
  padding: 27px 20px 19px;
  text-align: center;
  border-radius: 24px;

  background:
    radial-gradient(circle at 0% 0%,rgba(0,160,255,.22),transparent 50%),
    radial-gradient(circle at 100% 100%,rgba(160,30,255,.25),transparent 50%),
    linear-gradient(145deg,rgba(35,43,78,.88),rgba(19,19,43,.94));

  border: 1px solid rgba(190,190,255,.28);

  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);

  box-shadow:
    0 25px 65px rgba(0,0,0,.55),
    0 0 35px rgba(48,137,255,.12),
    inset 0 1px 1px rgba(255,255,255,.18);

  overflow: hidden;
}

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 10%;
  width: 80%;
  height: 1px;
  background: linear-gradient(90deg,transparent,#8bdcff,transparent);
}

/* LOGO */

.logo-ring {
  width: 62px;
  height: 62px;
  padding: 3px;
  margin: 0 auto 12px;
  border-radius: 50%;
  background: #05050b;
  border: 1px solid rgba(255,255,255,.6);
  box-shadow: 0 0 18px rgba(0,174,255,.5);
  overflow: hidden;
}

.logo-ring img {
  width: 100%;
  height: 100%;
  display: block;
  border-radius: 50%;
  object-fit: cover;
}

/* BRAND */

.brand-title {
  font-size: 1.15rem;
  font-weight: 900;
  letter-spacing: 2px;
  color: #fff;
  margin-bottom: 8px;
  text-shadow: 0 0 14px rgba(0,170,255,.35);
}

/* TAGLINE */

.tagline {
  color: #b8c9ff;
  font-size: .63rem;
  font-weight: 700;
  letter-spacing: 2px;
  margin-bottom: 18px;
}

/* VERIFIED BADGE */

.verified-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 7px 13px;
  border-radius: 30px;
  background: rgba(16,185,129,.12);
  border: 1px solid rgba(52,211,153,.3);
  margin-bottom: 22px;
}

.verified-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #34d399;
  box-shadow: 0 0 9px #34d399;
}

.verified-text {
  color: #8df5c6;
  font-size: .58rem;
  font-weight: 800;
  letter-spacing: 1px;
}

/* COUNTDOWN */

.orb-wrapper {
  width: 112px;
  height: 112px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 24px;
  isolation: isolate;
}

/* OUTER ROTATING RING */

.orb-wrapper::before {
  content: "";
  position: absolute;
  inset: -9px;
  border-radius: 50%;
  border: 1.5px dashed rgba(90,190,255,.55);
  border-top-color: #35d8ff;
  border-right-color: #a52cff;
  animation: outerRotate 4s linear infinite;
  pointer-events: none;
  z-index: 5;
}

/* INNER ROTATING RING */

.orb-wrapper::after {
  content: "";
  position: absolute;
  inset: -15px;
  border-radius: 50%;
  border: 1px solid transparent;
  border-bottom-color: rgba(53,216,255,.8);
  border-left-color: rgba(165,44,255,.6);
  animation: innerRotate 6s linear infinite;
  pointer-events: none;
  z-index: 4;
}

@keyframes outerRotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes innerRotate {
  from { transform: rotate(360deg); }
  to { transform: rotate(0deg); }
}

/* SVG RINGS */

.orb-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
  z-index: 3;
  pointer-events: none;
}

.ring-dashed {
  fill: none;
  stroke: rgba(75,190,255,.35);
  stroke-width: 1.5;
  stroke-dasharray: 3 4;
}

.ring-track {
  fill: none;
  stroke: rgba(255,255,255,.13);
  stroke-width: 4;
}

.ring-progress {
  fill: none;
  stroke: url(#blueGradient);
  stroke-width: 4;
  stroke-linecap: round;
  stroke-dasharray: 308;
  stroke-dashoffset: 308;
  filter: drop-shadow(0 0 6px #24bfff);
}

/* LIQUID SPHERE */

.liquid-sphere {
  width: 88px;
  height: 88px;
  position: relative;
  overflow: hidden;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 20%,#263b67,#10162d 80%);
  border: 2px solid rgba(95,195,255,.45);

  box-shadow:
    inset 0 5px 15px rgba(0,0,0,.7),
    inset 0 -5px 12px rgba(0,155,255,.3),
    0 0 20px rgba(0,170,255,.25);

  z-index: 2;
}

.liquid-fill {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 0%;
  background: linear-gradient(180deg,#6ce6ff,#248cff 55%,#7134e9);
  box-shadow: 0 0 15px rgba(0,170,255,.65);
  transition: height .08s linear;
}

.liquid-fill::before {
  content: "";
  position: absolute;
  top: -5px;
  left: -8%;
  width: 116%;
  height: 10px;
  border-radius: 50%;
  background: #8ceaff;
  box-shadow: 0 0 12px #4bcfff;
  animation: liquidWave 2s ease-in-out infinite alternate;
}

@keyframes liquidWave {
  from { transform: translateY(0) scaleY(1); }
  to { transform: translateY(2px) scaleY(1.3); }
}

.sphere-gloss {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 20%,rgba(255,255,255,.2),transparent 60%);
  z-index: 3;
  pointer-events: none;
}

.countdown-num {
  position: absolute;
  z-index: 6;
  font-size: 2.3rem;
  font-weight: 900;
  color: #fff;
  text-shadow: 0 3px 10px rgba(0,0,0,.5);
  transition: transform .2s ease;
}

.countdown-num.pop {
  transform: scale(1.18);
}

/* STATUS */

.status-block {
  margin-bottom: 17px;
}

.status-heading {
  font-size: .76rem;
  font-weight: 900;
  letter-spacing: 1.2px;
  color: #fff;
  margin-bottom: 7px;
}

.status-sub {
  font-size: .65rem;
  color: #c0c5dc;
  font-weight: 500;
  letter-spacing: .8px;
}

/* ERROR */

.error-banner {
  display: none;
  padding: 11px;
  margin-bottom: 14px;
  border-radius: 11px;
  background: rgba(239,68,68,.15);
  border: 1px solid rgba(248,113,113,.4);
  color: #fecaca;
  font-size: .7rem;
  font-weight: 600;
  line-height: 1.6;
}

/* BUTTONS */

.btn-group {
  display: flex;
  flex-direction: column;
  gap: 9px;
  margin-bottom: 13px;
}

.btn {
  min-height: 43px;
  width: 100%;
  border-radius: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  text-decoration: none;
  font-size: .69rem;
  font-weight: 800;
  letter-spacing: .8px;
  transition: .25s ease;
  position: relative;
  overflow: hidden;
  cursor: pointer;
}

/* DOWNLOAD BUTTON */

.btn-primary {
  background: linear-gradient(100deg,#1479df,#168cff 55%,#8537ed);
  border: 1px solid rgba(130,205,255,.5);
  color: rgba(255,255,255,.8);
  box-shadow: 0 5px 18px rgba(0,125,255,.25);
  pointer-events: none;
}

.btn-primary.ready {
  background: linear-gradient(100deg,#087ce8,#13b9ee,#7539e9);
  border-color: rgba(160,225,255,.7);
  color: #fff;
  pointer-events: auto;
  box-shadow: 0 7px 22px rgba(0,150,255,.45);
}

.btn-primary.ready:active {
  transform: scale(.98);
}

/* SPINNER */

.btn-spinner {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,.25);
  border-top-color: #fff;
  animation: spin .8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* TELEGRAM */

.btn-channel {
  background: linear-gradient(100deg,rgba(49,54,100,.75),rgba(102,43,150,.65));
  border: 1px solid rgba(190,175,255,.28);
  color: #fff;
  box-shadow: 0 4px 15px rgba(0,0,0,.25);
}

.btn-channel:active {
  transform: scale(.98);
}

.tg-send-icon {
  width: 15px;
  height: 15px;
  color: #54c9ff;
  flex-shrink: 0;
}

/* FOOTER */

.card-footer {
  font-size: .55rem;
  font-weight: 800;
  letter-spacing: 1.5px;
  color: rgba(210,210,240,.6);
}

/* MOBILE */

@media(max-width:360px) {
  body { padding: 12px; }
  .card { padding: 23px 16px 17px; }
}

@media(max-height:600px) {
  body {
    align-items: flex-start;
    overflow-y: auto;
  }
}
</style>
</head>

<body>

<div class="ambient">
  <div class="glow glow-one"></div>
  <div class="glow glow-two"></div>
  <div class="glow glow-three"></div>
</div>

<main class="card">

  <div class="logo-ring">
    <img src="RudraMovies.png" alt="ʀᴜᴅʀᴀ ᴍᴏᴠɪᴇꜱ"
         onerror="this.style.opacity='.25'">
  </div>

  <h1 class="brand-title">ʀᴜᴅʀᴀ ᴍᴏᴠɪᴇꜱ</h1>

  <div class="tagline">
    ʏᴏᴜʀ ᴄɪɴᴇᴍᴀᴛɪᴄ ᴜɴɪᴠᴇʀꜱᴇ
  </div>

  <div class="verified-pill">
    <span class="verified-dot"></span>
    <span class="verified-text">ʟɪɴᴋ ꜱʏꜱᴛᴇᴍ ᴀᴄᴛɪᴠᴇ</span>
  </div>

  <div class="orb-wrapper">

    <svg class="orb-svg" viewBox="0 0 112 112">
      <defs>
        <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#49dfff"/>
          <stop offset="55%" stop-color="#168cff"/>
          <stop offset="100%" stop-color="#a52cff"/>
        </linearGradient>
      </defs>

      <circle class="ring-dashed" cx="56" cy="56" r="53"/>
      <circle class="ring-track" cx="56" cy="56" r="49"/>
      <circle class="ring-progress" id="ringProgress" cx="56" cy="56" r="49"/>
    </svg>

    <div class="liquid-sphere">
      <div class="liquid-fill" id="liquidFill"></div>
      <div class="sphere-gloss"></div>
    </div>

    <div class="countdown-num" id="countdownNum">5</div>

  </div>

  <div class="status-block">

    <div class="status-heading" id="statusHeading">
      ᴘʀᴇᴘᴀʀɪɴɢ ʏᴏᴜʀ ᴅᴏᴡɴʟᴏᴀᴅ ʟɪɴᴋ...
    </div>

    <div class="status-sub" id="statusSub">
      ᴘʟᴇᴀꜱᴇ ᴡᴀɪᴛ ᴡʜɪʟᴇ ᴡᴇ ᴘʀᴇᴘᴀʀᴇ ʏᴏᴜʀ ʟɪɴᴋ
    </div>

  </div>

  <div class="error-banner" id="errorBanner"></div>

  <div class="btn-group">

    <a href="#" id="downloadBtn"
       class="btn btn-primary"
       role="button"
       aria-disabled="true">

      <span class="btn-spinner" id="btnSpinner"></span>
      <span id="downloadBtnText">ᴘʀᴇᴘᴀʀɪɴɢ...</span>

    </a>

    <a href="https://t.me/RudraMovies"
       id="telegramBtn"
       target="_blank"
       rel="noopener noreferrer"
       class="btn btn-channel">

      <svg class="tg-send-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M3.4 20.4l17.45-7.48a1 1 0 0 0 0-1.84L3.4 3.6a.993.993 0 0 0-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.07-.87.5-.87 1l.01 4.61c0 .71.73 1.2 1.39.91z"/>
      </svg>

      <span>ʀᴜᴅʀᴀ ᴍᴀɪɴ ᴄʜᴀɴɴᴇʟ</span>

    </a>

  </div>

  <div class="card-footer">
    ʀᴜᴅʀᴀ ᴍᴏᴠɪᴇꜱ
  </div>

</main>

<script>
(function () {

  const COUNTDOWN_SECONDS = 5;
  const ARC_CIRCUMFERENCE = 2 * Math.PI * 49;

  const countdownNum = document.getElementById('countdownNum');
  const ringProgress = document.getElementById('ringProgress');
  const liquidFill = document.getElementById('liquidFill');
  const statusHeading = document.getElementById('statusHeading');
  const statusSub = document.getElementById('statusSub');
  const errorBanner = document.getElementById('errorBanner');
  const downloadBtn = document.getElementById('downloadBtn');
  const downloadBtnText = document.getElementById('downloadBtnText');
  const btnSpinner = document.getElementById('btnSpinner');

  ringProgress.style.strokeDasharray = `${ARC_CIRCUMFERENCE}`;
  ringProgress.style.strokeDashoffset = `${ARC_CIRCUMFERENCE}`;

  let finalRedirectUrl = null;
  let hasError = false;

  function parseValidUrl(input) {

    if (!input || typeof input !== 'string') return null;

    const raw = input.trim();
    if (!raw) return null;

    if (/^(https?:\/\/|tg:\/\/)/i.test(raw)) {
      return raw;
    }

    try {
      const decoded = atob(raw).trim();

      if (/^(https?:\/\/|tg:\/\/)/i.test(decoded)) {
        return decoded;
      }
    } catch (_) {}

    return null;
  }

  function displayError(msg) {

    hasError = true;

    btnSpinner.style.display = 'none';
    downloadBtnText.textContent = 'ʟɪɴᴋ ᴇʀʀᴏʀ';

    statusHeading.textContent = 'ʟɪɴᴋ ᴠᴇʀɪꜰɪᴄᴀᴛɪᴏɴ ꜰᴀɪʟᴇᴅ';
    statusHeading.style.color = '#ff7777';

    statusSub.textContent = 'ᴜɴᴀʙʟᴇ ᴛᴏ ᴘʀᴇᴘᴀʀᴇ ʏᴏᴜʀ ʟɪɴᴋ';

    countdownNum.textContent = '!';

    errorBanner.textContent = msg;
    errorBanner.style.display = 'block';

    downloadBtn.classList.remove('ready');
    downloadBtn.removeAttribute('href');
  }

  async function resolveDestination() {

    const params = new URLSearchParams(window.location.search);

    const token = params.get('token');
    const redirect = params.get('redirect');

    if (token) {

      try {

        let res = await fetch(
          `/api/verify?token=${encodeURIComponent(token)}`,
          {
            method: 'GET',
            headers: { 'Accept': 'application/json' }
          }
        );

        if (res.status === 405) {

          res = await fetch('/api/verify', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify({ token, redirect })
          });

        }

        const data = await res.json().catch(() => ({}));

        if (
          !res.ok ||
          data.error ||
          data.valid === false ||
          data.success === false
        ) {
          throw new Error(
            data.message ||
            data.error ||
            'This download token is invalid or has expired.'
          );
        }

        const target =
          data.redirect ||
          data.url ||
          data.target ||
          data.link ||
          redirect;

        const validTarget = parseValidUrl(target);

        if (!validTarget) {
          throw new Error('Destination download link is missing or invalid.');
        }

        return validTarget;

      } catch (err) {

        displayError(
          err.message ||
          'Failed to verify download token. Please try again from the channel.'
        );

        return null;
      }
    }

    if (redirect) {

      const validTarget = parseValidUrl(redirect);

      if (validTarget) return validTarget;

      displayError('The provided redirect URL is invalid.');
      return null;
    }

    displayError('No download link or token was found in the URL.');

    return null;
  }

  function startCountdown() {

    const destinationPromise = resolveDestination();

    const startTime = performance.now();
    const totalDuration = COUNTDOWN_SECONDS * 1000;

    let currentDisplayed = COUNTDOWN_SECONDS;

    liquidFill.style.height = '20%';

    function tick(now) {

      if (hasError) return;

      const elapsed = Math.min(
        now - startTime,
        totalDuration
      );

      const progress = elapsed / totalDuration;

      const secondsLeft = Math.max(
        1,
        Math.ceil((totalDuration - elapsed) / 1000)
      );

      const dashOffset =
        ARC_CIRCUMFERENCE * (1 - progress);

      ringProgress.style.strokeDashoffset = `${dashOffset}`;

      const fillPercent = 20 + progress * 68;

      liquidFill.style.height =
        `${fillPercent.toFixed(1)}%`;

      if (
        secondsLeft !== currentDisplayed &&
        elapsed < totalDuration
      ) {

        currentDisplayed = secondsLeft;

        countdownNum.textContent = String(secondsLeft);

        countdownNum.classList.add('pop');

        setTimeout(() => {
          countdownNum.classList.remove('pop');
        }, 180);
      }

      if (elapsed < totalDuration) {
        requestAnimationFrame(tick);
      } else {
        completeCountdown(destinationPromise);
      }
    }

    requestAnimationFrame(tick);
  }

  async function completeCountdown(destinationPromise) {

    finalRedirectUrl = await destinationPromise;

    if (hasError || !finalRedirectUrl) return;

    ringProgress.style.strokeDashoffset = '0';
    liquidFill.style.height = '90%';

    countdownNum.textContent = '0';

    statusHeading.textContent = 'ʟɪɴᴋ ʀᴇᴀᴅʏ';
    statusHeading.style.color = '#8df5c6';

    statusSub.textContent = 'ʏᴏᴜʀ ᴅᴏᴡɴʟᴏᴀᴅ ʟɪɴᴋ ɪꜱ ʀᴇᴀᴅʏ';

    btnSpinner.style.display = 'none';

    downloadBtnText.textContent = 'ᴘʀᴏᴄᴇᴇᴅ ᴛᴏ ᴅᴇꜱᴛɪɴᴀᴛɪᴏɴ';

    downloadBtn.href = finalRedirectUrl;

    downloadBtn.classList.add('ready');

    downloadBtn.setAttribute('aria-disabled', 'false');

    setTimeout(() => {
      window.location.href = finalRedirectUrl;
    }, 300);
  }

  downloadBtn.addEventListener('click', function (e) {

    if (!finalRedirectUrl || hasError) {
      e.preventDefault();
      return;
    }

    window.location.href = finalRedirectUrl;
  });

  startCountdown();

})();
</script>

</body>
</html>
