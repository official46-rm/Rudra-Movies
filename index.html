
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10182c">
<title>PREPARING YOUR DOWNLOAD LINK...</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --cyan: #45dcff;
    --blue: #398cff;
    --pink: #e34bca;
    --purple: #974bff;
}

body {
    min-height: 100vh;
    padding: 24px 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    color: white;
    font-family: 'Poppins', sans-serif;
    background:
        radial-gradient(ellipse at 8% 25%, rgba(0,205,255,.38), transparent 34%),
        radial-gradient(ellipse at 95% 75%, rgba(205,35,220,.36), transparent 37%),
        radial-gradient(ellipse at 85% 12%, rgba(90,65,190,.20), transparent 35%),
        linear-gradient(145deg, #071426 0%, #11182d 55%, #090d20 100%);
}

.glow {
    position: fixed;
    width: 210px;
    height: 210px;
    border-radius: 50%;
    filter: blur(85px);
    opacity: .35;
    pointer-events: none;
    z-index: 0;
}

.glow.cyan {
    top: 10%;
    left: -110px;
    background: #00d9ff;
}

.glow.pink {
    right: -110px;
    bottom: 10%;
    background: #ec36d0;
}

.card {
    width: 100%;
    max-width: 365px;
    position: relative;
    z-index: 1;
    overflow: hidden;
    padding: 25px 20px 21px;
    text-align: center;
    border-radius: 27px;
    background:
        linear-gradient(135deg,
            rgba(42,80,112,.43),
            rgba(22,31,57,.88) 48%,
            rgba(86,35,100,.37));
    border: 1px solid rgba(174,207,255,.35);
    box-shadow:
        0 0 25px rgba(0,191,255,.12),
        0 0 35px rgba(213,54,205,.10),
        0 25px 65px rgba(0,0,0,.45),
        inset 0 1px 1px rgba(255,255,255,.15);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
}

.card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 10%;
    width: 80%;
    height: 1px;
    background: linear-gradient(90deg, transparent, #8eeeff, #f29bff, transparent);
    opacity: .7;
}

/* LOGO */

.logo-box {
    width: 76px;
    height: 76px;
    padding: 3px;
    margin: 0 auto 12px;
    border-radius: 50%;
    background: #091426;
    border: 2px solid rgba(90,224,255,.9);
    box-shadow:
        0 0 10px rgba(0,218,255,.65),
        0 0 24px rgba(0,160,255,.30),
        0 0 30px rgba(217,75,220,.12);
    overflow: hidden;
}

.logo {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    border-radius: 50%;
}

.brand {
    font-family: 'Orbitron', sans-serif;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 1.8px;
    background: linear-gradient(90deg, #d9fbff, #55e4ff, #d69aff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.divider {
    width: 72px;
    height: 3px;
    margin: 15px auto 18px;
    border-radius: 20px;
    background: linear-gradient(90deg, var(--cyan), var(--blue), var(--pink));
    box-shadow:
        0 0 9px rgba(50,215,255,.65),
        0 0 15px rgba(217,70,220,.25);
}

.heading {
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #e5f8ff;
}

.description {
    margin-top: 7px;
    color: #a8b9ce;
    font-size: 9px;
    letter-spacing: 1.2px;
}

/* VERIFIED BADGE */

.verified {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin: 15px auto 0;
    padding: 8px 13px;
    border-radius: 30px;
    color: #58caff;
    background: rgba(20,157,206,.10);
    border: 1px solid rgba(65,208,245,.35);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .5px;
    box-shadow: 0 0 12px rgba(0,190,255,.08);
}

.verified-dot {
    width: 8px;
    height: 8px;
    flex: 0 0 8px;
    border-radius: 50%;
    background: #36e7ae;
    box-shadow: 0 0 9px #36e7ae;
}

/* 3D COUNTDOWN */

.timer-wrap {
    width: 158px;
    height: 158px;
    margin: 23px auto 20px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
}

.dotted-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px dashed rgba(84,210,255,.48);
    animation: rotateRing 18s linear infinite;
}

@keyframes rotateRing {
    to { transform: rotate(360deg); }
}

.ring-track {
    position: absolute;
    inset: 7px;
    border-radius: 50%;
    border: 3px solid rgba(70,177,222,.17);
    box-shadow:
        0 0 10px rgba(0,190,255,.10),
        inset 0 0 10px rgba(0,190,255,.06);
}

.progress-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
    z-index: 4;
    overflow: visible;
}

.progress-bg,
.progress-bar {
    fill: none;
    stroke-width: 4;
}

.progress-bg {
    stroke: rgba(95,190,235,.13);
}

.progress-bar {
    stroke: url(#progressGradient);
    stroke-linecap: round;
    stroke-dasharray: 414.69;
    stroke-dashoffset: 414.69;
    filter: drop-shadow(0 0 5px rgba(50,210,255,.85));
    transition: stroke-dashoffset 1s linear;
}

/* 3D INNER CIRCLE */

.circle {
    width: 119px;
    height: 119px;
    position: relative;
    overflow: hidden;
    border-radius: 50%;
    background:
        radial-gradient(circle at 32% 23%,
            #52647a 0%,
            #28394f 34%,
            #121d31 72%,
            #070e1c 100%);
    border: 2px solid rgba(107,196,239,.65);
    box-shadow:
        0 0 0 5px rgba(41,153,205,.10),
        0 0 18px rgba(30,191,255,.22),
        inset 0 5px 13px rgba(255,255,255,.12),
        inset 0 -12px 18px rgba(0,0,0,.55);
}

.circle::before {
    content: "";
    position: absolute;
    width: 95px;
    height: 55px;
    left: 10px;
    top: 7px;
    border-radius: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,.13), transparent);
    z-index: 2;
    pointer-events: none;
}

/* LIQUID WATER */

.water {
    position: absolute;
    bottom: 0;
    left: -50%;
    width: 200%;
    height: 0%;
    background: linear-gradient(
        180deg,
        rgba(48,218,239,.78),
        rgba(32,126,208,.80) 55%,
        rgba(119,55,174,.86)
    );
    transition: height 1s ease;
}

.wave {
    position: absolute;
    width: 200%;
    height: 18px;
    top: -10px;
    left: 0;
    border-radius: 40%;
    background: rgba(104,232,255,.70);
    animation: waveMove 4s linear infinite;
}

.wave.two {
    left: -50%;
    top: -7px;
    opacity: .32;
    animation-duration: 6s;
}

@keyframes waveMove {
    to { transform: rotate(360deg); }
}

.timer-content {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-shadow: 0 3px 10px rgba(0,0,0,.65);
}

#timer {
    font-family: 'Orbitron', sans-serif;
    font-size: 42px;
    font-weight: 800;
    line-height: 1;
    color: #fff;
}

.seconds {
    margin-top: 7px;
    font-size: 8px;
    letter-spacing: 3px;
    color: #e8f6ff;
}

/* STATUS */

.status {
    display: inline-block;
    padding: 9px 17px;
    margin-bottom: 17px;
    border-radius: 30px;
    color: #82eaff;
    background: rgba(20,157,206,.10);
    border: 1px solid rgba(65,208,245,.35);
    font-size: 9px;
    letter-spacing: 1.2px;
    box-shadow: 0 0 12px rgba(0,190,255,.08);
}

/* BUTTON */

.download-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 14px 10px;
    border-radius: 13px;
    text-decoration: none;
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #eafaff;
    background: linear-gradient(105deg, #087fae, #285fc0, #7546b9);
    border: 1px solid rgba(126,206,255,.27);
    box-shadow:
        0 5px 16px rgba(0,0,0,.23),
        inset 0 1px 1px rgba(255,255,255,.15);
    opacity: .72;
    pointer-events: none;
    transition: .3s;
}

.spinner {
    width: 17px;
    height: 17px;
    border: 2px solid rgba(220,240,255,.35);
    border-top-color: #75eaff;
    border-radius: 50%;
    animation: spin .8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.download-btn.ready {
    opacity: 1;
    pointer-events: auto;
    background: linear-gradient(100deg, #16b9dc, #427ee8, #a24cce);
    box-shadow:
        0 0 18px rgba(34,191,255,.25),
        0 0 18px rgba(214,65,208,.15);
}

.download-btn.ready:hover {
    transform: translateY(-2px);
}

/* TELEGRAM */

.telegram {
    display: block;
    margin-top: 12px;
    padding: 12px 8px;
    border-radius: 11px;
    color: #edf8ff;
    text-decoration: none;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .7px;
    background: linear-gradient(
        110deg,
        rgba(60,185,225,.13),
        rgba(175,66,185,.15)
    );
    border: 1px solid rgba(190,180,255,.22);
}

.footer {
    margin-top: 17px;
    color: #8498b0;
    font-size: 8px;
    font-weight: 600;
    letter-spacing: 1.4px;
}

/* SMALL CAPS */

.brand,
.heading,
.description,
.verified,
.seconds,
.status,
.download-btn,
.telegram,
.footer {
    font-variant: small-caps;
}

@media(max-width:380px) {
    .card {
        padding: 22px 17px 19px;
    }
}
</style>
</head>

<body>

<div class="glow cyan"></div>
<div class="glow pink"></div>

<main class="card">

    <div class="logo-box">
        <img src="RudraMovies.png"
             class="logo"
             alt="Rudra Movies Logo">
    </div>

    <div class="brand">RUDRA MOVIES</div>
    <div class="divider"></div>

    <div class="heading">SECURITY VERIFICATION</div>
    <div class="description">REDIRECTING IN PROGRESS...</div>

    <div class="verified">
        <span class="verified-dot"></span>
        SECURED &amp; VERIFIED LINK
    </div>

    <!-- 3D LIQUID COUNTDOWN -->

    <div class="timer-wrap">

        <div class="dotted-ring"></div>
        <div class="ring-track"></div>

        <svg class="progress-svg" viewBox="0 0 146 146">
            <defs>
                <linearGradient id="progressGradient"
                    x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#36e8ff"/>
                    <stop offset="50%" stop-color="#398aff"/>
                    <stop offset="100%" stop-color="#ef64d8"/>
                </linearGradient>
            </defs>

            <circle class="progress-bg" cx="73" cy="73" r="66"/>
            <circle class="progress-bar" id="progress" cx="73" cy="73" r="66"/>
        </svg>

        <div class="circle">
            <div class="water" id="water">
                <div class="wave"></div>
                <div class="wave two"></div>
            </div>

            <div class="timer-content">
                <div id="timer">5</div>
                <div class="seconds">SECONDS</div>
            </div>
        </div>
    </div>

    <div class="status" id="status">PREPARING YOUR LINK...</div>

    <a href="#" class="download-btn" id="downloadBtn" aria-disabled="true">
        <span class="spinner" id="spinner"></span>
        <span id="buttonText">VERIFYING...</span>
    </a>

    <a href="https://t.me/RudraMoviez"
       class="telegram"
       target="_blank"
       rel="noopener noreferrer">
        ➤ &nbsp; ⚡ RUDRA MAIN CHANNEL ✨
    </a>

    <div class="footer">
        ⚡ RUDRA MOVIES SECURITY
    </div>

</main>

<script>
const timer = document.getElementById("timer");
const water = document.getElementById("water");
const progress = document.getElementById("progress");
const status = document.getElementById("status");
const button = document.getElementById("downloadBtn");
const buttonText = document.getElementById("buttonText");
const spinner = document.getElementById("spinner");

const TOTAL_SECONDS = 5;
const circumference = 2 * Math.PI * 66;

progress.style.strokeDasharray = circumference;
progress.style.strokeDashoffset = circumference;

/* GET DOWNLOAD LINK */

const params = new URLSearchParams(window.location.search);
const redirect = params.get("redirect");

let safeLink = null;

if (redirect) {
    try {
        const parsed = new URL(redirect);

        if (parsed.protocol === "https:") {
            safeLink = parsed.href;
        }
    } catch (error) {
        safeLink = null;
    }
}

let seconds = TOTAL_SECONDS;

function countdown() {

    timer.textContent = seconds;

    const completed =
        (TOTAL_SECONDS - seconds) / TOTAL_SECONDS;

    water.style.height = (completed * 100) + "%";

    progress.style.strokeDashoffset =
        circumference * (1 - completed);

    if (seconds > 0) {
        seconds--;
        setTimeout(countdown, 1000);
    } else {
        finishCountdown();
    }
}

function finishCountdown() {

    timer.textContent = "0";
    water.style.height = "100%";
    progress.style.strokeDashoffset = 0;

    if (safeLink) {

        status.textContent = "YOUR LINK IS READY";

        buttonText.textContent = "DOWNLOAD NOW";
        spinner.style.display = "none";

        button.href = safeLink;
        button.classList.add("ready");
        button.setAttribute("aria-disabled", "false");

    } else {

        status.textContent = "DIRECT LINK NOT FOUND";

        buttonText.textContent = "LINK UNAVAILABLE";
        spinner.style.display = "none";

        button.removeAttribute("href");
        button.setAttribute("aria-disabled", "true");
    }
}

button.addEventListener("click", function(event) {
    if (!safeLink || !button.classList.contains("ready")) {
        event.preventDefault();
    }
});

countdown();
</script>

</body>
</html>
