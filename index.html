
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080710">
<title>RUDRA MOVIES | DOWNLOAD</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --gold: #e8bd69;
    --gold-light: #ffe5a3;
    --purple: #9b64ff;
}

body {
    min-height: 100vh;
    padding: 25px 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    color: white;
    font-family: 'Poppins', sans-serif;
    background:
        radial-gradient(ellipse at 10% 15%, rgba(126,72,180,.23), transparent 40%),
        radial-gradient(ellipse at 90% 85%, rgba(207,151,66,.19), transparent 40%),
        linear-gradient(145deg,#080710,#151020 55%,#090710);
}

.glow {
    position: fixed;
    width: 230px;
    height: 230px;
    border-radius: 50%;
    filter: blur(100px);
    opacity: .3;
    pointer-events: none;
}

.glow.one {
    background: #914aff;
    top: -100px;
    left: -100px;
}

.glow.two {
    background: #e9ae4d;
    bottom: -100px;
    right: -100px;
}

.card {
    width: 100%;
    max-width: 375px;
    position: relative;
    z-index: 1;
    overflow: hidden;
    padding: 27px 21px 23px;
    text-align: center;
    border-radius: 25px;
    background: linear-gradient(145deg,
        rgba(57,42,77,.84),
        rgba(17,14,27,.97) 55%,
        rgba(64,43,39,.75));
    border: 1px solid rgba(232,189,105,.45);
    box-shadow:
        0 0 30px rgba(170,110,255,.13),
        0 0 35px rgba(232,189,105,.12),
        0 25px 70px rgba(0,0,0,.65),
        inset 0 1px 1px rgba(255,255,255,.15);
    backdrop-filter: blur(20px);
}

.card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 8%;
    width: 84%;
    height: 2px;
    background: linear-gradient(
        90deg,transparent,var(--gold-light),var(--purple),transparent
    );
}

/* LOGO */

.logo-box {
    width: 82px;
    height: 82px;
    padding: 3px;
    margin: 0 auto 13px;
    border-radius: 50%;
    background: #100d18;
    border: 2px solid var(--gold);
    box-shadow: 0 0 22px rgba(232,189,105,.35);
    overflow: hidden;
}

.logo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
}

.brand {
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(90deg,#fff0bf,#dba94e,#fff1c4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.divider {
    width: 75px;
    height: 3px;
    margin: 15px auto 19px;
    border-radius: 20px;
    background: linear-gradient(90deg,var(--gold),var(--purple));
    box-shadow: 0 0 12px rgba(232,189,105,.4);
}

.heading {
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.4px;
    color: var(--gold-light);
}

.description {
    margin-top: 8px;
    color: #c2b8d1;
    font-size: 10px;
    letter-spacing: 1px;
}

/* VERIFICATION */

.verified {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin: 16px auto 0;
    padding: 8px 14px;
    border-radius: 30px;
    color: #e8ce91;
    background: rgba(211,166,87,.09);
    border: 1px solid rgba(232,189,105,.35);
    font-size: 9px;
    font-weight: 700;
}

.verified-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #48e3a3;
    box-shadow: 0 0 9px #48e3a3;
}

/* COUNTDOWN */

.timer-wrap {
    width: 160px;
    height: 160px;
    margin: 24px auto 20px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
}

.dotted-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px dashed rgba(232,189,105,.62);
    box-shadow: 0 0 12px rgba(232,189,105,.18);
    animation: rotate 10s linear infinite;
}

@keyframes rotate {
    to { transform: rotate(360deg); }
}

.ring-track {
    position: absolute;
    inset: 7px;
    border-radius: 50%;
    border: 3px solid rgba(232,189,105,.12);
}

.progress-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
    z-index: 4;
}

.progress-bg,
.progress-bar {
    fill: none;
    stroke-width: 4;
}

.progress-bg {
    stroke: rgba(232,189,105,.12);
}

.progress-bar {
    stroke: url(#goldGradient);
    stroke-linecap: round;
    filter: drop-shadow(0 0 5px rgba(232,189,105,.8));
    transition: stroke-dashoffset 1s linear;
}

/* TRANSPARENT 3D GLASS SPHERE */

.circle {
    width: 120px;
    height: 120px;
    position: relative;
    overflow: hidden;
    isolation: isolate;
    border-radius: 50%;

    /* Transparent glass body */
    background: rgba(255,255,255,.035);

    /* Realistic glass edge */
    border: 2px solid rgba(255,255,255,.72);

    box-shadow:
        0 0 0 2px rgba(255,255,255,.08),
        0 0 22px rgba(180,150,255,.20),
        inset 0 0 12px rgba(255,255,255,.12),
        inset 0 0 25px rgba(255,255,255,.06);

    backdrop-filter: blur(2px);
}

/* Only natural glass reflection on the outer surface */
.circle::before {
    content: "";
    position: absolute;
    inset: 2px;
    z-index: 3;
    border-radius: 50%;
    border-top: 2px solid rgba(255,255,255,.68);
    border-left: 1px solid rgba(255,255,255,.28);
    pointer-events: none;
}

.circle::after {
    content: "";
    position: absolute;
    top: 10px;
    left: 19px;
    width: 30px;
    height: 8px;
    z-index: 3;
    border-radius: 50%;
    transform: rotate(-35deg);
    background: rgba(255,255,255,.32);
    filter: blur(3px);
    pointer-events: none;
}

/* LIQUID INSIDE GLASS */

.water {
    position: absolute;
    z-index: 1;
    bottom: 0;
    left: -50%;
    width: 200%;
    height: 0%;

    background: linear-gradient(
        180deg,
        rgba(190,160,255,.88) 0%,
        rgba(135,105,235,.91) 35%,
        rgba(85,60,190,.96) 100%
    );

    transition: height 1s linear;
}

/* Natural moving water surface */
.wave {
    position: absolute;
    top: -11px;
    left: 0;
    width: 200%;
    height: 22px;
    border-radius: 45%;

    background: rgba(220,205,255,.82);

    animation: liquidMove 2.4s ease-in-out infinite alternate;
    transform-origin: center;
}

@keyframes liquidMove {
    0% {
        transform: translateY(4px) rotate(-3deg) scaleY(.92);
    }

    50% {
        transform: translateY(-5px) rotate(3deg) scaleY(1.08);
    }

    100% {
        transform: translateY(3px) rotate(-2deg) scaleY(.95);
    }
}

/* TIMER TEXT */

.timer-content {
    position: absolute;
    inset: 0;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-shadow: 0 3px 10px rgba(0,0,0,.7);
}

#timer {
    font-family: 'Orbitron',sans-serif;
    font-size: 42px;
    font-weight: 800;
    color: #fff;
}

.seconds {
    margin-top: 5px;
    font-size: 8px;
    letter-spacing: 3px;
    color: #fff0c8;
}

/* STATUS */

.status {
    display: inline-block;
    padding: 9px 17px;
    margin-bottom: 17px;
    border-radius: 30px;
    color: #f0d49b;
    background: rgba(232,189,105,.08);
    border: 1px solid rgba(232,189,105,.3);
    font-size: 9px;
    letter-spacing: 1px;
}

/* DOWNLOAD BUTTON */

.download-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 15px 10px;
    border-radius: 13px;
    text-decoration: none;
    font-family: 'Orbitron',sans-serif;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #21170b;
    background: linear-gradient(105deg,#ffe8ad,#d8a34b,#f5d28b);
    border: 1px solid rgba(255,235,181,.6);
    box-shadow:
        0 5px 20px rgba(0,0,0,.3),
        0 0 18px rgba(232,189,105,.15);
    opacity: .6;
    pointer-events: none;
    transition: .3s;
}

.download-btn.ready {
    opacity: 1;
    pointer-events: auto;
    box-shadow: 0 0 22px rgba(232,189,105,.35);
}

.spinner {
    width: 17px;
    height: 17px;
    border: 2px solid rgba(50,30,10,.25);
    border-top-color: #37220b;
    border-radius: 50%;
    animation: spin .8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* TELEGRAM */

.telegram {
    display: block;
    margin-top: 12px;
    padding: 12px 8px;
    border-radius: 11px;
    color: #f6e7c5;
    text-decoration: none;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .7px;
    background: rgba(147,100,190,.12);
    border: 1px solid rgba(190,150,220,.25);
}

.footer {
    margin-top: 18px;
    color: #b2a4bb;
    font-size: 8px;
    font-weight: 600;
    letter-spacing: 1.4px;
}

/* SMALL CAPS */

.brand,
.heading,
.description,
.verified,
.seconds,
.status,
.download-btn,
.telegram,
.footer {
    font-variant: small-caps;
}

@media(max-width:380px) {
    .card {
        padding: 22px 17px 19px;
    }
}
</style>
</head>

<body>

<div class="glow one"></div>
<div class="glow two"></div>

<main class="card">

    <div class="logo-box">
        <img src="/RudraMovies.png"
             class="logo"
             alt="Rudra Movies Logo">
    </div>

    <div class="brand">RUDRA MOVIES</div>
    <div class="divider"></div>

    <div class="heading">SECURITY VERIFICATION</div>
    <div class="description">PREPARING YOUR DOWNLOAD LINK...</div>

    <div class="verified">
        <span class="verified-dot"></span>
        SECURE LINK VERIFICATION
    </div>

    <div class="timer-wrap">

        <div class="dotted-ring"></div>
        <div class="ring-track"></div>

        <svg class="progress-svg" viewBox="0 0 146 146">
            <defs>
                <linearGradient id="goldGradient"
                    x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#fff0bd"/>
                    <stop offset="50%" stop-color="#dba94e"/>
                    <stop offset="100%" stop-color="#a66aff"/>
                </linearGradient>
            </defs>

            <circle class="progress-bg" cx="73" cy="73" r="66"/>
            <circle class="progress-bar" id="progress" cx="73" cy="73" r="66"/>
        </svg>

        <div class="circle">
            <div class="water" id="water">
                <div class="wave"></div>
            </div>

            <div class="timer-content">
                <div id="timer">5</div>
                <div class="seconds">SECONDS</div>
            </div>
        </div>

    </div>

    <div class="status" id="status">PREPARING YOUR LINK...</div>

    <a href="#" class="download-btn" id="downloadBtn" aria-disabled="true">
        <span class="spinner" id="spinner"></span>
        <span id="buttonText">VERIFYING...</span>
    </a>

    <a href="https://t.me/RudraMoviez"
       class="telegram"
       target="_blank"
       rel="noopener noreferrer">
        ➤ &nbsp; RUDRA MAIN CHANNEL
    </a>

    <div class="footer">
        RUDRA MOVIES SECURITY
    </div>

</main>

<script>
const timer = document.getElementById("timer");
const water = document.getElementById("water");
const progress = document.getElementById("progress");
const status = document.getElementById("status");
const button = document.getElementById("downloadBtn");
const buttonText = document.getElementById("buttonText");
const spinner = document.getElementById("spinner");

const TOTAL_SECONDS = 5;
const circumference = 2 * Math.PI * 66;

progress.style.strokeDasharray = circumference;
progress.style.strokeDashoffset = circumference;

const params = new URLSearchParams(window.location.search);
const token = params.get("token");
const redirect = params.get("redirect");

let safeLink = null;

/* EXISTING FILE STORE BOT LINK */
if (redirect) {
    try {
        const parsed = new URL(redirect);

        if (parsed.protocol === "https:") {
            safeLink = parsed.href;
        }
    } catch (error) {
        safeLink = null;
    }
}

/* TOKEN LINK SUPPORT */
else if (token) {
    safeLink = "/api/verify?token=" + encodeURIComponent(token);
}

let seconds = TOTAL_SECONDS;

function countdown() {

    timer.textContent = seconds;

    const completed =
        (TOTAL_SECONDS - seconds) / TOTAL_SECONDS;

    water.style.height = (completed * 100) + "%";

    progress.style.strokeDashoffset =
        circumference * (1 - completed);

    if (seconds > 0) {
        seconds--;
        setTimeout(countdown, 1000);
    } else {
        finishCountdown();
    }
}

function finishCountdown() {

    timer.textContent = "0";
    water.style.height = "100%";
    progress.style.strokeDashoffset = 0;

    if (safeLink) {

        status.textContent = "YOUR LINK IS READY";

        buttonText.textContent = "DOWNLOAD NOW";
        spinner.style.display = "none";

        button.href = safeLink;
        button.classList.add("ready");
        button.setAttribute("aria-disabled", "false");

        // Show Download Now briefly, then redirect automatically.
        setTimeout(() => {
            window.location.replace(safeLink);
        }, 650);

    } else {

        status.textContent = "DIRECT LINK NOT FOUND";

        buttonText.textContent = "LINK UNAVAILABLE";
        spinner.style.display = "none";

        button.removeAttribute("href");
        button.setAttribute("aria-disabled", "true");
    }
}

button.addEventListener("click", function(event) {
    if (!safeLink || !button.classList.contains("ready")) {
        event.preventDefault();
    }
});

countdown();
</script>

</body>
</html>
