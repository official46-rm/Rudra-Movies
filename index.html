<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUDRA MOVIES | Link Portal</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  font-family: Arial, sans-serif;
  color: #fff;
  background:
    radial-gradient(circle at 15% 15%, #163b72 0, transparent 35%),
    radial-gradient(circle at 85% 90%, #4c176e 0, transparent 35%),
    #060b18;
}

.card {
  width: 100%;
  max-width: 520px;
  padding: 35px 24px;
  text-align: center;
  border: 1px solid #174b65;
  border-radius: 28px;
  background: linear-gradient(145deg, #141e38, #0b1023);
  box-shadow: 0 0 35px #00d9ff18;
  position: relative;
  overflow: hidden;
}

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 3px;
  background: linear-gradient(90deg, #00eaff, #8b5cf6, #ff40bd);
}

.logo {
  width: 112px;
  height: 112px;
  margin: 12px auto 22px;
  border-radius: 50%;
  border: 3px solid #00eaff;
  background: white;
  object-fit: contain;
  box-shadow: 0 0 25px #00eaff50;
}

h1 {
  margin: 0;
  font-size: clamp(27px, 7vw, 38px);
  letter-spacing: 2px;
  background: linear-gradient(90deg, #8df7ff, #00d9ff, #b58cff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.subtitle {
  margin: 12px 0 28px;
  color: #9ba9c6;
  font-size: 12px;
  letter-spacing: 3px;
  line-height: 1.8;
}

.tag {
  display: inline-block;
  padding: 12px 22px;
  border: 1px solid #15536b;
  border-radius: 30px;
  color: #8df7ff;
  font-size: 12px;
  letter-spacing: 2px;
}

.timer {
  width: 160px;
  height: 160px;
  margin: 32px auto 25px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  position: relative;
  background: conic-gradient(
    #00eaff var(--progress, 100%),
    #29334d 0
  );
  animation: glow 2s ease-in-out infinite alternate;
}

.timer::before {
  content: "";
  position: absolute;
  inset: 9px;
  border-radius: 50%;
  background: #10182d;
}

#count {
  position: relative;
  z-index: 1;
  font-size: 60px;
  font-weight: 800;
}

.status-label {
  color: #8f9cb9;
  font-size: 12px;
  letter-spacing: 3px;
}

.status {
  margin: 14px 0 30px;
  color: #00eaff;
  font-weight: bold;
  font-size: 14px;
}

.wait {
  padding: 22px 12px;
  border-radius: 17px;
  border: 1px solid #36415b;
  background: #1b2438;
  color: #aab6cf;
  font-weight: bold;
  font-size: 14px;
}

.button {
  display: block;
  margin-top: 18px;
  padding: 20px 12px;
  border-radius: 16px;
  text-decoration: none;
  color: white;
  font-weight: 800;
  letter-spacing: 1px;
  background: linear-gradient(100deg, #6950f5, #b13bea);
  box-shadow: 0 8px 28px #8c39ef30;
  transition: transform .2s, filter .2s;
}

.button:active {
  transform: scale(.97);
}

.footer {
  margin-top: 34px;
  color: #687691;
  font-size: 11px;
  letter-spacing: 2px;
}

@keyframes glow {
  from { box-shadow: 0 0 12px #00eaff20; }
  to { box-shadow: 0 0 32px #00eaff55; }
}
</style>
</head>

<body>
<main class="card">
  <!-- Replace this with your logo image URL -->
  <img class="logo" src="RudraMovies.png" alt="Rudra Movies Logo">

  <h1>RUDRA MOVIES</h1>
  <p class="subtitle">YOUR ENTERTAINMENT DESTINATION</p>

  <div class="tag">● &nbsp; LINK REDIRECT</div>

  <div class="timer" id="timer">
    <span id="count">5</span>
  </div>

  <div class="status-label">LINK STATUS</div>
  <p class="status" id="status">PREPARING YOUR LINK...</p>

  <div class="wait" id="wait">PLEASE WAIT (5s)</div>

  <!-- Replace the # with your official channel URL -->
  <a class="button" href="https://t.me/+AYGNnSIln8BkYjNl" target="_blank"
     rel="noopener noreferrer">
    ⚡ JOIN OFFICIAL CHANNEL ⚡
  </a>

  <div class="footer">RUDRA MOVIES · LINK PORTAL</div>
</main>

<script>
const total = 5;
let remaining = total;

const count = document.getElementById("count");
const status = document.getElementById("status");
const wait = document.getElementById("wait");
const timer = document.getElementById("timer");

function updateTimer() {
  count.textContent = remaining;

  const progress = (remaining / total) * 100;
  timer.style.setProperty("--progress", progress + "%");

  if (remaining > 0) {
    wait.textContent = `PLEASE WAIT (${remaining}s)`;
    remaining--;
    setTimeout(updateTimer, 1000);
  } else {
    status.textContent = "YOUR LINK IS READY";
    wait.textContent = "CONTINUE TO YOUR LINK";
  }
}

updateTimer();
</script>
</body>
</html>
