
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PREPARING YOUR DOWNLOAD LINK...</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
    font-family: 'Poppins', sans-serif;
    color: #fff;

    background:
      radial-gradient(circle at 15% 20%, #087bbd 0%, transparent 35%),
      radial-gradient(circle at 90% 80%, #8124b8 0%, transparent 38%),
      radial-gradient(circle at 80% 10%, #c12b8d 0%, transparent 30%),
      linear-gradient(135deg, #061326, #10152c, #080d20);
}

/* BACKGROUND GLOW */

body::before,
body::after {
    content: "";
    position: fixed;
    width: 240px;
    height: 240px;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .35;
    z-index: -1;
    pointer-events: none;
}

body::before {
    background: #00c8ff;
    top: 10%;
    left: -100px;
}

body::after {
    background: #a020ff;
    right: -100px;
    bottom: 10%;
}

/* MAIN CARD */

.card {
    width: 100%;
    max-width: 355px;
    padding: 22px 20px 19px;
    text-align: center;
    position: relative;
    overflow: hidden;
    border-radius: 19px;

    background: rgba(15, 31, 54, .78);
    border: 1px solid rgba(130, 205, 255, .32);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:
      0 15px 50px rgba(0,0,0,.4),
      0 0 30px rgba(0,180,255,.10);
}

/* TOP LOGO */

.logo-box {
    width: 58px;
    height: 58px;
    margin: 0 auto 9px;
    border-radius: 50%;
    padding: 3px;
    background: #071629;
    border: 2px solid #35dfff;
    box-shadow: 0 0 15px rgba(0,210,255,.6);
    overflow: hidden;
}

.logo {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    border-radius: 50%;
}

.brand {
    font-family: 'Orbitron', sans-serif;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 1.5px;
    background: linear-gradient(90deg,#fff,#48e1ff,#b18aff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.tagline {
    margin-top: 4px;
    font-size: 7px;
    letter-spacing: 2px;
    color: #9ab4ca;
}

.secure-badge {
    display: inline-block;
    margin-top: 11px;
    padding: 5px 10px;
    border: 1px solid rgba(48,224,255,.35);
    border-radius: 20px;
    background: rgba(0,190,255,.09);
    color: #64eaff;
    font-size: 7px;
    letter-spacing: 1px;
}

/* COUNTDOWN AREA */

.timer-wrap {
    width: 112px;
    height: 112px;
    margin: 19px auto 13px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
}

/* OUTER RING */

.outer-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid rgba(65,210,255,.25);
}

.dotted-ring {
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    border: 2px dashed rgba(55,218,255,.75);
    animation: rotate 12s linear infinite;
}

@keyframes rotate {
    to { transform: rotate(360deg); }
}

/* SVG PROGRESS */

.progress-svg {
    position: absolute;
    width: 100%;
    height: 100%;
    inset: 0;
    transform: rotate(-90deg);
    overflow: visible;
}

.progress-bg,
.progress {
    fill: none;
    stroke-width: 3;
}

.progress-bg {
    stroke: rgba(70,210,255,.16);
}

.progress {
    stroke: #3ee5ff;
    stroke-linecap: round;
    stroke-dasharray: 301.59;
    stroke-dashoffset: 0;
    filter: drop-shadow(0 0 5px #24dfff);
    transition: stroke-dashoffset 1s linear;
}

/* INNER CIRCLE */

.circle {
    width: 91px;
    height: 91px;
    border-radius: 50%;
    position: relative;
    overflow: hidden;
    background: #07192c;
    border: 2px solid #32dfff;
    box-shadow:
      0 0 15px rgba(0,205,255,.35),
      inset 0 0 15px rgba(0,0,0,.4);
}

/* LIQUID WATER */

.water {
    position: absolute;
    left: -50%;
    bottom: 0;
    width: 200%;
    height: 0%;
    background: linear-gradient(
      180deg,
      #52eaff,
      #0da9e9 55%,
      #1760c4
    );
    transition: height 1s linear;
}

.wave {
    position: absolute;
    width: 200%;
    height: 18px;
    top: -10px;
    left: 0;
    border-radius: 40%;
    background: rgba(123,238,255,.8);
    animation: wave 4s linear infinite;
}

.wave.two {
    left: -50%;
    opacity: .35;
    animation-duration: 6s;
}

@keyframes wave {
    to { transform: rotate(360deg); }
}

/* TIMER NUMBER */

.timer-content {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-shadow: 0 2px 7px #00101e;
}

#timer {
    font-family: 'Orbitron', sans-serif;
    font-size: 34px;
    font-weight: 800;
    line-height: 1;
}

.seconds {
    margin-top: 5px;
    font-size: 7px;
    letter-spacing: 2.5px;
}

/* TEXT */

.heading {
    margin-top: 14px;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    letter-spacing: 1.5px;
}

.status-text {
    margin-top: 5px;
    font-size: 8px;
    color: #9bb1c6;
    letter-spacing: .7px;
}

/* STATUS BAR */

.status-bar {
    margin-top: 13px;
    padding: 9px;
    border-radius: 7px;
    border: 1px solid rgba(55,210,255,.23);
    background: rgba(0,160,255,.12);
    color: #72e5ff;
    font-size: 8px;
    letter-spacing: 1px;
}

/* DOWNLOAD BUTTON */

.download-btn {
    display: block;
    width: 100%;
    margin-top: 10px;
    padding: 11px 8px;
    border-radius: 8px;
    text-decoration: none;
    font-family: 'Orbitron', sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .8px;
    color: white;
    background: linear-gradient(100deg,#087fc3,#2169d2);
    border: 1px solid rgba(100,220,255,.25);
    opacity: .6;
    pointer-events: none;
    transition: .3s;
}

.download-btn.ready {
    opacity: 1;
    pointer-events: auto;
    background: linear-gradient(100deg,#08b8ed,#665be9);
    box-shadow: 0 0 17px rgba(0,180,255,.28);
}

.download-btn.ready:hover {
    transform: translateY(-2px);
}

/* TELEGRAM BUTTON */

.telegram {
    display: block;
    margin-top: 9px;
    padding: 10px;
    text-decoration: none;
    color: #e9f7ff;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.13);
    border-radius: 8px;
    font-size: 8px;
    letter-spacing: .8px;
}

.footer {
    margin-top: 12px;
    color: #8298b0;
    font-size: 6px;
    letter-spacing: 1.5px;
}

@media(max-width:380px) {
    .card {
        max-width: 330px;
        padding: 20px 16px;
    }
}
</style>
</head>

<body>

<div class="card">

    <div class="logo-box">
        <img src="RudraMovies.png" class="logo" alt="Rudra Movies">
    </div>

    <div class="brand">RUDRA MOVIES</div>

    <div class="tagline">
        PROVIDE THOUSANDS OF MOVIES
    </div>

    <div class="secure-badge">
        ✦ LINK PREPARATION ✦
    </div>

    <!-- COUNTDOWN CIRCLE -->

    <div class="timer-wrap">

        <div class="outer-ring"></div>
        <div class="dotted-ring"></div>

        <svg class="progress-svg" viewBox="0 0 112 112">
            <circle class="progress-bg"
                cx="56" cy="56" r="48"/>

            <circle class="progress"
                id="progress"
                cx="56" cy="56" r="48"/>
        </svg>

        <div class="circle">

            <div class="water" id="water">
                <div class="wave"></div>
                <div class="wave two"></div>
            </div>

            <div class="timer-content">
                <div id="timer">5</div>
                <div class="seconds">SECONDS</div>
            </div>

        </div>
    </div>

    <div class="heading">
        LINK PREPARATION
    </div>

    <div class="status-text" id="statusText">
        Preparing your download link...
    </div>

    <div class="status-bar" id="statusBar">
        ◉ PREPARING YOUR LINK...
    </div>

    <a href="#" class="download-btn" id="downloadBtn">
        ➤ PLEASE WAIT...
    </a>

    <a href="https://t.me/RudraMoviez"
       class="telegram"
       target="_blank"
       rel="noopener noreferrer">
        ➤ JOIN OUR TELEGRAM CHANNEL
    </a>

    <div class="footer">
        RUDRA MOVIES • FAST • SIMPLE • CINEMATIC
    </div>

</div>

<script>
const timer = document.getElementById("timer");
const water = document.getElementById("water");
const progress = document.getElementById("progress");
const statusText = document.getElementById("statusText");
const statusBar = document.getElementById("statusBar");
const downloadBtn = document.getElementById("downloadBtn");

const params = new URLSearchParams(window.location.search);
const redirect = params.get("redirect");

let safeLink = null;

if (redirect) {
    try {
        const parsed = new URL(redirect);

        if (parsed.protocol === "https:") {
            safeLink = parsed.href;
        }
    } catch (error) {
        safeLink = null;
    }
}

let seconds = 5;
const circumference = 2 * Math.PI * 48;

progress.style.strokeDasharray = circumference;
progress.style.strokeDashoffset = 0;

function updateCountdown() {

    timer.textContent = seconds;

    const completed = (5 - seconds) / 5;

    water.style.height = (completed * 100) + "%";

    progress.style.strokeDashoffset =
        circumference * completed;

    if (seconds > 0) {
        seconds--;
        setTimeout(updateCountdown, 1000);
    } else {
        finishCountdown();
    }
}

function finishCountdown() {

    timer.textContent = "✓";
    water.style.height = "100%";

    if (safeLink) {

        statusText.textContent = "Your download link is ready.";

        statusBar.textContent = "✓ YOUR LINK IS READY";

        downloadBtn.textContent = "➤ PROCEED TO DESTINATION →";
        downloadBtn.href = safeLink;
        downloadBtn.classList.add("ready");

    } else {

        statusText.textContent = "No valid download destination was provided.";

        statusBar.textContent = "LINK NOT AVAILABLE";

        downloadBtn.textContent = "LINK UNAVAILABLE";
        downloadBtn.removeAttribute("href");
    }
}

updateCountdown();
</script>

</body>
</html>
