<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUDRA MOVIES - Secure Link</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #030712;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      padding: 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* ನಿಯಾನ್ ಬ್ಯಾಕ್‌ಗ್ರೌಂಡ್ ಗ್ಲೋ */
    .bg-glow-1 {
      position: absolute;
      width: 240px;
      height: 240px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.25), transparent 70%);
      top: 15%;
      left: 10%;
      filter: blur(50px);
      z-index: 0;
    }
    .bg-glow-2 {
      position: absolute;
      width: 240px;
      height: 240px;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.22), transparent 70%);
      bottom: 15%;
      right: 10%;
      filter: blur(50px);
      z-index: 0;
    }

    /* ಪ್ರೀಮಿಯಂ ಗ್ಲಾಸ್ ಕಾರ್ಡ್ */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 28px 20px;
      width: 100%;
      max-width: 350px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 25px rgba(6, 182, 212, 0.15);
    }

    /* ಲೋಗೋ */
    .logo-wrapper {
      position: relative;
      width: 72px;
      height: 72px;
      margin: 0 auto 10px;
    }
    .logo-wrapper::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      background: linear-gradient(45deg, #00f2fe, #f093fb);
      animation: spin 6s linear infinite;
      filter: blur(3px);
    }
    .logo-img {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #0284c7;
      border: 2px solid rgba(255, 255, 255, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      z-index: 1;
    }

    /* ನಾರ್ಮಲ್ & ಕ್ಲೀನ್ ಹೆಡ್ಡಿಂಗ್ */
    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #38bdf8, #c084fc, #38bdf8);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 4s linear infinite;
      margin-top: 4px;
    }

    .security-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      font-size: 10px;
      font-weight: 700;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 4px 12px;
      border-radius: 20px;
      letter-spacing: 1px;
    }
    .security-badge span {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e;
    }

    /* ಟೈಮರ್ ಕಂಟೈನರ್ */
    .timer-container {
      position: relative;
      width: 170px;
      height: 170px;
      margin: 22px auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ಹೊರಗಿನ ತಿರುಗುವ ಡ್ಯಾಶ್ಡ್ ಸರ್ಕಲ್ */
    .outer-circle {
      position: absolute;
      width: 168px;
      height: 168px;
      border-radius: 50%;
      border: 1.5px dashed rgba(56, 189, 248, 0.35);
      animation: spin 10s linear infinite;
    }

    /* ಒಳಗಿನ ತಿರುಗುವ ಡಾಟ್ ಸರ್ಕಲ್ */
    .inner-circle {
      position: absolute;
      width: 148px;
      height: 148px;
      border-radius: 50%;
      border: 1.5px dotted rgba(232, 121, 249, 0.45);
      animation: spinReverse 7s linear infinite;
    }

    /* ತಿರುಗುವ ನಿಯಾನ್ ಆರೋಗಳು */
    .orbit-arrows {
      position: absolute;
      width: 168px;
      height: 168px;
      animation: spin 3.2s linear infinite;
      pointer-events: none;
    }
    .arrow-top {
      position: absolute;
      top: -7px;
      left: calc(50% - 6px);
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 10px solid #00f2fe;
      transform: rotate(90deg);
      filter: drop-shadow(0 0 6px #00f2fe);
    }
    .arrow-bottom {
      position: absolute;
      bottom: -7px;
      left: calc(50% - 6px);
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 10px solid #f093fb;
      transform: rotate(-90deg);
      filter: drop-shadow(0 0 6px #f093fb);
    }

    /* 🔥 3D ವಾಟರ್ ವೇವ್ (Liquid Wave Circle) 🔥 */
    .liquid-circle {
      position: relative;
      width: 124px;
      height: 124px;
      border-radius: 50%;
      background: #091224;
      border: 3px solid #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4), inset 0 0 15px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .liquid-wave {
      position: absolute;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(180deg, rgba(6, 182, 212, 0.75) 0%, rgba(37, 99, 235, 0.95) 100%);
      border-radius: 40%;
      bottom: -170%; /* ಪ್ರಾರಂಭದಲ್ಲಿ ಕೆಳಗೆ ಇರುತ್ತದೆ */
      animation: waveRotate 6s linear infinite;
      transition: bottom 1s linear;
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.8);
    }

    .liquid-wave-behind {
      position: absolute;
      left: -50%;
      width: 200%;
      height: 200%;
      background: rgba(236, 72, 153, 0.35);
      border-radius: 43%;
      bottom: -165%;
      animation: waveRotate 4s linear infinite;
      transition: bottom 1s linear;
    }

    @keyframes waveRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .timer-number {
      position: relative;
      font-size: 38px;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
      z-index: 3;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes shine {
      to { background-position: 200% center; }
    }

    /* ಸ್ಟೇಟಸ್ ಟೆಕ್ಸ್ಟ್ */
    .status-badge {
      font-size: 11px;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 2px;
      font-weight: 700;
    }
    .status-highlight {
      font-size: 12px;
      color: #38bdf8;
      font-weight: 700;
      margin-top: 3px;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }

    /* ಬಟನ್‌ಗಳು */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
      transition: all 0.3s ease;
      letter-spacing: 0.8px;
      border: none;
    }
    .btn-disabled {
      background: rgba(30, 41, 59, 0.7);
      color: #64748b;
      cursor: not-allowed;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .btn-ready {
      background: linear-gradient(135deg, #0284c7, #6366f1);
      color: #fff;
      box-shadow: 0 0 20px rgba(2, 132, 199, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
    }
    .btn-telegram {
      background: linear-gradient(135deg, #0284c7 0%, #06b6d4 100%);
      color: #fff;
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>

  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <div class="card">
    <!-- ಲೋಗೋ -->
    <div class="logo-wrapper">
      <img src="RudraMovies.png" alt="RM" class="logo-img" onerror="this.outerHTML='<div class=\'logo-img\'>RM</div>';">
    </div>

    <!-- ನಾರ್ಮಲ್ ಹೆಡ್ಡಿಂಗ್ -->
    <div class="brand-title">RUDRA MOVIES</div>
    
    <div class="security-badge">
      <span></span> HIGH SECURED LINK
    </div>

    <!-- 3D ವಾಟರ್ ವೇವ್ ಕೌಂಟ್‌ಡೌನ್ -->
    <div class="timer-container">
      <div class="outer-circle"></div>
      <div class="inner-circle"></div>

      <div class="orbit-arrows">
        <div class="arrow-top"></div>
        <div class="arrow-bottom"></div>
      </div>

      <!-- ನೀರು ತುಂಬುವ ವೃತ್ತ -->
      <div class="liquid-circle">
        <div class="liquid-wave-behind" id="wave-behind"></div>
        <div class="liquid-wave" id="wave-front"></div>
        <div class="timer-number" id="timer">5</div>
      </div>
    </div>

    <div class="status-badge">LINK STATUS</div>
    <div class="status-highlight" id="status-msg">VERIFYING SECURED LINK...</div>

    <!-- ರೀಡೈರೆಕ್ಟ್ ಬಟನ್ -->
    <a id="action-btn" class="btn btn-disabled" href="#">PLEASE WAIT...</a>

    <!-- ಟೆಲಿಗ್ರಾಂ ಬಟನ್ -->
    <a href="https://t.me/RudraMoviez" target="_blank" class="btn btn-telegram">
      ⚡ JOIN OFFICIAL CHANNEL ⚡
    </a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetRedirect = urlParams.get('redirect');

    const totalSeconds = 5;
    let currentSeconds = totalSeconds;

    const timerText = document.getElementById('timer');
    const statusMsg = document.getElementById('status-msg');
    const actionBtn = document.getElementById('action-btn');
    const waveFront = document.getElementById('wave-front');
    const waveBehind = document.getElementById('wave-behind');

    // ವಾಟರ್ ಲೆವೆಲ್ ಹಂತಗಳು (-170% ಅಂದರೆ ಖಾಲಿ, -40% ಅಂದರೆ 100% ಪೂರ್ತಿ)
    const waveLevels = {
      5: { front: '-170%', behind: '-165%' },
      4: { front: '-140%', behind: '-135%' },
      3: { front: '-110%', behind: '-105%' },
      2: { front: '-80%', behind: '-75%' },
      1: { front: '-55%', behind: '-50%' },
      0: { front: '-35%', behind: '-30%' }
    };

    const interval = setInterval(() => {
      currentSeconds--;

      // ವಾಟರ್ ಅಲೆ ಮೇಲಕ್ಕೆ ತುಂಬಿಕೊಳ್ಳುವುದು
      if (waveLevels[currentSeconds]) {
        waveFront.style.bottom = waveLevels[currentSeconds].front;
        waveBehind.style.bottom = waveLevels[currentSeconds].behind;
      }

      if (currentSeconds > 0) {
        timerText.innerText = currentSeconds;
        actionBtn.innerText = `PLEASE WAIT (${currentSeconds}s)`;
        if (currentSeconds <= 2) {
          statusMsg.innerText = "FINALIZING DOWNLOAD LINK...";
        }
      } else {
        clearInterval(interval);
        timerText.innerText = "✓";
        statusMsg.innerText = "VERIFICATION COMPLETE! LINK READY";

        if (targetRedirect) {
          actionBtn.href = targetRedirect;
          actionBtn.innerText = "DOWNLOAD NOW ➜";
          actionBtn.classList.remove('btn-disabled');
          actionBtn.classList.add('btn-ready');
        } else {
          actionBtn.innerText = "DIRECT LINK NOT FOUND";
        }
      }
    }, 1000);
  </script>
</body>
</html>
