<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#071426">
  <meta name="description" content="Rudra Movies secure download gateway.">
  <title>preparing your download link... | rudra movies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#050d18; --panel:#0b1b32; --cyan:#35e6f2; --blue:#388bff;
      --violet:#9b72ff; --pink:#e16bd5; --white:#f5fbff; --muted:#9fb6d0;
      --green:#42e6ae; --danger:#ff7187;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html{min-height:100%;background:var(--bg)}
    body{
      min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
      padding:24px 16px;overflow-x:hidden;position:relative;isolation:isolate;
      color:var(--white);font-family:Inter,Arial,sans-serif;perspective:1000px;
      background:
        radial-gradient(ellipse at 15% 15%,rgba(27,166,255,.28),transparent 40%),
        radial-gradient(ellipse at 88% 22%,rgba(177,91,255,.24),transparent 42%),
        radial-gradient(ellipse at 50% 90%,rgba(32,219,216,.18),transparent 45%),
        linear-gradient(145deg,#061324 0%,#050e1a 50%,#0c0f24 100%);
    }
    .background-effects{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
    .glow{position:absolute;width:380px;height:380px;border-radius:50%;filter:blur(110px);opacity:.42;animation:glowMove 12s ease-in-out infinite alternate}
    .glow-blue{top:-120px;left:-120px;background:#0088ff}
    .glow-purple{top:15%;right:-160px;background:#9b48e8;animation-delay:-4s}
    .glow-cyan{bottom:-150px;left:25%;background:#00d9e8;animation-delay:-7s}
    @keyframes glowMove{to{transform:translate(35px,-30px) scale(1.2)}}
    .grid-overlay{position:absolute;inset:0;opacity:.11;background-image:linear-gradient(rgba(105,190,255,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(105,190,255,.2) 1px,transparent 1px);background-size:45px 45px;mask-image:linear-gradient(to bottom,#000,transparent 85%)}
    
    .page-shell{width:100%;max-width:420px;position:relative;z-index:1;transform-style:preserve-3d}
    .card{
      width:100%;position:relative;overflow:hidden;isolation:isolate;padding:32px 22px 24px;
      border-radius:32px;text-align:center;
      background:radial-gradient(circle at 0 0,rgba(35,155,255,.25),transparent 50%),
                 radial-gradient(circle at 100% 100%,rgba(160,95,255,.22),transparent 48%),
                 linear-gradient(155deg,rgba(15,35,62,.98),rgba(7,20,39,.99) 60%,rgba(18,21,48,.98));
      border:1px solid rgba(135,215,255,.32);
      box-shadow:0 35px 90px rgba(0,0,0,.65),0 0 50px rgba(30,160,255,.18),inset 0 1px 0 rgba(255,255,255,.2);
      transform:rotateX(4deg) rotateY(-2deg);
      transition:transform .4s cubic-bezier(.2,.8,.2,1), box-shadow .4s ease;
      animation:cardEnter .8s cubic-bezier(.2,.8,.2,1) both;
    }
    .card:hover{transform:rotateX(0deg) rotateY(0deg) translateY(-4px);box-shadow:0 40px 100px rgba(0,0,0,.7),0 0 65px rgba(53,230,242,.28),inset 0 1px 0 rgba(255,255,255,.3)}
    .card:before{content:"";position:absolute;inset:0;padding:1.6px;border-radius:inherit;background:conic-gradient(from var(--edge-angle,0deg),transparent 0deg,#35e6f2 60deg,#388bff 120deg,transparent 180deg,#e16bd5 240deg,#9b72ff 300deg,transparent 360deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.95;animation:edgeRotate 8s linear infinite}
    .card:after{content:"";position:absolute;top:0;left:10%;width:80%;height:1.5px;background:linear-gradient(90deg,transparent,#7af8f4,#d69eff,transparent);opacity:.95;box-shadow:0 0 10px #35e6f2;pointer-events:none}
    @property --edge-angle{syntax:"<angle>";inherits:false;initial-value:0deg}
    @keyframes edgeRotate{to{--edge-angle:360deg}}
    @keyframes cardEnter{from{opacity:0;transform:translateY(30px) scale(.95) rotateX(10deg)}to{opacity:1;transform:translateY(0) scale(1) rotateX(4deg) rotateY(-2deg)}}

    .top-label{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:18px;color:#a6c3e4;font-size:.6rem;font-weight:800;letter-spacing:2.5px;font-variant:small-caps}
    .top-label-line{width:28px;height:1px;background:linear-gradient(90deg,transparent,#35e6f2);box-shadow:0 0 8px #35e6f2}

    .logo-wrap{width:84px;height:84px;margin:0 auto 15px;padding:3px;border-radius:26px;background:linear-gradient(140deg,#35e6f2,#388bff 50%,#b46bff);box-shadow:0 0 30px rgba(53,230,242,.45),0 0 50px rgba(155,114,255,.25);transform:rotate(-4deg);animation:logoFloat 4s ease-in-out infinite}
    .logo-inner{width:100%;height:100%;overflow:hidden;border-radius:23px;background:#050d18;transform:rotate(4deg)}
    .logo-inner img{width:100%;height:100%;display:block;object-fit:cover}
    @keyframes logoFloat{50%{transform:translateY(-6px) rotate(-1deg) scale(1.03)}}

    .brand-title{font-size:1.38rem;line-height:1.3;font-weight:900;letter-spacing:2.2px;color:#fff;font-variant:small-caps;text-shadow:0 0 15px rgba(53,230,242,.6),0 0 30px rgba(155,114,255,.35);margin-bottom:6px}
    .brand-subtitle{font-size:.62rem;font-weight:800;letter-spacing:3px;color:#a8c4e5;margin-bottom:20px;font-variant:small-caps}

    .verified-pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 16px;border-radius:50px;border:1px solid rgba(53,230,242,.38);background:rgba(25,160,195,.15);box-shadow:inset 0 0 18px rgba(53,230,242,.12),0 0 20px rgba(53,230,242,.1);margin-bottom:24px}
    .verified-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);animation:statusBlink 1.8s ease-in-out infinite}
    .verified-text{color:#6afff5;font-size:.66rem;font-weight:900;letter-spacing:1.2px;font-variant:small-caps;text-shadow:0 0 8px rgba(106,255,245,.4)}
    @keyframes statusBlink{50%{opacity:.4;transform:scale(.75)}}

    /* 3D Liquid Countdown Area */
    .countdown-area{margin:0 auto 24px;width:168px;height:168px;display:flex;align-items:center;justify-content:center;position:relative;filter:drop-shadow(0 10px 20px rgba(0,0,0,.4))}
    .orbit{position:absolute;inset:0;border:1px dashed rgba(53,230,242,.65);border-radius:50%;animation:orbitSpin 22s linear infinite}
    .orbit:before{content:"";position:absolute;width:8px;height:8px;top:14px;left:22px;border-radius:50%;background:#35e6f2;box-shadow:0 0 15px #35e6f2,0 0 25px #388bff}
    .orbit-inner{position:absolute;inset:8px;border:1px solid rgba(155,114,255,.3);border-radius:50%;animation:orbitSpin 14s linear infinite reverse}
    @keyframes orbitSpin{to{transform:rotate(360deg)}}

    .progress-svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);z-index:3;pointer-events:none}
    .progress-track{fill:none;stroke:rgba(53,230,242,.12);stroke-width:4.5}
    .progress-ring{fill:none;stroke:url(#progressGradient);stroke-width:4.5;stroke-linecap:round;stroke-dasharray:351.85;stroke-dashoffset:351.85;filter:drop-shadow(0 0 10px #35e6f2)}

    /* 3D Glowing Liquid Ball */
    .liquid-ball{
      width:124px;height:124px;position:relative;overflow:hidden;border-radius:50%;
      border:4px solid rgba(53,230,242,.7);
      background:radial-gradient(circle at 35% 20%,#327b9e,#081b33 80%);
      box-shadow:inset 0 10px 22px rgba(0,0,0,.6),
                 inset 0 -8px 18px rgba(53,230,242,.35),
                 0 0 35px rgba(53,230,242,.4),
                 0 0 60px rgba(155,114,255,.2);
      z-index:2;
    }
    .liquid-fill{
      position:absolute;bottom:0;left:0;width:100%;height:0%;
      background:linear-gradient(180deg,rgba(102,252,241,.95),rgba(32,201,237,.9) 55%,rgba(40,124,240,.95));
      box-shadow:0 0 25px #35e6f2;
      transition:height .08s linear;
    }
    .liquid-fill:before{
      content:"";position:absolute;left:-15%;top:-7px;width:130%;height:15px;border-radius:50%;
      background:#c2ffff;box-shadow:0 0 18px rgba(53,230,242,1),0 0 30px #ffffff;
      animation:liquidWave 1.8s ease-in-out infinite alternate;
    }
    @keyframes liquidWave{to{transform:translateY(4px) scaleY(1.4)}}
    .ball-shine{position:absolute;inset:0;z-index:3;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.45),transparent 55%)}
    
    .count-number{position:absolute;z-index:4;font-size:2.85rem;font-weight:900;color:white;text-shadow:0 2px 8px #04253f,0 0 20px rgba(53,230,242,.95);transition:transform .2s cubic-bezier(.34,1.56,.64,1);font-variant:small-caps}
    .count-number.pop{transform:scale(1.22)}

    .status-section{margin-bottom:20px}
    .status-title{font-size:.92rem;font-weight:900;letter-spacing:1.2px;margin-bottom:7px;font-variant:small-caps;color:#f5fbff;text-shadow:0 0 10px rgba(53,230,242,.3)}
    .status-description{font-size:.78rem;color:var(--muted);font-weight:500;line-height:1.5;font-variant:small-caps;letter-spacing:.8px}
    .status-progress{width:100%;max-width:190px;height:4.5px;margin:14px auto 0;overflow:hidden;border-radius:10px;background:rgba(255,255,255,.08);box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
    .status-progress span{display:block;width:35%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#35e6f2,#388bff,#9b72ff);box-shadow:0 0 10px #35e6f2;animation:loadingBar 1.8s ease-in-out infinite}
    @keyframes loadingBar{from{transform:translateX(-120%)}to{transform:translateX(350%)} }

    .error-box{display:none;padding:12px;margin-bottom:15px;border-radius:14px;text-align:left;color:#ffcad3;background:rgba(255,113,135,.14);border:1px solid rgba(255,113,135,.4);font-size:.76rem;line-height:1.5;overflow-wrap:anywhere;font-variant:small-caps}

    .buttons{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
    .button{width:100%;min-height:52px;padding:12px;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:16px;text-decoration:none;font-family:inherit;font-size:.82rem;font-weight:900;letter-spacing:1px;font-variant:small-caps;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;cursor:pointer}
    
    .download-button{color:rgba(224,241,255,.6);background:linear-gradient(110deg,#12426e,#163d75);border:1px solid rgba(53,230,242,.3);box-shadow:0 4px 0 #0a2747,0 10px 22px rgba(0,100,255,.15);pointer-events:none}
    .download-button.ready{color:#fff;background:linear-gradient(110deg,#00d2e6,#237ff3 55%,#9b72ff);border-color:rgba(125,245,255,.8);box-shadow:0 4px 0 #0d3880,0 12px 32px rgba(53,230,242,.5);pointer-events:auto;animation:buttonGlow 1.8s ease-in-out infinite}
    @keyframes buttonGlow{50%{box-shadow:0 4px 0 #0d3880,0 14px 38px rgba(53,230,242,.75)}}
    .download-button.ready:hover,.telegram-button:hover{transform:translateY(-3px)}

    .spinner{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.25);border-top-color:#35e6f2;border-radius:50%;animation:spin .8s linear infinite;filter:drop-shadow(0 0 5px #35e6f2)}
    @keyframes spin{to{transform:rotate(360deg)}}

    .telegram-button{color:#f5fbff;background:linear-gradient(110deg,rgba(53,230,242,.12),rgba(155,114,255,.14));border:1px solid rgba(53,230,242,.35);box-shadow:0 4px 0 rgba(4,10,24,.6),0 8px 20px rgba(0,0,0,.2)}
    .telegram-button:hover{background:rgba(53,230,242,.2);border-color:rgba(53,230,242,.7);box-shadow:0 4px 0 rgba(4,10,24,.6),0 10px 25px rgba(53,230,242,.25)}
    .telegram-icon{width:18px;height:18px;flex-shrink:0;color:#35e6f2;filter:drop-shadow(0 0 6px #35e6f2)}

    .footer{padding-top:16px;border-top:1px solid rgba(135,215,255,.15)}
    .footer-brand{color:#a8c4e5;font-size:.68rem;font-weight:900;letter-spacing:1.8px;font-variant:small-caps;text-shadow:0 0 8px rgba(53,230,242,.25)}
    .footer-caption{margin-top:6px;color:rgba(168,196,229,.6);font-size:.59rem;letter-spacing:1.4px;font-variant:small-caps}

    @media(max-width:360px){body{padding:12px}.card{padding:25px 15px 18px}.countdown-area{transform:scale(.92);margin-bottom:18px}.brand-title{font-size:1.2rem}}
    @media(max-height:690px){body{align-items:flex-start}}
    @media(min-width:768px){.page-shell{max-width:430px}.card{padding:36px 26px 25px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="background-effects" aria-hidden="true">
    <div class="glow glow-blue"></div><div class="glow glow-purple"></div><div class="glow glow-cyan"></div><div class="grid-overlay"></div>
  </div>
  <main class="page-shell">
    <section class="card">
      <div class="top-label"><span class="top-label-line"></span>rudra digital gateway<span class="top-label-line"></span></div>
      <div class="logo-wrap"><div class="logo-inner"><img src="RudraMovies.png" alt="rudra movies" onerror="this.style.opacity='.2'"></div></div>
      <h1 class="brand-title">ʀᴜᴅʀᴀ ᴍᴏᴠɪᴇꜱ</h1>
      <p class="brand-subtitle">premium download experience</p>
      <div class="verified-pill"><span class="verified-dot" id="statusDot"></span><span class="verified-text">secured &amp; verified link</span></div>
      <div class="countdown-area">
        <div class="orbit"></div><div class="orbit-inner"></div>
        <svg class="progress-svg" viewBox="0 0 160 160" aria-hidden="true">
          <defs><linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#35e6f2"/><stop offset="55%" stop-color="#388bff"/><stop offset="100%" stop-color="#9b72ff"/></linearGradient></defs>
          <circle class="progress-track" cx="80" cy="80" r="56"/><circle class="progress-ring" id="progressRing" cx="80" cy="80" r="56"/>
        </svg>
        <div class="liquid-ball"><div class="liquid-fill" id="liquidFill"></div><div class="ball-shine"></div></div>
        <div class="count-number" id="countdownNumber">5</div>
      </div>
      <div class="status-section">
        <div class="status-title" id="statusTitle">secure link verification</div>
        <div class="status-description" id="statusDescription">scanning your download link...</div>
        <div class="status-progress" id="loadingBar"><span></span></div>
      </div>
      <div class="error-box" id="errorBox" role="alert"></div>
      <div class="buttons">
        <a href="#" class="button download-button" id="downloadButton" role="button" aria-disabled="true">
          <span class="spinner" id="buttonSpinner"></span><span id="downloadButtonText">verifying link...</span>
        </a>
        <a href="https://t.me/RudraMovies" class="button telegram-button" target="_blank" rel="noopener noreferrer">
          <svg class="telegram-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4l17.45-7.48a1 1 0 0 0 0-1.84L3.4 3.6a.993.993 0 0 0-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.07-.87.5-.87 1l.01 4.61c0 .71.73 1.2 1.39.91z"/></svg>
          <span>⚡ ʀᴜᴅʀᴀ ᴍᴀɪɴ ᴄʜᴀɴɴᴇʟ ✦</span>
        </a>
      </div>
      <footer class="footer"><div class="footer-brand">⚡ ʀᴜᴅʀᴀ ᴍᴏᴠɪᴇꜱ ꜱᴇᴄᴜʀɪᴛʏ</div><div class="footer-caption">powered by rudra digital system</div></footer>
    </section>
  </main>
  <script>
    (function () {
      "use strict";
      const COUNTDOWN_SECONDS = 5;
      const ARC_CIRCUMFERENCE = 2 * Math.PI * 56;
      const countdownNumber = document.getElementById("countdownNumber");
      const progressRing = document.getElementById("progressRing");
      const liquidFill = document.getElementById("liquidFill");
      const statusTitle = document.getElementById("statusTitle");
      const statusDescription = document.getElementById("statusDescription");
      const statusDot = document.getElementById("statusDot");
      const loadingBar = document.getElementById("loadingBar");
      const errorBox = document.getElementById("errorBox");
      const downloadButton = document.getElementById("downloadButton");
      const downloadButtonText = document.getElementById("downloadButtonText");
      const buttonSpinner = document.getElementById("buttonSpinner");
      progressRing.style.strokeDasharray = String(ARC_CIRCUMFERENCE);
      progressRing.style.strokeDashoffset = String(ARC_CIRCUMFERENCE);
      let finalRedirectUrl = null;
      let hasError = false;

      function parseValidUrl(input) {
        if (!input || typeof input !== "string") return null;
        const raw = input.trim();
        if (!raw) return null;
        try {
          const parsed = new URL(raw, window.location.origin);
          if (parsed.protocol === "https:" || parsed.protocol === "http:" || parsed.protocol === "tg:") return parsed.href;
        } catch (_) {}
        try {
          const decoded = atob(raw).trim();
          const parsed = new URL(decoded);
          if (parsed.protocol === "https:" || parsed.protocol === "http:" || parsed.protocol === "tg:") return parsed.href;
        } catch (_) {}
        return null;
      }

      function displayError(message) {
        if (hasError) return;
        hasError = true;
        buttonSpinner.style.display = "none";
        downloadButtonText.textContent = "link error";
        statusTitle.textContent = "verification failed";
        statusTitle.style.color = "var(--danger)";
        statusDescription.textContent = "unable to continue with redirect.";
        statusDot.style.background = "var(--danger)";
        statusDot.style.boxShadow = "0 0 10px var(--danger)";
        countdownNumber.textContent = "!";
        liquidFill.style.height = "0%";
        loadingBar.style.display = "none";
        errorBox.textContent = message;
        errorBox.style.display = "block";
        downloadButton.classList.remove("ready");
        downloadButton.removeAttribute("href");
        downloadButton.setAttribute("aria-disabled", "true");
      }

      async function resolveDestination() {
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");
        const redirect = params.get("redirect");
        if (token) {
          try {
            let response = await fetch(`/api/verify?token=${encodeURIComponent(token)}`, {
              method: "GET", headers: {"Accept": "application/json"}
            });
            if (response.status === 405) {
              response = await fetch("/api/verify", {
                method: "POST",
                headers: {"Content-Type": "application/json", "Accept": "application/json"},
                body: JSON.stringify({token, redirect})
              });
            }
            const data = await response.json().catch(() => ({}));
            if (!response.ok || data.error || data.valid === false || data.success === false) {
              throw new Error(data.message || data.error || "this download token is invalid or has expired.");
            }
            const target = data.redirect || data.url || data.target || data.link || redirect;
            const validTarget = parseValidUrl(target);
            if (!validTarget) throw new Error("destination download link is missing or invalid.");
            return validTarget;
          } catch (error) {
            displayError(error.message || "failed to verify download token. please try again.");
            return null;
          }
        }
        if (redirect) {
          const validTarget = parseValidUrl(redirect);
          if (validTarget) return validTarget;
          displayError("the provided redirect url is invalid.");
          return null;
        }
        displayError("no download link or token was found in the url.");
        return null;
      }

      function startCountdown() {
        const destinationPromise = resolveDestination();
        const startTime = performance.now();
        const totalDuration = COUNTDOWN_SECONDS * 1000;
        let previousSecond = COUNTDOWN_SECONDS;
        liquidFill.style.height = "15%";
        const statusTimer = setTimeout(() => {
          if (!hasError && !finalRedirectUrl) statusDescription.textContent = "preparing secure destination...";
        }, 1200);
        function tick(now) {
          if (hasError) { clearTimeout(statusTimer); return; }
          const elapsed = Math.min(now - startTime, totalDuration);
          const progress = elapsed / totalDuration;
          const remaining = Math.max(1, Math.ceil((totalDuration - elapsed) / 1000));
          progressRing.style.strokeDashoffset = String(ARC_CIRCUMFERENCE * (1 - progress));
          liquidFill.style.height = `${15 + progress * 85}%`;
          if (remaining !== previousSecond && elapsed < totalDuration) {
            previousSecond = remaining;
            countdownNumber.textContent = String(remaining);
            countdownNumber.classList.add("pop");
            setTimeout(() => countdownNumber.classList.remove("pop"), 180);
          }
          if (elapsed < totalDuration) requestAnimationFrame(tick);
          else completeCountdown(destinationPromise);
        }
        requestAnimationFrame(tick);
      }

      async function completeCountdown(destinationPromise) {
        finalRedirectUrl = await destinationPromise;
        if (hasError || !finalRedirectUrl) return;
        progressRing.style.strokeDashoffset = "0";
        liquidFill.style.height = "100%";
        countdownNumber.textContent = "0";
        countdownNumber.classList.add("pop");
        statusTitle.textContent = "your destination is ready";
        statusDescription.textContent = "secure verification completed.";
        statusDot.style.background = "var(--green)";
        statusDot.style.boxShadow = "0 0 12px var(--green)";
        loadingBar.style.display = "none";
        buttonSpinner.style.display = "none";
        downloadButtonText.textContent = "proceed to destination →";
        downloadButton.href = finalRedirectUrl;
        downloadButton.classList.add("ready");
        downloadButton.setAttribute("aria-disabled", "false");
        setTimeout(() => {
          if (finalRedirectUrl && !hasError) window.location.href = finalRedirectUrl;
        }, 300);
      }

      downloadButton.addEventListener("click", function (event) {
        if (!finalRedirectUrl || hasError) { event.preventDefault(); return; }
        event.preventDefault();
        window.location.href = finalRedirectUrl;
      });
      startCountdown();
    })();
  </script>
</body>
</html>
