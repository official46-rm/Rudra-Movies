<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUDRA MOVIES</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 10% 20%, rgb(4, 21, 45) 0%, rgb(18, 52, 86) 40%, rgb(88, 30, 77) 100%);
            padding: 20px;
        }

        .card-container {
            width: 100%;
            max-width: 400px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .logo-box {
            width: 75px;
            height: 75px;
            background-color: #000;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 20px;
        }

        .error-code {
            color: #fff;
            font-size: 14px;
            font-weight: bold;
        }

        .error-text {
            color: #888;
            font-size: 8px;
        }

        .main-title {
            color: #ffffff;
            font-size: 22px;
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .badge {
            background-color: rgba(0, 180, 130, 0.15);
            color: #00ffb7;
            font-size: 11px;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 180, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 30px;
        }

        .badge .dot {
            width: 6px;
            height: 6px;
            background-color: #00ffb7;
            border-radius: 50%;
        }

        .timer-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin-bottom: 30px;
        }

        .timer-svg {
            transform: rotate(-90deg);
            width: 140px;
            height: 140px;
        }

        .track-ring {
            fill: #0c1d33;
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 6;
        }

        .progress-ring {
            fill: none;
            stroke: url(#gradientRing);
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 389.56;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
        }

        .timer-number {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 46px;
            font-weight: bold;
        }

        .status-container {
            margin-bottom: 25px;
        }

        .status-title {
            color: #ffffff;
            font-size: 15px;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .status-subtitle {
            color: #b0c4de;
            font-size: 14px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s ease, opacity 0.3s ease;
            text-decoration: none;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-verifying {
            background: linear-gradient(90deg, #005c97, #363795);
            color: #ffffff;
        }

        .btn-channel {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s infinite linear;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .footer-text {
            color: #7b8fa7;
            font-size: 11px;
            letter-spacing: 0.5px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="card-container">

        <div class="logo-box">
            <span class="error-code">404</span>
            <span class="error-text">NOT FOUND</span>
        </div>

        <h1 class="main-title">RUDRA MOVIES</h1>

        <div class="badge">
            <span class="dot"></span>
            SECURED & VERIFIED LINK
        </div>

        <div class="timer-container">
            <svg class="timer-svg" viewBox="0 0 140 140">
                <defs>
                    <linearGradient id="gradientRing" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#00d2ff" />
                        <stop offset="100%" stop-color="#0066ff" />
                    </linearGradient>
                </defs>

                <circle class="track-ring" cx="70" cy="70" r="62"></circle>

                <circle
                    class="progress-ring"
                    id="progressCircle"
                    cx="70"
                    cy="70"
                    r="62">
                </circle>
            </svg>

            <div class="timer-number" id="countdownText">5</div>
        </div>

        <div class="status-container">
            <h2 class="status-title" id="statusHeader">
                SECURITY VERIFICATION
            </h2>

            <p class="status-subtitle" id="statusMessage">
                Redirecting in progress...
            </p>
        </div>

        <button class="btn btn-verifying" id="actionBtn" disabled>
            <span class="spinner" id="btnSpinner"></span>
            <span id="btnText">VERIFYING...</span>
        </button>

        <a href="https://t.me/RudraMoviez"
           target="_blank"
           rel="noopener noreferrer"
           class="btn btn-channel">
            ➤ ⚡ RUDRA MAIN CHANNEL ✨
        </a>

        <div class="footer-text">
            ⚡ RUDRA MOVIES SECURITY
        </div>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const TOTAL_SECONDS = 5;
            const CIRCUMFERENCE = 2 * Math.PI * 62;

            const countdownText = document.getElementById("countdownText");
            const progressCircle = document.getElementById("progressCircle");
            const statusHeader = document.getElementById("statusHeader");
            const statusMessage = document.getElementById("statusMessage");
            const actionBtn = document.getElementById("actionBtn");
            const btnText = document.getElementById("btnText");
            const btnSpinner = document.getElementById("btnSpinner");

            let startTime = null;
            let finished = false;

            progressCircle.style.strokeDasharray = CIRCUMFERENCE;
            progressCircle.style.strokeDashoffset = 0;

            function updateCountdown(timestamp) {

                if (finished) return;

                if (startTime === null) {
                    startTime = timestamp;
                }

                const elapsed = (timestamp - startTime) / 1000;
                const remaining = Math.max(0, TOTAL_SECONDS - elapsed);

                const seconds = Math.ceil(remaining);

                countdownText.textContent = seconds;

                const progress = Math.min(elapsed / TOTAL_SECONDS, 1);

                progressCircle.style.strokeDashoffset =
                    CIRCUMFERENCE * progress;

                if (remaining <= 0) {
                    finished = true;

                    countdownText.textContent = "0";
                    progressCircle.style.strokeDashoffset = CIRCUMFERENCE;

                    statusHeader.textContent = "VERIFICATION COMPLETE";
                    statusMessage.textContent = "Countdown complete. You can continue.";

                    btnText.textContent = "GET LINK NOW";
                    btnSpinner.style.display = "none";

                    actionBtn.disabled = false;
                    actionBtn.style.background =
                        "linear-gradient(90deg, #00b482, #007a58)";

                    actionBtn.onclick = function () {
                        const params = new URLSearchParams(window.location.search);
                        const redirectUrl = params.get("redirect");

                        if (redirectUrl) {
                            try {
                                const destination = new URL(redirectUrl);

                                if (destination.protocol === "https:") {
                                    window.location.href = destination.href;
                                    return;
                                }
                            } catch (error) {
                                // Invalid URL: show message below.
                            }
                        }

                        statusMessage.textContent =
                            "LINK NOT AVAILABLE. Please use the main channel.";
                    };

                    return;
                }

                requestAnimationFrame(updateCountdown);
            }

            requestAnimationFrame(updateCountdown);

        });
    </script>

</body>
</html>
