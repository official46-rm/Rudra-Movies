<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#080b1c" />
  <title>PREPARING YOUR DOWNLOAD LINK... | RUDRA MOVIES</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #070a1a;
      --blue: #2f8cff;
      --cyan: #22d3ee;
      --purple: #9b3cf0;
      --magenta: #c13fd6;
      --text-white: #f4f7ff;
      --text-dim: #aab6dc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(ellipse at 12% 12%, rgba(34,150,255,.22), transparent 45%),
        radial-gradient(ellipse at 90% 88%, rgba(155,60,240,.24), transparent 45%),
        linear-gradient(160deg,#060818,#0d1030 55%,#070a1a);
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      color: var(--text-white);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* ===== AMBIENT NEON BLOBS ===== */

    .ambient-stage {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .ambient-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .55;
      animation: ambientPulse 10s ease-in-out infinite alternate;
    }

    .blob-tl {
      width: 380px; height: 380px;
      background: radial-gradient(circle,#1f9bff 0%,#15408f 50%,transparent 75%);
      top: 4%; left: -16%;
    }

    .blob-tr {
      width: 340px; height: 340px;
      background: radial-gradient(circle,#c13fd6 0%,#59206e 55%,transparent 75%);
      top: 2%; right: -18%;
      animation-delay: -3s;
      opacity: .35;
    }

    .blob-br {
      width: 400px; height: 400px;
      background: radial-gradient(circle,#a63df0 0%,#3b1a78 55%,transparent 75%);
      bottom: 0%; right: -14%;
      animation-delay: -6s;
    }

    .blob-cyan {
      width: 240px; height: 240px;
      background: radial-gradient(circle,rgba(34,211,238,.3),transparent 70%);
      bottom: 14%; left: 8%;
    }

    @keyframes ambientPulse {
      0%   { transform: scale(1) translate(0,0); }
      100% { transform: scale(1.1) translate(14px,-14px); }
    }

    /* ===== GLASS CARD ===== */

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 380px;
      border-radius: 28px;
      padding: 30px 22px 22px;
      text-align: center;
      background:
        radial-gradient(circle at 0% 0%,rgba(47,140,255,.55),transparent 55%),
        radial-gradient(circle at 100% 100%,rgba(155,60,240,.55),transparent 55%),
        radial-gradient(circle at 100% 0%,rgba(193,63,214,.22),transparent 50%),
        linear-gradient(160deg,rgba(26,36,92,.78),rgba(18,20,52,.82));
      backdrop-filter: blur(26px) saturate(140%);
      -webkit-backdrop-filter: blur(26px) saturate(140%);
      border: 1.5px solid rgba(120,170,255,.4);
      box-shadow:
        0 25px 60px rgba(0,0,0,.65),
        0 0 30px rgba(70,120,255,.2),
        0 0 40px rgba(155,60,240,.15),
        inset 0 1px 1px rgba(255,255,255,.2);
      overflow: hidden;
      animation: cardIn .7s cubic-bezier(.2,.8,.2,1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(22px) scale(.97); }
      to   { opacity: 1; transform: none; }
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 8%;
      width: 84%; height: 1px;
      background: linear-gradient(90deg,transparent,#bfe4ff,#5aa8ff,transparent);
    }

    /* ===== LOGO ===== */

    .logo-ring {
      width: 74px;
      height: 74px;
      margin: 0 auto 14px;
      border-radius: 50%;
      padding: 4px;
      background: #070a1a;
      border: 2px solid rgba(90,160,255,.8);
      box-shadow: 0 8px 20px rgba(0,0,0,.55), 0 0 18px rgba(60,140,255,.45);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .logo-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    /* ===== BRAND TITLE (small caps) ===== */

    .brand-title {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #ffffff;
      margin-bottom: 12px;
      text-shadow: 0 2px 12px rgba(80,150,255,.45);
    }

    /* ===== STATUS PILL ===== */

    .tagline-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 999px;
      background: rgba(20,32,80,.55);
      border: 1px solid rgba(90,170,255,.45);
      box-shadow: inset 0 1px 1px rgba(255,255,255,.08), 0 4px 12px rgba(0,0,0,.25);
      margin-bottom: 26px;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22e08a;
      box-shadow: 0 0 8px #22e08a, 0 0 14px rgba(34,224,138,.7);
      animation: dotBlink 2s infinite ease-in-out;
    }

    @keyframes dotBlink {
      0%,100% { opacity: 1; transform: scale(1); }
      50%     { opacity: .55; transform: scale(.85); }
    }

    .tagline-text {
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #5fd4ff;
    }

    /* ===== COUNTDOWN ORB ===== */

    .orb-wrapper {
      position: relative;
      width: 146px;
      height: 146px;
      margin: 0 auto 26px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .orb-svg {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      transform: rotate(-90deg);
      z-index: 3;
      pointer-events: none;
    }

    .ring-dashed {
      fill: none;
      stroke: rgba(110,180,255,.5);
      stroke-width: 2;
      stroke-dasharray: 4 5;
      transform-origin: 73px 73px;
      animation: ringSpin 30s linear infinite;
    }

    @keyframes ringSpin { to { transform: rotate(360deg); } }

    .ring-track {
      fill: none;
      stroke: rgba(90,160,255,.16);
      stroke-width: 4.5;
    }

    .ring-progress {
      fill: none;
      stroke: url(#arcGrad);
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-dasharray: 408;
      stroke-dashoffset: 408;
      filter: drop-shadow(0 0 6px rgba(47,160,255,.9));
    }

    .liquid-sphere {
      position: relative;
      width: 114px;
      height: 114px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 25%,#2a3466 0%,#0b0f26 80%);
      border: 2px solid rgba(90,170,255,.6);
      box-shadow:
        inset 0 8px 18px rgba(0,0,0,.8),
        inset 0 -6px 14px rgba(34,211,238,.3),
        0 0 25px rgba(47,140,255,.4);
      overflow: hidden;
      z-index: 2;
    }

    .liquid-fill {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%;
      height: 0%;
      background: linear-gradient(180deg,#7ef3ff 0%,#19b9e6 50%,#1f6fe0 100%);
      box-shadow: 0 0 20px rgba(34,211,238,.6);
      transition: height .08s linear;
    }

    .liquid-fill::before {
      content: '';
      position: absolute;
      top: -6px; left: -8%;
      width: 116%; height: 12px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center,#c8fbff 0%,#3ed2f0 60%,rgba(31,111,224,0) 100%);
      box-shadow: 0 0 10px rgba(150,240,255,.85);
      animation: liquidSlosh 2.4s ease-in-out infinite alternate;
    }

    @keyframes liquidSlosh {
      0%   { transform: translateY(0) scaleY(1); }
      100% { transform: translateY(2px) scaleY(1.25); }
    }

    .sphere-gloss {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 22%,rgba(255,255,255,.26) 0%,rgba(255,255,255,.04) 35%,transparent 60%);
      z-index: 3;
      pointer-events: none;
    }

    .countdown-num {
      position: absolute;
      z-index: 4;
      font-size: 2.65rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 3px 10px rgba(0,0,0,.6), 0 0 15px rgba(60,160,255,.5);
      user-select: none;
      transition: transform .2s cubic-bezier(.34,1.56,.64,1);
    }

    .countdown-num.pop { transform: scale(1.16); }

    /* ===== STATUS TEXT (small caps) ===== */

    .status-block { margin-bottom: 20px; }

    .status-heading {
      font-size: .95rem;
      font-weight: 800;
      letter-spacing: .8px;
      color: #ffffff;
      margin-bottom: 5px;
    }

    .status-sub {
      font-size: .85rem;
      font-weight: 500;
      color: var(--text-dim);
    }

    /* ===== ERROR ===== */

    .error-banner {
      display: none;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(239,68,68,.16);
      border: 1px solid rgba(239,68,68,.45);
      color: #fecaca;
      font-size: .78rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 16px;
    }

    /* ===== BUTTONS ===== */

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 18px;
    }

    .btn {
      width: 100%;
      min-height: 50px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      font-size: .85rem;
      font-weight: 800;
      letter-spacing: .8px;
      transition: all .25s ease;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(90deg,#1d5fc4,#1f86d6,#1d5fc4);
      border: 1px solid rgba(110,170,255,.35);
      color: rgba(200,220,255,.7);
      box-shadow: 0 6px 20px rgba(30,90,220,.25);
      pointer-events: none;
    }

    .btn-primary.ready {
      background: linear-gradient(90deg,#17c3f0,#1a8cf0,#1c6df0);
      border-color: rgba(160,225,255,.7);
      color: #ffffff;
      pointer-events: auto;
      box-shadow: 0 8px 26px rgba(30,150,255,.5), 0 0 20px rgba(34,211,238,.25);
      animation: readyPulse 1.6s ease-in-out infinite;
    }

    @keyframes readyPulse {
      0%,100% { box-shadow: 0 8px 26px rgba(30,150,255,.5), 0 0 20px rgba(34,211,238,.25); }
      50%     { box-shadow: 0 10px 32px rgba(30,150,255,.7), 0 0 28px rgba(34,211,238,.45); }
    }

    .btn-primary.ready:hover,
    .btn-primary.ready:active { transform: translateY(-1px); }

    .btn-spinner {
      width: 17px; height: 17px;
      border-radius: 50%;
      border: 2.2px solid rgba(190,215,255,.25);
      border-top-color: #cfe4ff;
      animation: spin .85s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .btn-channel {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(160,190,255,.3);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(0,0,0,.25), inset 0 1px 1px rgba(255,255,255,.1);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .btn-channel:hover,
    .btn-channel:active {
      background: rgba(255,255,255,.15);
      border-color: rgba(190,215,255,.6);
      transform: translateY(-1px);
    }

    .tg-send-icon {
      width: 16px; height: 16px;
      color: #38b6ff;
      flex-shrink: 0;
    }

    /* ===== FOOTER ===== */

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: rgba(190,205,245,.75);
    }

    /* ===== RESPONSIVE ===== */

    @media (min-width: 768px) {
      .card { max-width: 420px; padding: 36px 30px 26px; }
      .brand-title { font-size: 1.45rem; }
    }

    @media (max-width: 360px) {
      body { padding: 12px; }
      .card { padding: 25px 16px 18px; }
      .brand-title { font-size: 1.15rem; }
    }

    @media (max-height: 700px) {
      body { align-items: flex-start; overflow-y: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ambient-blob, .ring-dashed, .btn-primary.ready { animation: none; }
    }
  </style>
</head>

<body>

  <!-- AMBIENT BACKGROUND -->
  <div class="ambient-stage">
    <div class="ambient-blob blob-tl"></div>
    <div class="ambient-blob blob-tr"></div>
    <div class="ambient-blob blob-br"></div>
    <div class="ambient-blob blob-cyan"></div>
  </div>

  <!-- MAIN CARD -->
  <main class="card">

    <!-- LOGO -->
    <div class="logo-ring">
      <img src="RudraMovies.png" alt="RUDRA MOVIES" onerror="this.style.opacity='0.25'" />
    </div>

    <!-- BRAND -->
    <h1 class="brand-title">ʀᴜᴅʀᴀ ᴍᴏᴠɪᴇꜱ</h1>

    <!-- STATUS PILL -->
    <div class="tagline-pill">
      <span class="status-dot" id="statusDot"></span>
      <span class="tagline-text">ꜱᴇᴄᴜʀᴇᴅ &amp; ᴠᴇʀɪꜰɪᴇᴅ ʟɪɴᴋ</span>
    </div>

    <!-- COUNTDOWN -->
    <div class="orb-wrapper">
      <svg class="orb-svg" viewBox="0 0 146 146">
        <defs>
          <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7ef3ff" />
            <stop offset="55%" stop-color="#2f8cff" />
            <stop offset="100%" stop-color="#9b3cf0" />
          </linearGradient>
        </defs>

        <circle class="ring-dashed" cx="73" cy="73" r="69" />
        <circle class="ring-track" cx="73" cy="73" r="65" />
        <circle class="ring-progress" id="ringProgress" cx="73" cy="73" r="65" />
      </svg>

      <div class="liquid-sphere">
        <div class="liquid-fill" id="liquidFill"></div>
        <div class="sphere-gloss"></div>
      </div>

      <div class="countdown-num" id="countdownNum">5</div>
    </div>

    <!-- STATUS -->
    <div class="status-block">
      <div class="status-heading" id="statusHeading">ꜱᴇᴄᴜʀɪᴛʏ ᴠᴇʀɪꜰɪᴄᴀᴛɪᴏɴ</div>
      <div class="status-sub" id="statusSub">ꜱᴄᴀɴɴɪɴɢ ʟɪɴᴋ...</div>
    </div>

    <!-- ERROR -->
    <div class="error-banner" id="errorBanner"></div>

    <!-- ACTION BUTTONS -->
    <div class="btn-group">

      <a href="#" id="downloadBtn" class="btn btn-primary" role="button" aria-disabled="true">
        <span class="btn-spinner" id="btnSpinner"></span>
        <span id="downloadBtnText">ᴠᴇʀɪꜰʏɪɴɢ...</span>
      </a>

      <a href="https://t.me/RudraMovies" id="telegramBtn" target="_blank" rel="noopener noreferrer" class="btn btn-channel">
        <svg class="tg-send-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3.4 20.4l17.45-7.48a1 1 0 0 0 0-1.84L3.4 3.6a.993.993 0 0 0-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.07-.87.5-.87 1l.01 4.61c0 .71.73 1.2 1.39.91z"/>
        </svg>
        <span>⚡ ʀᴜᴅʀᴀ ᴍᴀɪɴ ᴄʜᴀɴɴᴇʟ ✨</span>
      </a>

    </div>

    <!-- FOOTER -->
    <div class="card-footer">
      <span>⚡ ʀᴜᴅʀᴀ ᴍᴏᴠɪᴇꜱ ꜱᴇᴄᴜʀɪᴛʏ</span>
    </div>

  </main>

  <script>
    (function () {
      const COUNTDOWN_SECONDS = 5;
      const ARC_CIRCUMFERENCE = 2 * Math.PI * 65;

      const countdownNum = document.getElementById('countdownNum');
      const ringProgress = document.getElementById('ringProgress');
      const liquidFill = document.getElementById('liquidFill');
      const statusHeading = document.getElementById('statusHeading');
      const statusSub = document.getElementById('statusSub');
      const statusDot = document.getElementById('statusDot');
      const errorBanner = document.getElementById('errorBanner');
      const downloadBtn = document.getElementById('downloadBtn');
      const downloadBtnText = document.getElementById('downloadBtnText');
      const btnSpinner = document.getElementById('btnSpinner');

      ringProgress.style.strokeDasharray = `${ARC_CIRCUMFERENCE}`;
      ringProgress.style.strokeDashoffset = `${ARC_CIRCUMFERENCE}`;

      let finalRedirectUrl = null;
      let hasError = false;

      // Validate and sanitize target URL
      function parseValidUrl(input) {
        if (!input || typeof input !== 'string') return null;

        const raw = input.trim();
        if (!raw) return null;

        if (/^(https?:\/\/|tg:\/\/)/i.test(raw)) {
          return raw;
        }

        // Support Base64-encoded redirect URLs
        try {
          const decoded = atob(raw).trim();
          if (/^(https?:\/\/|tg:\/\/)/i.test(decoded)) {
            return decoded;
          }
        } catch (_) {}

        return null;
      }

      function displayError(msg) {
        hasError = true;
        btnSpinner.style.display = 'none';
        downloadBtnText.textContent = 'ʟɪɴᴋ ᴇʀʀᴏʀ';
        statusHeading.textContent = 'ɪɴᴠᴀʟɪᴅ ᴏʀ ᴍɪꜱꜱɪɴɢ ʟɪɴᴋ';
        statusHeading.style.color = '#f87171';
        statusSub.textContent = 'ᴜɴᴀʙʟᴇ ᴛᴏ ᴘʀᴏᴄᴇᴇᴅ ᴡɪᴛʜ ʀᴇᴅɪʀᴇᴄᴛ.';
        statusDot.style.background = '#ef4444';
        statusDot.style.boxShadow = '0 0 8px #ef4444';
        countdownNum.textContent = '!';
        errorBanner.textContent = msg;
        errorBanner.style.display = 'block';
        downloadBtn.classList.remove('ready');
        downloadBtn.removeAttribute('href');
      }

      // Preserve token verification and redirect parameters
      async function resolveDestination() {
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const redirect = params.get('redirect');

        if (token) {
          try {
            let res = await fetch(`/api/verify?token=${encodeURIComponent(token)}`, {
              method: 'GET',
              headers: { 'Accept': 'application/json' }
            });

            if (res.status === 405) {
              res = await fetch('/api/verify', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Accept': 'application/json'
                },
                body: JSON.stringify({ token, redirect })
              });
            }

            const data = await res.json().catch(() => ({}));

            if (!res.ok || data.error || data.valid === false || data.success === false) {
              throw new Error(data.message || data.error || 'This download token is invalid or has expired.');
            }

            const target = data.redirect || data.url || data.target || data.link || redirect;
            const validTarget = parseValidUrl(target);

            if (!validTarget) {
              throw new Error('Destination download link is missing or invalid.');
            }

            return validTarget;

          } catch (err) {
            displayError(err.message || 'Failed to verify download token. Please try again from the channel.');
            return null;
          }
        }

        if (redirect) {
          const validTarget = parseValidUrl(redirect);

          if (validTarget) {
            return validTarget;
          }

          displayError('The provided redirect URL is invalid.');
          return null;
        }

        displayError('No download link or token was found in the URL.');
        return null;
      }

      function startCountdown() {
        const destinationPromise = resolveDestination();
        const startTime = performance.now();
        const totalDuration = COUNTDOWN_SECONDS * 1000;
        let currentDisplayed = COUNTDOWN_SECONDS;

        liquidFill.style.height = '20%';

        // Status text change, as in the reference design
        setTimeout(() => {
          if (!hasError && !finalRedirectUrl) {
            statusSub.textContent = 'ʀᴇᴅɪʀᴇᴄᴛɪɴɢ ɪɴ ᴘʀᴏɢʀᴇꜱꜱ...';
          }
        }, 1200);

        function tick(now) {
          if (hasError) return;

          const elapsed = Math.min(now - startTime, totalDuration);
          const progress = elapsed / totalDuration;
          const secondsLeft = Math.max(1, Math.ceil((totalDuration - elapsed) / 1000));

          const dashOffset = ARC_CIRCUMFERENCE * (1 - progress);
          ringProgress.style.strokeDashoffset = `${dashOffset}`;

          const fillPercent = 20 + progress * 68;
          liquidFill.style.height = `${fillPercent.toFixed(1)}%`;

          if (secondsLeft !== currentDisplayed && elapsed < totalDuration) {
            currentDisplayed = secondsLeft;
            countdownNum.textContent = String(secondsLeft);
            countdownNum.classList.add('pop');

            setTimeout(() => countdownNum.classList.remove('pop'), 180);
          }

          if (elapsed < totalDuration) {
            requestAnimationFrame(tick);
          } else {
            completeCountdown(destinationPromise);
          }
        }

        requestAnimationFrame(tick);
      }

      async function completeCountdown(destinationPromise) {
        finalRedirectUrl = await destinationPromise;

        if (hasError || !finalRedirectUrl) return;

        ringProgress.style.strokeDashoffset = '0';
        liquidFill.style.height = '100%';
        countdownNum.textContent = '0';
        countdownNum.classList.add('pop');

        statusSub.textContent = 'ʀᴇᴅɪʀᴇᴄᴛɪɴɢ...';
        btnSpinner.style.display = 'none';
        downloadBtnText.textContent = 'ᴘʀᴏᴄᴇᴇᴅ ᴛᴏ ᴅᴇꜱᴛɪɴᴀᴛɪᴏɴ →';
        downloadBtn.href = finalRedirectUrl;
        downloadBtn.classList.add('ready');
        downloadBtn.setAttribute('aria-disabled', 'false');

        // Automatic redirect
        setTimeout(() => {
          window.location.href = finalRedirectUrl;
        }, 300);
      }

      downloadBtn.addEventListener('click', function (e) {
        if (!finalRedirectUrl || hasError) {
          e.preventDefault();
          return;
        }

        window.location.href = finalRedirectUrl;
      });

      startCountdown();
    })();
  </script>

</body>
</html>
