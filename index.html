
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PREPARING YOUR DOWNLOAD LINK...</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 18px;
    background:
        radial-gradient(ellipse at 50% 40%, #142e50 0%, transparent 55%),
        linear-gradient(135deg, #030814, #0a192c, #030814);
    font-family: 'Poppins', sans-serif;
    color: white;
}

/* MAIN CARD */

.card {
    width: 100%;
    max-width: 340px;
    padding: 25px 22px;
    text-align: center;
    border-radius: 25px;
    background: linear-gradient(145deg, #122840, #071323);
    border: 1px solid rgba(60, 220, 255, .28);
    box-shadow:
        0 0 35px rgba(0, 195, 255, .13),
        0 20px 55px rgba(0, 0, 0, .5);
}

/* ROUND LOGO */

.logo-box {
    width: 82px;
    height: 82px;
    margin: 0 auto 12px;
    padding: 4px;
    border-radius: 50%;
    border: 2px solid #42dfff;
    box-shadow:
        0 0 12px rgba(0, 215, 255, .6),
        0 0 28px rgba(0, 150, 255, .25);
    overflow: hidden;
}

.logo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
}

.brand {
    font-family: 'Orbitron', sans-serif;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #ffffff, #53eaff, #a58bff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.tagline {
    margin-top: 6px;
    font-size: 9px;
    letter-spacing: 2px;
    color: #8caec7;
}

.line {
    width: 65px;
    height: 2px;
    margin: 18px auto;
    border-radius: 10px;
    background: linear-gradient(90deg, #28dfff, #967aff);
    box-shadow: 0 0 10px #28dfff;
}

.heading {
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    color: #e4faff;
}

.description {
    margin-top: 8px;
    margin-bottom: 24px;
    font-size: 9px;
    letter-spacing: 1px;
    color: #91a9bd;
}

/* PERFECT ROUND COUNTDOWN */

.timer-wrap {
    width: 170px;
    height: 170px;
    margin: 0 auto 22px;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 50%;
}

.ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid rgba(57, 220, 255, .35);
    box-shadow:
        0 0 15px rgba(0, 207, 255, .35),
        inset 0 0 15px rgba(0, 207, 255, .1);
}

.orbit {
    position: absolute;
    inset: -7px;
    border-radius: 50%;
    border: 2px dashed rgba(78, 223, 255, .7);
    animation: spin 12s linear infinite;
}

@keyframes spin {
    100% { transform: rotate(360deg); }
}

.circle {
    width: 142px;
    height: 142px;
    border-radius: 50%;
    overflow: hidden;
    position: relative;
    background: #06182c;
    border: 2px solid #42dfff;
    box-shadow:
        0 0 20px rgba(0, 200, 255, .4),
        inset 0 0 20px rgba(0, 0, 0, .8);
}

/* WATER FILL */

.water {
    position: absolute;
    width: 200%;
    height: 0%;
    left: -50%;
    bottom: 0;
    background: linear-gradient(
        180deg,
        #6ef0ff,
        #13a9e9 45%,
        #164fba
    );
    transition: height 1s linear;
}

.wave {
    position: absolute;
    width: 200%;
    height: 24px;
    top: -13px;
    left: 0;
    border-radius: 40%;
    background: rgba(115, 240, 255, .9);
    animation: wave 3.5s linear infinite;
}

.wave.second {
    left: -50%;
    top: -9px;
    opacity: .45;
    animation-duration: 5s;
}

@keyframes wave {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* TIMER TEXT */

.timer-content {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
}

#timer {
    font-family: 'Orbitron', sans-serif;
    font-size: 44px;
    font-weight: 800;
    color: white;
    text-shadow: 0 2px 10px #00101e;
}

.seconds {
    font-size: 9px;
    letter-spacing: 3px;
    color: white;
    text-shadow: 0 2px 8px #00101e;
}

/* STATUS */

.status {
    display: inline-block;
    padding: 8px 17px;
    border-radius: 30px;
    background: rgba(0, 200, 255, .08);
    border: 1px solid rgba(55, 220, 255, .4);
    color: #6deaff;
    font-size: 9px;
    letter-spacing: 1.5px;
    margin-bottom: 19px;
}

/* DOWNLOAD BUTTON */

.action-btn {
    display: block;
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    text-decoration: none;
    background: linear-gradient(100deg, #42e7ff, #8b9dff);
    color: #061323;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    opacity: .5;
    pointer-events: none;
    transition: .3s;
    box-shadow: 0 0 15px rgba(0, 210, 255, .2);
}

.action-btn.ready {
    opacity: 1;
    pointer-events: auto;
}

.action-btn.ready:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 25px rgba(0, 210, 255, .5);
}

.footer {
    margin-top: 19px;
    color: #68849e;
    font-size: 8px;
    letter-spacing: 1.5px;
}

.telegram {
    display: inline-block;
    margin-top: 12px;
    text-decoration: none;
    color: #69ddff;
    font-size: 9px;
    letter-spacing: 1px;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo-box">
        <img src="RudraMovies.png" class="logo" alt="Rudra Movies">
    </div>

    <div class="brand">RUDRA MOVIES</div>
    <div class="tagline">YOUR CINEMATIC DESTINATION</div>

    <div class="line"></div>

    <div class="heading">LINK PREPARATION</div>

    <div class="description">
        PLEASE WAIT WHILE WE PREPARE YOUR LINK
    </div>

    <div class="timer-wrap">

        <div class="ring"></div>
        <div class="orbit"></div>

        <div class="circle">

            <div class="water" id="water">
                <div class="wave"></div>
                <div class="wave second"></div>
            </div>

            <div class="timer-content">
                <div id="timer">5</div>
                <div class="seconds">SECONDS</div>
            </div>

        </div>
    </div>

    <div class="status" id="status">
        PREPARING YOUR LINK...
    </div>

    <a href="#" class="action-btn" id="actionBtn">
        PLEASE WAIT...
    </a>

    <div class="footer">
        FAST • SIMPLE • CINEMATIC
    </div>

    <a href="https://t.me/RudraMoviez"
       class="telegram"
       target="_blank"
       rel="noopener noreferrer">
        JOIN OUR TELEGRAM CHANNEL
    </a>

</div>

<script>
const timer = document.getElementById("timer");
const water = document.getElementById("water");
const status = document.getElementById("status");
const button = document.getElementById("actionBtn");

const params = new URLSearchParams(window.location.search);
const redirect = params.get("redirect");

let safeLink = null;

if (redirect) {
    try {
        const url = new URL(redirect);

        if (url.protocol === "https:") {
            safeLink = url.href;
        }
    } catch (error) {
        safeLink = null;
    }
}

let seconds = 5;

function countdown() {
    timer.textContent = seconds;

    const fill = ((5 - seconds) / 5) * 100;
    water.style.height = fill + "%";

    if (seconds > 0) {
        seconds--;
        setTimeout(countdown, 1000);
    } else {
        complete();
    }
}

function complete() {
    timer.textContent = "✓";
    water.style.height = "100%";

    if (safeLink) {
        status.textContent = "YOUR LINK IS READY";
        button.textContent = "DOWNLOAD NOW";
        button.href = safeLink;
        button.classList.add("ready");
    } else {
        status.textContent = "DIRECT LINK NOT FOUND";
        button.textContent = "LINK UNAVAILABLE";
        button.removeAttribute("href");
    }
}

countdown();
</script>

</body>
</html>
