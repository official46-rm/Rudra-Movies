<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preparing Your Download Link...</title>
    <style>
        /* Global CSS Reset & Layout Configuration */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Replicates the complex purple & deep blue dark gradient mesh */
            background: radial-gradient(circle at 80% 20%, #4a154b 0%, #101726 60%, #0d2040 100%);
            padding: 16px;
            overflow-x: hidden;
        }

        /* Centralized Card Wrapper */
        .card-container {
            width: 100%;
            max-width: 360px;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.02) 100%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 40px 24px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.1);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
        }

        /* Top Header Image Placeholder Component */
        .logo-box {
            width: 72px;
            height: 72px;
            background-color: #000000;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.25);
            margin-bottom: 24px;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.1);
        }
        
        .logo-box-header {
            color: #858585;
            font-size: 6px;
            font-weight: 600;
            letter-spacing: 0.3px;
            margin-bottom: 2px;
        }

        .error-code { 
            color: #ffffff; 
            font-size: 15px; 
            font-weight: 700; 
            letter-spacing: 0.5px;
            line-height: 1.1;
        }
        
        .error-text { 
            color: #858585; 
            font-size: 7px; 
            font-weight: 600;
            letter-spacing: 0.3px;
            margin-top: 2px;
        }

        /* Text Headings & Verification Status Badge */
        .main-title {
            color: #ffffff;
            font-size: 18px;
            letter-spacing: 0.8px;
            font-weight: 700;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .badge {
            background-color: rgba(0, 168, 120, 0.15);
            color: #12ffb3;
            font-size: 9.5px;
            font-weight: 700;
            letter-spacing: 0.6px;
            padding: 5px 14px 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 170, 0.25);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 34px;
        }
        
        .badge .dot {
            width: 6px;
            height: 6px;
            background-color: #12ffb3;
            border-radius: 50%;
            box-shadow: 0 0 8px #12ffb3;
        }

        /* SVG Countdown Graphics Core Container */
        .timer-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin-bottom: 34px;
        }

        .timer-svg {
            transform: rotate(-90deg);
            width: 140px;
            height: 140px;
        }

        .track-ring {
            fill: #0c1a2d;
            stroke: rgba(255, 255, 255, 0.04);
            stroke-width: 5;
        }

        .progress-ring {
            fill: none;
            stroke: url(#cyanBlueGradient);
            stroke-width: 5;
            stroke-linecap: round;
            stroke-dasharray: 386.42; 
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
        }

        /* Neon Glow Filter Layer for Visual Effect Match */
        .glow-ring {
            fill: none;
            stroke: #00bfff;
            stroke-width: 5;
            stroke-linecap: round;
            stroke-dasharray: 386.42;
            stroke-dashoffset: 0;
            opacity: 0.3;
            filter: blur(4px);
            transform: rotate(-90deg);
            transform-origin: center;
            position: absolute;
            top: 0;
            left: 0;
            width: 140px;
            height: 140px;
            pointer-events: none;
            transition: stroke-dashoffset 1s linear;
        }

        .timer-number {
            position: absolute;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 52px;
            font-weight: 600;
        }

        /* Text Notifications Container */
        .status-container {
            margin-bottom: 30px;
        }
        
        .status-title {
            color: #ffffff;
            font-size: 13.5px;
            font-weight: 700;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        
        .status-subtitle {
            color: #a4b3c6;
            font-size: 13px;
            font-weight: 400;
        }

        /* Action Form Buttons Infrastructure */
        .btn {
            width: 100%;
            padding: 15px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.6px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            margin-bottom: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: transform 0.15s ease, opacity 0.2s ease, background 0.2s ease;
            text-decoration: none;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Primary Blue Verification Action Element */
        .btn-verifying {
            background: linear-gradient(90deg, #096199 0%, #20337c 100%);
            color: #ffffff;
            border-bottom: 1px solid rgba(0, 0, 0, 0.2);
            box-shadow: 0 4px 12px rgba(9, 97, 153, 0.2);
        }

        /* Secondary Transparent Outlined Custom Action Element */
        .btn-channel {
            background: rgba(255, 255, 255, 0.04);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 24px;
        }
        
        .btn-channel:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        /* Loading Indicator CSS Spin Sequence */
        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s infinite linear;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer Copyright Text Layout */
        .footer-text {
            color: #61738c;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Top Image / System Info Placement Block -->
        <div class="RudraMovies.png">
            <span class="logo-box-header">FREE IMAGE HOST</span>
            <span class="error-code">404</span>
            <span class="error-text">NOT FOUND</span>
        </div>

        
        <h1 class="main-title">RUDRA MOVIEZ</h1>
        <div class="badge">
            <span class="dot"></span> SECURED & VERIFIED LINK
        </div>

        <!-- System SVG Radial Progress Visualizer Component -->
        <div class="timer-container">
            <svg class="timer-svg">
                <defs>
                    <linearGradient id="cyanBlueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#00e5ff" />
                        <stop offset="50%" stop-color="#00a2ff" />
                        <stop offset="100%" stop-color="#0055ff" />
                    </linearGradient>
                </defs>
                <circle class="track-ring" cx="70" cy="70" r="61.5"></circle>
                <circle class="progress-ring" id="progressCircle" cx="70" cy="70" r="61.5"></circle>
            </svg>
            <svg class="glow-ring"><circle cx="70" cy="70" r="61.5" id="glowCircle"></circle></svg>
            
            <div class="timer-number" id="countdownText">2</div>
        </div>

        <!-- Current Verification Process Logs Notification Message -->
        <div class="status-container">
            <h2 class="status-title" id="statusHeader">SECURITY VERIFICATION</h2>
            <p class="status-subtitle" id="statusMessage">Redirecting in progress...</p>
        </div>

        <!-- Navigation Link Button Execution Group -->
        <button class="btn btn-verifying" id="actionBtn">
            <span class="spinner" id="btnSpinner"></span>
            <span id="btnText">VERIFYING...</span>
        </button>

        <a href="https://t.me/RudraMoviez" target="_blank" class="btn btn-channel">
            <span style="color: #38b6ff; font-size: 10px; margin-right: -2px;">➤</span> ⚡ RUDRA MAIN CHANNEL ✨
        </a>
