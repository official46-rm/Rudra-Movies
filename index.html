
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUDRA MOVIES - Link Preparation</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --cyan: #28eaff;
  --blue: #168bff;
  --purple: #895cff;
  --pink: #ed55db;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 18px;
  overflow-x: hidden;
  font-family: Arial, sans-serif;
  color: white;
  background:
    radial-gradient(ellipse at 15% 20%, #102e53 0%, transparent 42%),
    radial-gradient(ellipse at 85% 80%, #29134b 0%, transparent 42%),
    linear-gradient(135deg, #030812, #080d1b 55%, #090817);
}

body::before,
body::after {
  content: "";
  position: fixed;
  width: 230px;
  height: 230px;
  border-radius: 50%;
  filter: blur(100px);
  opacity: .17;
  pointer-events: none;
}

body::before {
  background: #00cfff;
  top: 5%;
  left: -100px;
}

body::after {
  background: #a12dff;
  bottom: 0;
  right: -100px;
}

.card {
  position: relative;
  width: 100%;
  max-width: 390px;
  padding: 30px 23px 25px;
  text-align: center;
  overflow: hidden;
  border: 1px solid rgba(120, 210, 255, .19);
  border-radius: 25px;
  background: linear-gradient(
    145deg,
    rgba(21, 36, 59, .94),
    rgba(8, 13, 28, .97)
  );
  box-shadow:
    0 25px 80px rgba(0, 0, 0, .55),
    inset 0 1px 1px rgba(255,255,255,.08),
    0 0 35px rgba(0, 174, 255, .08);
}

.card::before {
  content: "";
  position: absolute;
  width: 220px;
  height: 220px;
  top: -150px;
  left: 50%;
  transform: translateX(-50%);
  background: #14cfff;
  filter: blur(100px);
  opacity: .17;
  pointer-events: none;
}

/* LOGO */

.logo-area {
  position: relative;
  z-index: 2;
  margin-bottom: 20px;
}

.logo {
  width: 88px;
  height: 88px;
  object-fit: contain;
  display: block;
  margin: 0 auto 12px;
  filter: drop-shadow(0 0 13px rgba(0, 207, 255, .3));
}

.brand {
  font-size: 23px;
  font-weight: 900;
  letter-spacing: 3px;
  background: linear-gradient(90deg, #fff, #71eaff, #b78cff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.brand-sub {
  margin-top: 5px;
  font-size: 9px;
  letter-spacing: 3px;
  color: #849bb9;
}

/* HEADING */

.heading {
  position: relative;
  z-index: 2;
  margin-top: 25px;
  font-size: 17px;
  letter-spacing: 2px;
  font-weight: 800;
}

.description {
  position: relative;
  z-index: 2;
  margin-top: 9px;
  color: #91a9c5;
  font-size: 10px;
  letter-spacing: 1.5px;
}

/* COUNTDOWN */

.timer-wrap {
  position: relative;
  width: 142px;
  height: 142px;
  margin: 28px auto 25px;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Rotating dotted decoration */

.dotted-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px dashed rgba(91, 211, 255, .28);
  animation: rotateRing 18s linear infinite;
}

@keyframes rotateRing {
  to { transform: rotate(360deg); }
}

/* Outer SVG ring */

.outer-ring {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
  overflow: visible;
  z-index: 4;
}

.ring-bg {
  fill: none;
  stroke: rgba(255,255,255,.09);
  stroke-width: 7;
}

.ring-fill {
  fill: none;
  stroke: url(#ringGradient);
  stroke-width: 7;
  stroke-linecap: round;
  stroke-dasharray: 408.4;
  stroke-dashoffset: 408.4;
  filter: drop-shadow(0 0 5px rgba(35, 220, 255, .65));
}

/* Moving light */

.ring-dot {
  position: absolute;
  width: 10px;
  height: 10px;
  top: 2px;
  left: 50%;
  margin-left: -5px;
  border-radius: 50%;
  background: white;
  box-shadow:
    0 0 7px white,
    0 0 15px #25dfff,
    0 0 25px #168bff;
  z-index: 6;
  transform-origin: 5px 69px;
}

/* INNER WATER CIRCLE */

.water-circle {
  position: relative;
  width: 106px;
  height: 106px;
  overflow: hidden;
  border-radius: 50%;
  isolation: isolate;
  background: radial-gradient(circle at 35% 25%, #183f62, #071526 75%);
  border: 2px solid rgba(112, 221, 255, .45);
  box-shadow:
    inset 0 0 18px rgba(0,0,0,.7),
    0 0 15px rgba(25, 200, 255, .17);
  z-index: 2;
}

/* Liquid body */

.water-level {
  position: absolute;
  left: -20%;
  bottom: 0;
  width: 140%;
  height: 0%;
  overflow: hidden;
  background: linear-gradient(
    180deg,
    rgba(89, 235, 255, .96) 0%,
    rgba(20, 169, 255, .96) 30%,
    rgba(12, 104, 222, .98) 70%,
    #102f91 100%
  );
  transition: height .08s linear;
  z-index: 1;
}

/* Main moving wave */

.wave {
  position: absolute;
  width: 200%;
  height: 23px;
  top: -12px;
  left: -50%;
  border-radius: 43%;
  background: rgba(179, 250, 255, .8);
  animation: waveMove 3.5s linear infinite;
}

.wave.wave-two {
  top: -9px;
  left: -45%;
  height: 20px;
  background: rgba(24, 174, 255, .8);
  animation: waveMove 5s linear infinite reverse;
}

@keyframes waveMove {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* Water reflections */

.water-shine {
  position: absolute;
  width: 45px;
  height: 140%;
  top: -20%;
  left: 17%;
  transform: rotate(28deg);
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.15),
    transparent
  );
  animation: shineMove 3s ease-in-out infinite;
}

@keyframes shineMove {
  0%, 100% { left: 5%; opacity: .2; }
  50% { left: 75%; opacity: .8; }
}

/* Bubbles */

.bubble {
  position: absolute;
  bottom: -12px;
  width: 5px;
  height: 5px;
  border: 1px solid rgba(224, 255, 255, .8);
  border-radius: 50%;
  background: rgba(255,255,255,.17);
  animation: bubbleRise 3s linear infinite;
}

.bubble:nth-child(2) {
  left: 25%;
  animation-delay: .7s;
  width: 4px;
  height: 4px;
}

.bubble:nth-child(3) {
  left: 65%;
  animation-delay: 1.4s;
  width: 6px;
  height: 6px;
}

.bubble:nth-child(4) {
  left: 80%;
  animation-delay: 2s;
  width: 3px;
  height: 3px;
}

@keyframes bubbleRise {
  0% {
    transform: translateY(0) scale(.6);
    opacity: 0;
  }
  20% { opacity: .9; }
  100% {
    transform: translateY(-110px) scale(1.2);
    opacity: 0;
  }
}

/* Glass reflection */

.water-circle::after {
  content: "";
  position: absolute;
  inset: 5px;
  border-radius: 50%;
  border-top: 2px solid rgba(255,255,255,.22);
  border-left: 1px solid rgba(255,255,255,.12);
  pointer-events: none;
  z-index: 5;
}

.timer-text {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 7;
  font-size: 32px;
  font-weight: 900;
  color: white;
  text-shadow: 0 2px 12px rgba(0,0,0,.55);
}

/* STATUS */

.status {
  position: relative;
  z-index: 2;
  margin-bottom: 20px;
  color: #a9c5dc;
  font-size: 11px;
  letter-spacing: 1px;
}

.status span {
  color: #42eaff;
}

/* BUTTONS */

.buttons {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.btn {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  min-height: 47px;
  border: 0;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1px;
  text-decoration: none;
  transition: .25s ease;
}

.continue-btn {
  color: #06101d;
  background: linear-gradient(100deg, #43eaff, #438dff, #a06bff);
  box-shadow: 0 5px 20px rgba(36, 169, 255, .2);
  opacity: .45;
  pointer-events: none;
}

.continue-btn.active {
  opacity: 1;
  pointer-events: auto;
}

.continue-btn.active:active {
  transform: scale(.97);
}

.telegram-btn {
  color: #d9f8ff;
  background: rgba(30, 157, 225, .1);
  border: 1px solid rgba(48, 190, 255, .3);
}

.telegram-btn:active {
  background: rgba(30, 157, 225, .22);
}

.footer {
  position: relative;
  z-index: 2;
  margin-top: 21px;
  color: #62758f;
  font-size: 9px;
  letter-spacing: 1.5px;
}

</style>
</head>

<body>

<div class="card">

  <div class="logo-area">
    <img src="RudraMovies.png" class="logo" alt="Rudra Movies Logo"
         onerror="this.style.display='none'">

    <div class="brand">RUDRA MOVIES</div>
    <div class="brand-sub">YOUR ENTERTAINMENT DESTINATION</div>
  </div>

  <div class="heading">LINK PREPARATION</div>

  <div class="description">
    PREPARING YOUR DOWNLOAD LINK...
  </div>

  <div class="timer-wrap">

    <div class="dotted-ring"></div>

    <svg class="outer-ring" viewBox="0 0 142 142">
      <defs>
        <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#38efff"/>
          <stop offset="40%" stop-color="#168bff"/>
          <stop offset="75%" stop-color="#895cff"/>
          <stop offset="100%" stop-color="#ed55db"/>
        </linearGradient>
      </defs>

      <circle class="ring-bg" cx="71" cy="71" r="65"/>
      <circle class="ring-fill" id="ringFill" cx="71" cy="71" r="65"/>
    </svg>

    <div class="ring-dot" id="ringDot"></div>

    <div class="water-circle">

      <div class="water-level" id="waterLevel">

        <div class="wave"></div>
        <div class="wave wave-two"></div>

        <div class="water-shine"></div>

        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>

      </div>

      <div class="timer-text" id="timer">5</div>

    </div>
  </div>

  <div class="status" id="status">
    PLEASE WAIT <span>•</span> 5 SECONDS
  </div>

  <div class="buttons">

    <a href="#" class="btn continue-btn" id="continueBtn">
      <span id="buttonText">PLEASE WAIT...</span>
    </a>

    <a href="https://t.me/RudraMoviez"
       class="btn telegram-btn"
       target="_blank"
       rel="noopener">
      ✈ JOIN TELEGRAM CHANNEL
    </a>

  </div>

  <div class="footer">
    © RUDRA MOVIES • ALL RIGHTS RESERVED
  </div>

</div>

<script>
const TOTAL_TIME = 5;

const timer = document.getElementById("timer");
const waterLevel = document.getElementById("waterLevel");
const ringFill = document.getElementById("ringFill");
const ringDot = document.getElementById("ringDot");
const status = document.getElementById("status");
const continueBtn = document.getElementById("continueBtn");
const buttonText = document.getElementById("buttonText");

const circumference = 2 * Math.PI * 65;

ringFill.style.strokeDasharray = circumference;
ringFill.style.strokeDashoffset = circumference;

const params = new URLSearchParams(window.location.search);
const redirectValue = params.get("redirect");

let redirectUrl = null;

try {
  if (redirectValue) {
    const parsed = new URL(redirectValue);

    if (parsed.protocol === "https:") {
      redirectUrl = parsed.href;
    }
  }
} catch (error) {
  redirectUrl = null;
}

const startTime = performance.now();
let lastSecond = TOTAL_TIME;

function animate(now) {
  const elapsed = (now - startTime) / 1000;
  const progress = Math.min(elapsed / TOTAL_TIME, 1);

  // Water rises from bottom to top
  waterLevel.style.height = (progress * 100) + "%";

  // Outer ring fills progressively
  ringFill.style.strokeDashoffset =
    circumference * (1 - progress);

  // Moving light follows the circular ring
  ringDot.style.transform =
    `rotate(${progress * 360}deg)`;

  const remaining = Math.max(
    0,
    Math.ceil(TOTAL_TIME - elapsed)
  );

  if (remaining !== lastSecond) {
    timer.textContent = remaining;
    lastSecond = remaining;
  }

  if (progress < 1) {
    requestAnimationFrame(animate);
  } else {
    finishCountdown();
  }
}

function finishCountdown() {
  timer.textContent = "✓";
  status.innerHTML = '<span>LINK READY</span>';

  if (redirectUrl) {
    buttonText.textContent = "➜ CONTINUE TO LINK";
    continueBtn.href = redirectUrl;
    continueBtn.classList.add("active");
  } else {
    buttonText.textContent = "DIRECT LINK NOT FOUND";
    continueBtn.removeAttribute("href");
    continueBtn.classList.remove("active");
  }
}

requestAnimationFrame(animate);
</script>

</body>
</html>
