<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#071426">
  <meta name="description" content="Rudra Movies secure download gateway.">
  <title>PREPARING YOUR DOWNLOAD LINK... | RUDRA MOVIES</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#040b16; --panel:#0a172c; --cyan:#00f0ff; --blue:#388bff;
      --violet:#9b72ff; --white:#ffffff; --muted:#94b0d0;
      --green:#42e6ae; --danger:#ff5c75;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html{min-height:100%;background:var(--bg)}
    body{
      min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
      padding:24px 16px;overflow-x:hidden;position:relative;isolation:isolate;
      color:var(--white);font-family:Inter,Arial,sans-serif;
      background:
        radial-gradient(circle at 10% 15%,rgba(0,210,255,.28),transparent 42%),
        radial-gradient(circle at 90% 20%,rgba(155,80,255,.25),transparent 45%),
        radial-gradient(circle at 50% 95%,rgba(0,255,200,.18),transparent 50%),
        linear-gradient(135deg,#050f20 0%,#030812 55%,#0b0d26 100%);
    }
    .background-effects{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
    .glow{position:absolute;width:400px;height:400px;border-radius:50%;filter:blur(120px);opacity:.45;animation:glowMove 14s ease-in-out infinite alternate}
    .glow-blue{top:-140px;left:-140px;background:#0077ff}
    .glow-purple{top:18%;right:-180px;background:#8b38ff;animation-delay:-5s}
    .glow-cyan{bottom:-160px;left:22%;background:#00e5ff;animation-delay:-8s}
    @keyframes glowMove{to{transform:translate(40px,-35px) scale(1.25)}}
    .grid-overlay{position:absolute;inset:0;opacity:.12;background-image:linear-gradient(rgba(0,240,255,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.18) 1px,transparent 1px);background-size:45px 45px;mask-image:linear-gradient(to bottom,#000,transparent 85%)}

    .page-shell{width:100%;max-width:420px;position:relative;z-index:1}
    .card{
      width:100%;position:relative;overflow:hidden;isolation:isolate;padding:34px 24px 26px;
      border-radius:32px;text-align:center;
      background:radial-gradient(circle at 0 0,rgba(0,210,255,.22),transparent 48%),
                 radial-gradient(circle at 100% 100%,rgba(155,90,255,.2),transparent 48%),
                 linear-gradient(150deg,rgba(13,31,56,.98),rgba(6,18,35,.99) 60%,rgba(16,19,45,.98));
      border:1px solid rgba(0,240,255,.35);
      box-shadow:0 40px 100px rgba(0,0,0,.7),0 0 60px rgba(0,200,255,.2),inset 0 1px 0 rgba(255,255,255,.25);
      box-shadow:0 24px 65px rgba(0,0,0,.55),0 0 24px rgba(0,200,255,.10);
      transition:box-shadow .3s ease;
    }
    .card:hover{box-shadow:0 28px 75px rgba(0,0,0,.62),0 0 32px rgba(0,240,255,.16),inset 0 1px 0 rgba(255,255,255,.25)}
    .card:before{content:"";position:absolute;inset:0;padding:1.8px;border-radius:inherit;background:conic-gradient(from var(--edge-angle,0deg),transparent 0deg,#00f0ff 60deg,#388bff 120deg,transparent 180deg,#ff5cb2 240deg,#9b72ff 300deg,transparent 360deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.95;animation:edgeRotate 7s linear infinite}
    .card:after{content:"";position:absolute;top:0;left:10%;width:80%;height:2px;background:linear-gradient(90deg,transparent,#00f0ff,#b89eff,transparent);opacity:.95;box-shadow:0 0 12px #00f0ff;pointer-events:none}
    @property --edge-angle{syntax:"<angle>";inherits:false;initial-value:0deg}
    @keyframes edgeRotate{to{--edge-angle:360deg}}
    @keyframes cardEnter{from{opacity:0;transform:translateY(35px) scale(.94) rotateX(12deg)}to{opacity:1;transform:translateY(0) scale(1) rotateX(5deg) rotateY(-2deg)}}

    .top-label{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:18px;color:#94b0d0;font-size:.65rem;font-weight:700;letter-spacing:2px}
    .top-label-line{width:30px;height:1px;background:linear-gradient(90deg,transparent,#00f0ff);box-shadow:0 0 8px #00f0ff}
    .logo-wrap{width:86px;height:86px;margin:0 auto 16px;padding:3px;border-radius:26px;background:linear-gradient(140deg,#00f0ff,#388bff 50%,#b46bff);box-shadow:0 0 18px rgba(0,240,255,.24)}
    .logo-inner{width:100%;height:100%;overflow:hidden;border-radius:23px;background:#040b16}
    .logo-inner img{width:100%;height:100%;display:block;object-fit:cover}
    .brand-title{font-size:1.5rem;line-height:1.25;font-weight:900;letter-spacing:1px;color:#fff;text-shadow:0 0 18px rgba(0,240,255,.7),0 0 35px rgba(155,114,255,.4);margin-bottom:6px}
    .brand-subtitle{font-size:.68rem;font-weight:700;letter-spacing:2.5px;color:#94b0d0;margin-bottom:22px}
    .verified-pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 16px;border-radius:50px;border:1px solid rgba(0,240,255,.4);background:rgba(0,240,255,.1);box-shadow:inset 0 0 18px rgba(0,240,255,.15),0 0 20px rgba(0,240,255,.1);margin-bottom:24px}
    .verified-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);animation:statusBlink 1.8s ease-in-out infinite}
    .verified-text{color:#5effe0;font-size:.72rem;font-weight:800;letter-spacing:1px;text-shadow:0 0 8px rgba(94,255,224,.5)}
    @keyframes statusBlink{50%{opacity:.4;transform:scale(.75)}}

    .countdown-area{margin:0 auto 24px;width:172px;height:172px;display:flex;align-items:center;justify-content:center;position:relative;perspective:700px;filter:drop-shadow(0 14px 24px rgba(0,0,0,.55))}
    .orbit{position:absolute;inset:0;border:1px dashed rgba(0,240,255,.7);border-radius:50%;animation:orbitSpin 20s linear infinite}
    .orbit:before{content:"";position:absolute;width:9px;height:9px;top:15px;left:24px;border-radius:50%;background:#00f0ff;box-shadow:0 0 15px #00f0ff,0 0 30px #388bff}
    .orbit-inner{position:absolute;inset:8px;border:1px solid rgba(155,114,255,.35);border-radius:50%;animation:orbitSpin 12s linear infinite reverse}
    @keyframes orbitSpin{to{transform:rotate(360deg)}}
    .progress-svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg) rotateX(13deg);z-index:3;pointer-events:none;filter:drop-shadow(0 0 5px rgba(0,240,255,.75))}
    .progress-track{fill:none;stroke:rgba(0,240,255,.16);stroke-width:7}
    .progress-ring{fill:none;stroke:url(#progressGradient);stroke-width:7;stroke-linecap:round;stroke-dasharray:361.28;stroke-dashoffset:361.28;filter:drop-shadow(0 0 5px #00f0ff) drop-shadow(0 0 13px #388bff);transition:stroke-dashoffset .12s linear}
    .liquid-ball{width:128px;height:128px;position:relative;overflow:hidden;border-radius:50%;border:4px solid rgba(0,240,255,.82);background:radial-gradient(ellipse at 32% 18%,#368cb5 0%,#102f55 38%,#041326 78%);box-shadow:inset 0 10px 18px rgba(255,255,255,.17),inset 0 -14px 24px rgba(0,0,0,.8),inset 0 0 18px rgba(0,240,255,.35),0 0 14px rgba(0,240,255,.7),0 0 34px rgba(0,240,255,.34),0 8px 18px rgba(0,0,0,.6);transform:translateZ(18px);z-index:2}
    .liquid-fill{position:absolute;bottom:0;left:0;width:100%;height:0%;background:linear-gradient(180deg,rgba(0,255,242,.98),rgba(0,200,255,.92) 55%,rgba(30,120,250,.95));box-shadow:0 0 30px #00f0ff;transition:height .08s linear}
    .liquid-fill:before{content:"";position:absolute;left:-15%;top:-8px;width:130%;height:16px;border-radius:50%;background:#bffffd;box-shadow:0 0 20px rgba(0,240,255,1),0 0 35px #fff;animation:liquidWave 1.6s ease-in-out infinite alternate}
    @keyframes liquidWave{to{transform:translateY(5px) scaleY(1.45)}}
    .ball-shine{position:absolute;inset:0;z-index:3;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.5),transparent 55%)}
    .count-number{position:absolute;z-index:4;font-size:3rem;font-weight:900;color:white;text-shadow:0 2px 3px #02203a,0 0 12px rgba(0,240,255,1),0 0 24px rgba(0,160,255,.85);transition:transform .28s cubic-bezier(.22,1,.36,1),opacity .2s ease;transform:translateZ(32px)}
    .count-number.pop{transform:scale(1.22)}

    .status-section{margin-bottom:20px}
    .status-title{font-size:.95rem;font-weight:800;letter-spacing:1px;margin-bottom:6px;color:#fff;text-shadow:0 0 10px rgba(0,240,255,.3)}
    .status-description{font-size:.8rem;color:var(--muted);font-weight:500;line-height:1.5}
    .status-progress{width:100%;max-width:190px;height:4.5px;margin:14px auto 0;overflow:hidden;border-radius:10px;background:rgba(255,255,255,.08);box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
    .status-progress span{display:block;width:35%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#00f0ff,#388bff,#9b72ff);box-shadow:0 0 12px #00f0ff;animation:loadingBar 1.8s ease-in-out infinite}
    @keyframes loadingBar{from{transform:translateX(-120%)}to{transform:translateX(350%)}}
    .error-box{display:none;padding:12px;margin-bottom:15px;border-radius:14px;text-align:left;color:#ffd1d9;background:rgba(255,92,117,.14);border:1px solid rgba(255,92,117,.4);font-size:.78rem;line-height:1.5;overflow-wrap:anywhere}

    .buttons{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
    .button{width:100%;min-height:54px;padding:12px;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:16px;text-decoration:none;font-family:inherit;font-size:.85rem;font-weight:800;letter-spacing:.8px;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;cursor:pointer}
    .download-button{color:rgba(224,241,255,.65);background:linear-gradient(110deg,#103e6b,#14376b);border:1px solid rgba(0,240,255,.3);box-shadow:0 4px 0 #072242,0 10px 24px rgba(0,100,255,.15);pointer-events:none}
    .download-button.ready{color:#fff;background:linear-gradient(110deg,#00d5e8,#237ff3 55%,#9b72ff);border-color:rgba(120,245,255,.85);box-shadow:0 4px 0 #0b357d,0 14px 36px rgba(0,240,255,.6);pointer-events:auto;animation:buttonGlow 1.8s ease-in-out infinite}
    @keyframes buttonGlow{50%{box-shadow:0 4px 0 #0b357d,0 16px 42px rgba(0,240,255,.8)}}
    .download-button.ready:hover,.telegram-button:hover{transform:translateY(-3px)}
    .spinner{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.25);border-top-color:#00f0ff;border-radius:50%;animation:spin .8s linear infinite;filter:drop-shadow(0 0 6px #00f0ff)}
    @keyframes spin{to{transform:rotate(360deg)}}
    .telegram-button{color:#fff;background:linear-gradient(110deg,rgba(0,240,255,.12),rgba(155,114,255,.15));border:1px solid rgba(0,240,255,.4);box-shadow:0 4px 0 rgba(3,8,20,.6),0 8px 22px rgba(0,0,0,.2)}
    .telegram-button:hover{background:rgba(0,240,255,.22);border-color:rgba(0,240,255,.75);box-shadow:0 4px 0 rgba(3,8,20,.6),0 12px 28px rgba(0,240,255,.3)}
    .telegram-icon{width:18px;height:18px;flex-shrink:0;color:#00f0ff;filter:drop-shadow(0 0 6px #00f0ff)}
    .footer{padding-top:16px;border-top:1px solid rgba(0,240,255,.15)}
    .footer-brand{color:#94b0d0;font-size:.72rem;font-weight:800;letter-spacing:1.5px;text-shadow:0 0 8px rgba(0,240,255,.25)}
    .footer-caption{margin-top:6px;color:rgba(148,176,208,.6);font-size:.62rem;letter-spacing:1.2px}

    /* CONSISTENT SMALL-CAPS TYPOGRAPHY */
    .top-label,.brand-title,.brand-subtitle,.verified-text,.status-title,.button,.footer-brand,.footer-caption{
      font-variant:small-caps;
      letter-spacing:1.2px;
    }

    @media(max-width:360px){body{padding:12px}.card{padding:25px 15px 18px}.countdown-area{transform:scale(.92);margin-bottom:18px}.brand-title{font-size:1.3rem}}
    @media(max-height:690px){body{align-items:flex-start}}
    @media(min-width:768px){.page-shell{max-width:430px}.card{padding:36px 26px 25px}}
    @media(hover:none){.card:hover{box-shadow:0 24px 65px rgba(0,0,0,.55),0 0 24px rgba(0,200,255,.10)}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="background-effects" aria-hidden="true">
    <div class="glow glow-blue"></div><div class="glow glow-purple"></div><div class="glow glow-cyan"></div><div class="grid-overlay"></div>
  </div>
  <main class="page-shell">
    <section class="card">
      <div class="top-label"><span class="top-label-line"></span>RUDRA DIGITAL GATEWAY<span class="top-label-line"></span></div>
      <div class="logo-wrap"><div class="logo-inner"><img src="RudraMovies.png" alt="Rudra Movies" onerror="this.style.opacity='.2'"></div></div>
      <h1 class="brand-title">RUDRA MOVIES</h1>
      <p class="brand-subtitle">PREMIUM DOWNLOAD EXPERIENCE</p>
      <div class="verified-pill"><span class="verified-dot" id="statusDot"></span><span class="verified-text">SECURED &amp; VERIFIED LINK</span></div>
      <div class="countdown-area">
        <div class="orbit"></div><div class="orbit-inner"></div>
        <svg class="progress-svg" viewBox="0 0 172 172" aria-hidden="true">
          <defs><linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00f0ff"/><stop offset="55%" stop-color="#388bff"/><stop offset="100%" stop-color="#9b72ff"/></linearGradient></defs>
          <circle class="progress-track" cx="86" cy="86" r="57.5"/><circle class="progress-ring" id="progressRing" cx="86" cy="86" r="57.5"/>
        </svg>
        <div class="liquid-ball"><div class="liquid-fill" id="liquidFill"></div><div class="ball-shine"></div></div>
        <div class="count-number" id="countdownNumber">5</div>
      </div>
      <div class="status-section">
        <div class="status-title" id="statusTitle">SECURE LINK VERIFICATION</div>
        <div class="status-description" id="statusDescription">Scanning your download link...</div>
        <div class="status-progress" id="loadingBar"><span></span></div>
      </div>
      <div class="error-box" id="errorBox" role="alert"></div>
      <div class="buttons">
        <a href="#" class="button download-button" id="downloadButton" role="button" aria-disabled="true">
          <span class="spinner" id="buttonSpinner"></span><span id="downloadButtonText">VERIFYING LINK...</span>
        </a>
        <a href="https://t.me/RudraMovies" class="button telegram-button" target="_blank" rel="noopener noreferrer">
          <svg class="telegram-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4l17.45-7.48a1 1 0 0 0 0-1.84L3.4 3.6a.993.993 0 0 0-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.07-.87.5-.87 1l.01 4.61c0 .71.73 1.2 1.39.91z"/></svg>
          <span>⚡ RUDRA MAIN CHANNEL ✦</span>
        </a>
      </div>
      <footer class="footer"><div class="footer-brand">⚡ RUDRA MOVIES SECURITY</div><div class="footer-caption">POWERED BY RUDRA DIGITAL SYSTEM</div></footer>
    </section>
  </main>
  <script>
    (function () {
      "use strict";
      const COUNTDOWN_SECONDS = 5;
      const RING_RADIUS = 57.5;
      const ARC_CIRCUMFERENCE = 2 * Math.PI * RING_RADIUS;
      const countdownNumber = document.getElementById("countdownNumber");
      const progressRing = document.getElementById("progressRing");
      const liquidFill = document.getElementById("liquidFill");
      const statusTitle = document.getElementById("statusTitle");
      const statusDescription = document.getElementById("statusDescription");
      const statusDot = document.getElementById("statusDot");
      const loadingBar = document.getElementById("loadingBar");
      const errorBox = document.getElementById("errorBox");
      const downloadButton = document.getElementById("downloadButton");
      const downloadButtonText = document.getElementById("downloadButtonText");
      const buttonSpinner = document.getElementById("buttonSpinner");

      progressRing.style.strokeDasharray = String(ARC_CIRCUMFERENCE);
      progressRing.style.strokeDashoffset = String(ARC_CIRCUMFERENCE);

      let finalRedirectUrl = null;
      let hasError = false;

      function parseValidUrl(input) {
        if (!input || typeof input !== "string") return null;
        const raw = input.trim();
        if (!raw) return null;

        try {
          const parsed = new URL(raw, window.location.origin);
          if (parsed.protocol === "https:" || parsed.protocol === "http:" || parsed.protocol === "tg:") {
            return parsed.href;
          }
        } catch (_) {}

        try {
          const decoded = atob(raw).trim();
          const parsed = new URL(decoded);
          if (parsed.protocol === "https:" || parsed.protocol === "http:" || parsed.protocol === "tg:") {
            return parsed.href;
          }
        } catch (_) {}

        return null;
      }

      function displayError(message) {
        if (hasError) return;
        hasError = true;

        buttonSpinner.style.display = "none";
        downloadButtonText.textContent = "LINK ERROR";
        statusTitle.textContent = "VERIFICATION FAILED";
        statusTitle.style.color = "var(--danger)";
        statusDescription.textContent = "Unable to continue with redirect.";
        statusDot.style.background = "var(--danger)";
        statusDot.style.boxShadow = "0 0 10px var(--danger)";
        countdownNumber.textContent = "!";
        liquidFill.style.height = "0%";
        loadingBar.style.display = "none";
        errorBox.textContent = message;
        errorBox.style.display = "block";
        downloadButton.classList.remove("ready");
        downloadButton.removeAttribute("href");
        downloadButton.setAttribute("aria-disabled", "true");
      }

      async function resolveDestination() {
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");
        const redirect = params.get("redirect");

        if (token) {
          try {
            let response = await fetch(`/api/verify?token=${encodeURIComponent(token)}`, {
              method: "GET",
              headers: {"Accept": "application/json"}
            });

            if (response.status === 405) {
              response = await fetch("/api/verify", {
                method: "POST",
                headers: {"Content-Type": "application/json", "Accept": "application/json"},
                body: JSON.stringify({token, redirect})
              });
            }

            const data = await response.json().catch(() => ({}));

            if (!response.ok || data.error || data.valid === false || data.success === false) {
              throw new Error(data.message || data.error || "This download token is invalid or has expired.");
            }

            const target = data.redirect || data.url || data.target || data.link || redirect;
            const validTarget = parseValidUrl(target);
            if (!validTarget) throw new Error("Destination download link is missing or invalid.");
            return validTarget;
          } catch (error) {
            displayError(error.message || "Failed to verify download token. Please try again.");
            return null;
          }
        }

        if (redirect) {
          const validTarget = parseValidUrl(redirect);
          if (validTarget) return validTarget;
          displayError("The provided redirect URL is invalid.");
          return null;
        }

        displayError("No download link or token was found in the URL.");
        return null;
      }

      function startCountdown() {
        const destinationPromise = resolveDestination();
        const startTime = performance.now();
        const totalDuration = COUNTDOWN_SECONDS * 1000;
        let previousSecond = COUNTDOWN_SECONDS;

        liquidFill.style.height = "15%";

        const statusTimer = setTimeout(() => {
          if (!hasError && !finalRedirectUrl) {
            statusDescription.textContent = "Preparing secure destination...";
          }
        }, 1200);

        function tick(now) {
          if (hasError) {
            clearTimeout(statusTimer);
            return;
          }

          const elapsed = Math.min(now - startTime, totalDuration);
          const progress = elapsed / totalDuration;
          const remaining = Math.max(1, Math.ceil((totalDuration - elapsed) / 1000));

          progressRing.style.strokeDashoffset = String(ARC_CIRCUMFERENCE * (1 - progress));
          liquidFill.style.height = `${15 + progress * 85}%`;

          if (remaining !== previousSecond && elapsed < totalDuration) {
            previousSecond = remaining;
            countdownNumber.textContent = String(remaining);
            countdownNumber.classList.add("pop");
            setTimeout(() => countdownNumber.classList.remove("pop"), 180);
          }

          if (elapsed < totalDuration) {
            requestAnimationFrame(tick);
          } else {
            completeCountdown(destinationPromise);
          }
        }

        requestAnimationFrame(tick);
      }

      async function completeCountdown(destinationPromise) {
        finalRedirectUrl = await destinationPromise;
        if (hasError || !finalRedirectUrl) return;

        progressRing.style.strokeDashoffset = "0";
        liquidFill.style.height = "100%";
        countdownNumber.textContent = "0";
        countdownNumber.classList.add("pop");

        statusTitle.textContent = "YOUR DESTINATION IS READY";
        statusDescription.textContent = "Secure verification completed.";
        statusDot.style.background = "var(--green)";
        statusDot.style.boxShadow = "0 0 12px var(--green)";
        loadingBar.style.display = "none";

        buttonSpinner.style.display = "none";
        downloadButtonText.textContent = "PROCEED TO DESTINATION →";
        downloadButton.href = finalRedirectUrl;
        downloadButton.classList.add("ready");
        downloadButton.setAttribute("aria-disabled", "false");

        setTimeout(() => {
          if (finalRedirectUrl && !hasError) {
            window.location.href = finalRedirectUrl;
          }
        }, 300);
      }

      downloadButton.addEventListener("click", function (event) {
        if (!finalRedirectUrl || hasError) {
          event.preventDefault();
          return;
        }
        event.preventDefault();
        window.location.href = finalRedirectUrl;
      });

      startCountdown();
    })();
  </script>
</body>
</html>
