<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUDRA MOVIES - Secure Link</title>
  
  <!-- ಸೂಪರ್ ರೆಟ್ರೋ & ಸೈಬರ್ ಗೇಮಿಂಗ್ ಫಾಂಟ್‌ಗಳು -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@600;700;800&family=Orbitron:wght@800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #030712;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      padding: 16px;
      font-family: 'Rajdhani', sans-serif;
      position: relative;
      overflow-x: hidden;
    }

    /* ನಿಯಾನ್ ಬ್ಯಾಕ್‌ಗ್ರೌಂಡ್ ಗ್ಲೋ */
    .bg-glow-1 {
      position: absolute;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.25), transparent 70%);
      top: 15%;
      left: 10%;
      filter: blur(50px);
      z-index: 0;
    }
    .bg-glow-2 {
      position: absolute;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.22), transparent 70%);
      bottom: 15%;
      right: 10%;
      filter: blur(50px);
      z-index: 0;
    }

    /* ಪ್ರೀಮಿಯಂ ಗ್ಲಾಸ್ ಕಾರ್ಡ್ */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 28px 20px;
      width: 100%;
      max-width: 350px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 25px rgba(6, 182, 212, 0.12);
    }

    /* ಲೋಗೋ */
    .logo-wrapper {
      position: relative;
      width: 70px;
      height: 70px;
      margin: 0 auto 12px;
    }
    .logo-wrapper::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      background: linear-gradient(45deg, #00f2fe, #f093fb);
      animation: spin 6s linear infinite;
      filter: blur(3px);
    }
    .logo-img {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #0284c7;
      border: 2px solid rgba(255, 255, 255, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      z-index: 1;
    }

    /* 🔥 ಚಿಕ್ಕದಾದ & ಮಸ್ತ್ ಆಗಿರೋ ಹೆಡ್ಡಿಂಗ್ ಫಾಂಟ್ 🔥 */
        .brand-title {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #38bdf8, #f472b6, #38bdf8);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 4s linear infinite;
      margin-top: 6px;
    }


    .security-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      font-size: 10px;
      font-weight: 700;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 4px 12px;
      border-radius: 20px;
      letter-spacing: 1px;
    }
    .security-badge span {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e;
    }

    /* ಟೈಮರ್ ಕಂಟೈನರ್ */
    .timer-container {
      position: relative;
      width: 160px;
      height: 160px;
      margin: 22px auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ಹೊರಗಿನ ತಿರುಗುವ ಡ್ಯಾಶ್ಡ್ ಸರ್ಕಲ್ */
    .outer-circle {
      position: absolute;
      width: 156px;
      height: 156px;
      border-radius: 50%;
      border: 1.5px dashed rgba(56, 189, 248, 0.35);
      animation: spin 10s linear infinite;
    }

    /* ಒಳಗಿನ ತಿರುಗುವ ಡಾಟ್ ಸರ್ಕಲ್ */
    .inner-circle {
      position: absolute;
      width: 138px;
      height: 138px;
      border-radius: 50%;
      border: 1.5px dotted rgba(232, 121, 249, 0.45);
      animation: spinReverse 7s linear infinite;
    }

    /* ತಿರುಗುವ ನಿಯಾನ್ ಆರೋಗಳು */
    .orbit-arrows {
      position: absolute;
      width: 156px;
      height: 156px;
      animation: spin 3.2s linear infinite;
      pointer-events: none;
    }
    .arrow-top {
      position: absolute;
      top: -7px;
      left: calc(50% - 6px);
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 10px solid #00f2fe;
      transform: rotate(90deg);
      filter: drop-shadow(0 0 6px #00f2fe);
    }
    .arrow-bottom {
      position: absolute;
      bottom: -7px;
      left: calc(50% - 6px);
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 10px solid #f093fb;
      transform: rotate(-90deg);
      filter: drop-shadow(0 0 6px #f093fb);
    }

    /* SVG ಪ್ರೋಗ್ರೆಸ್ ಬಾರ್ */
    .progress-svg {
      width: 115px;
      height: 115px;
      transform: rotate(-90deg);
      z-index: 2;
    }
    .progress-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.05);
      stroke-width: 8;
    }
    .progress-bar {
      fill: none;
      stroke: url(#neonGradient);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 314.16;
      stroke-dashoffset: 314.16;
      transition: stroke-dashoffset 1s linear;
      filter: drop-shadow(0 0 7px rgba(0, 242, 254, 0.6));
    }

    .timer-number {
      position: absolute;
      font-family: 'Orbitron', sans-serif;
      font-size: 34px;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.8);
      z-index: 3;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes shine {
      to { background-position: 200% center; }
    }

    /* ಸ್ಟೇಟಸ್ ಟೆಕ್ಸ್ಟ್ */
    .status-badge {
      font-size: 10px;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 2px;
      font-weight: 700;
    }
    .status-highlight {
      font-size: 12px;
      color: #38bdf8;
      font-weight: 700;
      margin-top: 3px;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }

    /* ಬಟನ್‌ಗಳು */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
      transition: all 0.3s ease;
      letter-spacing: 0.8px;
      border: none;
    }
    .btn-disabled {
      background: rgba(30, 41, 59, 0.7);
      color: #64748b;
      cursor: not-allowed;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .btn-ready {
      background: linear-gradient(135deg, #0284c7, #6366f1);
      color: #fff;
      box-shadow: 0 0 20px rgba(2, 132, 199, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
    }
    .btn-telegram {
      background: linear-gradient(135deg, #0284c7 0%, #06b6d4 100%);
      color: #fff;
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>

  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <div class="card">
    <!-- ಲೋಗೋ -->
    <div class="logo-wrapper">
      <img src="RudraMovies.png" alt="RM" class="logo-img" onerror="this.outerHTML='<div class=\'logo-img\'>RM</div>';">
    </div>

    <!-- 🔥 ಚಿಕ್ಕದಾದ & ಸ್ಟೈಲಿಶ್ ಹೆಡ್ಡಿಂಗ್ 🔥 -->
    <div class="brand-title">RUDRA MOVIES</div>
    
    <div class="security-badge">
      <span></span> HIGH SECURED LINK
    </div>

    <!-- ಅನಿಮೇಷನ್ ಕೌಂಟ್‌ಡೌನ್ -->
    <div class="timer-container">
      <div class="outer-circle"></div>
      <div class="inner-circle"></div>

      <div class="orbit-arrows">
        <div class="arrow-top"></div>
        <div class="arrow-bottom"></div>
      </div>

      <svg class="progress-svg">
        <defs>
          <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00f2fe" />
            <stop offset="50%" stop-color="#4facfe" />
            <stop offset="100%" stop-color="#f093fb" />
          </linearGradient>
        </defs>
        <circle class="progress-bg" cx="57.5" cy="57.5" r="50"></circle>
        <circle class="progress-bar" id="progress-bar" cx="57.5" cy="57.5" r="50"></circle>
      </svg>

      <div class="timer-number" id="timer">5</div>
    </div>

    <div class="status-badge">LINK STATUS</div>
    <div class="status-highlight" id="status-msg">VERIFYING SECURED LINK...</div>

    <!-- ರೀಡೈರೆಕ್ಟ್ ಬಟನ್ -->
    <a id="action-btn" class="btn btn-disabled" href="#">PLEASE WAIT...</a>

    <!-- ಟೆಲಿಗ್ರಾಂ ಬಟನ್ -->
    <a href="https://t.me/RudraMoviez" target="_blank" class="btn btn-telegram">
      ⚡ JOIN OFFICIAL CHANNEL ⚡
    </a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetRedirect = urlParams.get('redirect');

    const totalSeconds = 5;
    let currentSeconds = totalSeconds;

    const timerText = document.getElementById('timer');
    const statusMsg = document.getElementById('status-msg');
    const actionBtn = document.getElementById('action-btn');
    const progressBar = document.getElementById('progress-bar');

    const totalLength = 2 * Math.PI * 50;

    const interval = setInterval(() => {
      currentSeconds--;

      const percentage = (totalSeconds - currentSeconds) / totalSeconds;
      progressBar.style.strokeDashoffset = totalLength - (totalLength * percentage);

      if (currentSeconds > 0) {
        timerText.innerText = currentSeconds;
        actionBtn.innerText = `PLEASE WAIT (${currentSeconds}s)`;
        if (currentSeconds <= 2) {
          statusMsg.innerText = "FINALIZING DOWNLOAD LINK...";
        }
      } else {
        clearInterval(interval);
        timerText.innerText = "✓";
        progressBar.style.strokeDashoffset = 0;
        statusMsg.innerText = "VERIFICATION COMPLETE! LINK READY";

        if (targetRedirect) {
          actionBtn.href = targetRedirect;
          actionBtn.innerText = "DOWNLOAD NOW ➜";
          actionBtn.classList.remove('btn-disabled');
          actionBtn.classList.add('btn-ready');
        } else {
          actionBtn.innerText = "DIRECT LINK NOT FOUND";
        }
      }
    }, 1000);
  </script>
</body>
</html>
