
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PREPARING YOUR DOWNLOAD LINK...</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background:
        radial-gradient(circle at 15% 20%, #073c62, transparent 38%),
        radial-gradient(circle at 90% 85%, #30205d, transparent 38%),
        linear-gradient(145deg, #030b18, #10243a, #050d1c);
    font-family: 'Poppins', sans-serif;
    color: #fff;
}

.card {
    width: 100%;
    max-width: 355px;
    padding: 27px 22px 24px;
    text-align: center;
    border-radius: 25px;
    background: linear-gradient(145deg,
        rgba(19, 43, 66, .96),
        rgba(6, 19, 36, .98));
    border: 1px solid rgba(65, 220, 255, .28);
    box-shadow:
        0 15px 50px rgba(0,0,0,.4),
        0 0 30px rgba(0,190,255,.10);
}

/* LOGO */

.logo-box {
    width: 76px;
    height: 76px;
    margin: 0 auto 12px;
    padding: 4px;
    border-radius: 50%;
    background: #07182a;
    border: 2px solid #43e4ff;
    box-shadow:
        0 0 13px #22d9ff,
        0 0 28px rgba(0,195,255,.3);
    overflow: hidden;
}

.logo {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    border-radius: 50%;
}

.brand {
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(90deg,#eaffff,#48ddff,#a58aff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.divider {
    width: 85px;
    height: 3px;
    margin: 20px auto;
    border-radius: 10px;
    background: linear-gradient(90deg,#32e3ff,#a17cff);
    box-shadow: 0 0 12px #35dfff;
}

.heading {
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    color: #e5faff;
}

.description {
    margin-top: 8px;
    font-size: 9px;
    letter-spacing: 1.2px;
    color: #9bb2c6;
}

/* COUNTDOWN CIRCLE */

.timer-wrap {
    width: 170px;
    height: 170px;
    margin: 27px auto 23px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
}

.timer-wrap::before {
    content: "";
    position: absolute;
    inset: 0;
    border: 2px dashed rgba(61,220,255,.8);
    border-radius: 50%;
    filter: drop-shadow(0 0 5px #2bdcff);
    animation: rotate 15s linear infinite;
}

@keyframes rotate {
    to { transform: rotate(360deg); }
}

.timer-wrap::after {
    content: "";
    position: absolute;
    inset: 9px;
    border: 2px solid rgba(59,213,255,.2);
    border-radius: 50%;
    box-shadow: 0 0 15px rgba(0,200,255,.12);
}

.progress-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
    z-index: 2;
    overflow: visible;
}

.progress-bg,
.progress-bar {
    fill: none;
    stroke-width: 3.5;
}

.progress-bg {
    stroke: rgba(70,220,255,.16);
}

.progress-bar {
    stroke: #48e8ff;
    stroke-linecap: round;
    filter: drop-shadow(0 0 6px #27dfff);
    transition: stroke-dashoffset 1s linear;
}

/* INNER WATER CIRCLE */

.circle {
    width: 138px;
    height: 138px;
    position: relative;
    overflow: hidden;
    border-radius: 50%;
    background: #07182b;
    border: 2px solid #45e2ff;
    box-shadow:
        0 0 18px rgba(0,205,255,.4),
        inset 0 0 18px rgba(0,0,0,.5);
}

.water {
    position: absolute;
    left: -50%;
    bottom: 0;
    width: 200%;
    height: 0%;
    background: linear-gradient(
        180deg,
        #72efff 0%,
        #1bc4f0 40%,
        #078bd5 72%,
        #174db6 100%
    );
    transition: height .9s ease-in-out;
}

.wave {
    position: absolute;
    top: -12px;
    left: 0;
    width: 200%;
    height: 24px;
    border-radius: 40%;
    background: rgba(142,244,255,.85);
    animation: wave 4s linear infinite;
}

.wave.two {
    left: -50%;
    top: -8px;
    opacity: .35;
    animation-duration: 6s;
}

@keyframes wave {
    to { transform: rotate(360deg); }
}

.timer-content {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-shadow: 0 2px 8px #00101e;
}

#timer {
    font-family: 'Orbitron', sans-serif;
    font-size: 48px;
    font-weight: 800;
    color: #fff;
}

.seconds {
    margin-top: 5px;
    font-size: 9px;
    letter-spacing: 3px;
}

/* STATUS */

.status {
    display: inline-block;
    padding: 9px 18px;
    margin-bottom: 20px;
    border-radius: 30px;
    border: 1px solid rgba(62,220,255,.4);
    background: rgba(0,190,255,.07);
    color: #77eaff;
    font-size: 9px;
    letter-spacing: 1.5px;
}

/* DOWNLOAD BUTTON */

.download-btn {
    display: block;
    width: 100%;
    padding: 15px 10px;
    border-radius: 12px;
    text-decoration: none;
    color: #071426;
    background: linear-gradient(100deg,#43eaff,#8d9cff);
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.2px;
    opacity: .55;
    pointer-events: none;
    box-shadow: 0 0 18px rgba(0,205,255,.2);
    transition: .3s;
}

.download-btn.ready {
    opacity: 1;
    pointer-events: auto;
}

.download-btn.ready:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 25px rgba(0,210,255,.45);
}

.footer {
    margin-top: 20px;
    color: #718ba3;
    font-size: 8px;
    letter-spacing: 2px;
}

.telegram {
    display: inline-block;
    margin-top: 13px;
    color: #76e4ff;
    font-size: 9px;
    letter-spacing: 1px;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo-box">
        <img src="RudraMovies.png"
             class="logo"
             alt="Rudra Movies">
    </div>

    <div class="brand">RUDRA MOVIES</div>

    <div class="divider"></div>

    <div class="heading">LINK PREPARATION</div>

    <div class="description">
        PLEASE WAIT WHILE WE PREPARE YOUR LINK
    </div>

    <!-- COUNTDOWN -->

    <div class="timer-wrap">

        <svg class="progress-svg" viewBox="0 0 170 170">
            <circle class="progress-bg"
                cx="85" cy="85" r="75"/>

            <circle class="progress-bar"
                id="progress"
                cx="85" cy="85" r="75"/>
        </svg>

        <div class="circle">

            <div class="water" id="water">
                <div class="wave"></div>
                <div class="wave two"></div>
            </div>

            <div class="timer-content">
                <div id="timer">5</div>
                <div class="seconds">SECONDS</div>
            </div>

        </div>
    </div>

    <div class="status" id="status">
        PREPARING YOUR LINK...
    </div>

    <a href="#" class="download-btn" id="downloadBtn">
        PLEASE WAIT...
    </a>

    <div class="footer">
        FAST • SIMPLE • CINEMATIC
    </div>

    <a href="https://t.me/RudraMoviez"
       class="telegram"
       target="_blank"
       rel="noopener noreferrer">
        JOIN OUR TELEGRAM CHANNEL
    </a>

</div>

<script>
const timer = document.getElementById("timer");
const water = document.getElementById("water");
const progress = document.getElementById("progress");
const status = document.getElementById("status");
const button = document.getElementById("downloadBtn");

const params = new URLSearchParams(window.location.search);
const redirect = params.get("redirect");

let safeLink = null;

if (redirect) {
    try {
        const url = new URL(redirect);
        if (url.protocol === "https:") {
            safeLink = url.href;
        }
    } catch (error) {
        safeLink = null;
    }
}

let seconds = 5;
const circumference = 2 * Math.PI * 75;

progress.style.strokeDasharray = circumference;
progress.style.strokeDashoffset = 0;

function countdown() {
    timer.textContent = seconds;

    const completed = (5 - seconds) / 5;

    water.style.height = (completed * 100) + "%";

    progress.style.strokeDashoffset =
        circumference * completed;

    if (seconds > 0) {
        seconds--;
        setTimeout(countdown, 1000);
    } else {
        finish();
    }
}

function finish() {
    timer.textContent = "✓";
    water.style.height = "100%";

    if (safeLink) {
        status.textContent = "YOUR LINK IS READY";
        button.textContent = "DOWNLOAD NOW";
        button.href = safeLink;
        button.classList.add("ready");
    } else {
        status.textContent = "DIRECT LINK NOT FOUND";
        button.textContent = "LINK UNAVAILABLE";
        button.removeAttribute("href");
    }
}

countdown();
</script>

</body>
</html>
