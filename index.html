
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101528">
<title>RUDRA MOVIES | RM DEVELOPER</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --green: #5dffd0;
  --purple: #a879ff;
  --gold: #ffd77a;
  --pink: #ff77bc;
  --text: #f8f7ff;
}

body {
  min-height: 100vh;
  padding: 30px 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, Helvetica, sans-serif;
  color: var(--text);
  background:
    radial-gradient(ellipse at 5% 15%, #087d9250, transparent 38%),
    radial-gradient(ellipse at 95% 80%, #873aff45, transparent 38%),
    linear-gradient(145deg, #0b1222, #171b35 55%, #111021);
}

.card {
  width: 100%;
  max-width: 460px;
  padding: 29px 20px 24px;
  text-align: center;
  border-radius: 31px;
  border: 1px solid #ffffff32;
  background: linear-gradient(
    145deg,
    #ffffff12,
    #5dffd00b,
    #a879ff20
  );
  box-shadow: 0 20px 60px #0008, 0 0 35px #a879ff18;
  backdrop-filter: blur(20px);
  animation: appear .7s ease;
}

.logo {
  width: 88px;
  height: 88px;
  margin: 0 auto 17px;
  border-radius: 50%;
  overflow: hidden;
  display: grid;
  place-items: center;
  border: 2px solid var(--green);
  background: linear-gradient(135deg, #132e40, #633b8e);
  box-shadow: 0 0 22px #5dffd038;
}

.logo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

h1 {
  font-size: 25px;
  font-weight: 800;
  letter-spacing: .7px;
  margin-bottom: 15px;
  color: #fff;
}

.status {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 12px;
  margin-bottom: 27px;
  border: 1px solid #5dffd05c;
  border-radius: 30px;
  background: #5dffd00c;
  color: var(--green);
  font-size: 11px;
  font-weight: bold;
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 10px var(--green);
}

.ring {
  width: 148px;
  height: 148px;
  margin: 0 auto 25px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  position: relative;
  background: conic-gradient(
    var(--green),
    #24a9ff,
    var(--purple),
    var(--pink),
    var(--green)
  );
  box-shadow: 0 0 24px #24a9ff20;
}

.ring::before {
  content: "";
  position: absolute;
  inset: 7px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 25%, #244866, #10172e 72%);
  border: 3px solid #ffffff25;
}

.ring::after {
  content: "";
  position: absolute;
  inset: -7px;
  border-radius: 50%;
  border: 1px dashed #5dffd080;
  animation: rotate 12s linear infinite;
}

#timer {
  position: relative;
  z-index: 1;
  font-size: 45px;
  font-weight: 800;
  text-shadow: 0 0 16px #5dffd050;
}

h2 {
  font-size: 18px;
  letter-spacing: .5px;
  margin-bottom: 8px;
}

.subtitle {
  font-size: 13px;
  line-height: 1.6;
  color: #c8d1e9;
  margin-bottom: 24px;
}

.continue {
  width: 100%;
  min-height: 52px;
  border: 0;
  border-radius: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px 10px;
  background: linear-gradient(100deg, #13c9bb, #288cff, #9662ff);
  color: white;
  font-size: 15px;
  font-weight: bold;
  text-decoration: none;
  box-shadow: 0 7px 22px #288cff30;
  transition: transform .2s;
}

.continue:hover {
  transform: translateY(-2px);
}

.continue:focus-visible,
.channel:focus-visible {
  outline: 2px solid white;
  outline-offset: 4px;
}

.channel {
  display: block;
  padding: 15px 8px;
  margin-top: 12px;
  border-radius: 15px;
  border: 1px solid #a879ff60;
  background: linear-gradient(100deg, #ffffff08, #a879ff20);
  color: var(--gold);
  font-size: 13px;
  font-weight: bold;
  text-decoration: none;
}

.footer {
  margin-top: 23px;
  color: #b5c0dc;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 1.5px;
}

.footer span {
  display: block;
  margin-top: 7px;
  color: var(--gold);
  font-size: 10px;
  letter-spacing: 1px;
}

#continueBtn[hidden] {
  display: none;
}

@keyframes rotate {
  to { transform: rotate(360deg); }
}

@keyframes appear {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 360px) {
  .card { padding: 24px 15px; }
  h1 { font-size: 22px; }
  .ring { width: 132px; height: 132px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>
<main class="card">

  <!-- Place RUDRA MOVIES.png beside index.html -->
  <div class="logo">
    <img src="RudraMovies.png" alt="Rudra Movies Logo">
  </div>

  <h1>RUDRA MOVIES</h1>

  <div class="status">
    <span class="dot"></span>
    LINK COUNTDOWN DEMO
  </div>

  <div class="ring">
    <span id="timer" aria-live="polite">5</span>
  </div>

  <h2 id="heading">YOUR LINK IS GETTING READY</h2>
  <p class="subtitle" id="subtitle">
    Please wait a few seconds before continuing.
  </p>

  <!-- Button appears after the countdown -->
  <a
    id="continueBtn"
    class="continue"
    href="https://example.com/"
    target="_blank"
    rel="noopener noreferrer"
    hidden
  >
    PROCEED TO DESTINATION →
  </a>

  <a
    class="channel"
    href="https://t.me/RudraMovies4"
    target="_blank"
    rel="noopener noreferrer"
  >
    ➤ &nbsp; ⚡ RUDRA MOVIES TELEGRAM ✨
  </a>

  <div class="footer">
    ⚡ RM DEVELOPER
    <span>UNIQUE DESIGN • YOUR BRAND</span>
  </div>

</main>

<script>
(() => {
  const timer = document.getElementById("timer");
  const heading = document.getElementById("heading");
  const subtitle = document.getElementById("subtitle");
  const button = document.getElementById("continueBtn");

  let seconds = 5;

  const countdown = setInterval(() => {
    seconds--;
    timer.textContent = seconds;

    if (seconds <= 0) {
      clearInterval(countdown);
      timer.textContent = "✓";
      heading.textContent = "YOUR LINK IS READY";
      subtitle.textContent = "Tap below to continue.";
      button.hidden = false;
    }
  }, 1000);
})();
</script>

</body>
</html>
