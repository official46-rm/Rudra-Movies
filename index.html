
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090612">
<title>RUDRA MOVIES | DOWNLOAD</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --gold: #f2c66d;
    --gold-light: #fff0bd;
    --purple: #a77aff;
    --bg: #080610;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    padding: 18px 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
    font-family: 'Plus Jakarta Sans', sans-serif;
    background:
        radial-gradient(ellipse at 10% 10%, rgba(116,40,190,.35), transparent 43%),
        radial-gradient(ellipse at 90% 90%, rgba(180,115,45,.22), transparent 43%),
        linear-gradient(145deg,#080610,#171020 55%,#080610);
}

.ambient {
    position: fixed;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    filter: blur(100px);
    opacity: .32;
    pointer-events: none;
}

.ambient.one {
    background: #863ce5;
    top: -100px;
    left: -100px;
}

.ambient.two {
    background: #d99c43;
    bottom: -100px;
    right: -100px;
}

/* MAIN COMPACT CARD */

.card {
    width: 100%;
    max-width: 345px;
    padding: 22px 19px 19px;
    position: relative;
    overflow: hidden;
    text-align: center;
    border-radius: 23px;
    background:
        linear-gradient(145deg,
        rgba(54,37,76,.91),
        rgba(16,12,27,.97) 55%,
        rgba(48,29,37,.92));
    border: 1px solid rgba(255,218,145,.58);
    box-shadow:
        0 0 30px rgba(145,89,220,.17),
        0 0 28px rgba(232,189,105,.10),
        0 22px 55px rgba(0,0,0,.62),
        inset 0 1px 1px rgba(255,255,255,.18);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
}

.card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 7%;
    width: 86%;
    height: 2px;
    background: linear-gradient(
        90deg,
        transparent,
        #fff0bd,
        #a77aff,
        transparent
    );
}

/* CINEMATIC LOGO */

.logo-box {
    width: 75px;
    height: 75px;
    padding: 3px;
    margin: 0 auto 11px;
    position: relative;
    border-radius: 50%;
    background: linear-gradient(
        135deg,
        #fff0bd,
        #d49b43,
        #fff0bd,
        #8d5be5
    );
    box-shadow:
        0 0 0 3px rgba(232,189,105,.12),
        0 0 19px rgba(232,189,105,.45),
        0 0 32px rgba(153,101,255,.20);
}

.logo-box::before {
    content: "";
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    border: 1px solid rgba(255,226,165,.38);
    box-shadow: 0 0 12px rgba(232,189,105,.18);
}

.logo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 50%;
    border: 2px solid #171020;
    background: #fff;
}

.brand {
    font-family: 'Cinzel', serif;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 1.7px;
    background: linear-gradient(
        90deg,
        #fff3cf,
        #e8b957,
        #fff0bd
    );
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 8px rgba(232,189,105,.23));
}

.divider {
    width: 68px;
    height: 3px;
    margin: 12px auto 16px;
    border-radius: 20px;
    background: linear-gradient(90deg,var(--gold),var(--purple));
    box-shadow: 0 0 13px rgba(232,189,105,.45);
}

.heading {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--gold-light);
}

.description {
    margin-top: 6px;
    font-size: 10px;
    letter-spacing: .8px;
    color: #d1c5df;
}

/* VERIFICATION BADGE */

.verified {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin: 13px auto 0;
    padding: 8px 13px;
    border-radius: 30px;
    color: #ffe6a6;
    background: rgba(232,189,105,.09);
    border: 1px solid rgba(232,189,105,.42);
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .6px;
}

.verified-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #48e3a3;
    box-shadow: 0 0 9px #48e3a3;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    50% { box-shadow: 0 0 13px #48e3a3; }
}

/* SMALLER COUNTDOWN AREA */

.timer-wrap {
    width: 158px;
    height: 158px;
    margin: 23px auto 17px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* OUTER RINGS */

.orbit {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
}

.orbit-one {
    inset: 0;
    border: 1.5px dashed rgba(255,218,130,.78);
    animation: spin 12s linear infinite;
}

.orbit-two {
    inset: 7px;
    border: 2px solid transparent;
    border-top-color: #b68aff;
    border-bottom-color: #f1c46c;
    animation: reverseSpin 5s linear infinite;
}

.orbit-three {
    inset: 13px;
    border: 1px solid rgba(255,255,255,.14);
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

@keyframes reverseSpin {
    to { transform: rotate(-360deg); }
}

/* 3D GLASS SPHERE */

.sphere {
    width: 119px;
    height: 119px;
    position: relative;
    overflow: hidden;
    isolation: isolate;
    border-radius: 50%;
    background:
        radial-gradient(
            circle at 30% 18%,
            rgba(255,255,255,.10),
            rgba(255,255,255,.025) 48%,
            rgba(8,5,18,.14)
        );
    border: 2px solid rgba(255,255,255,.77);
    box-shadow:
        0 0 0 2px rgba(255,255,255,.07),
        0 0 22px rgba(164,116,255,.23),
        inset 0 0 13px rgba(255,255,255,.20),
        inset 0 -8px 23px rgba(255,255,255,.08);
}

/* OUTER GLASS EDGE */

.sphere::before {
    content: "";
    position: absolute;
    z-index: 5;
    inset: 2px;
    border-radius: 50%;
    border-top: 2px solid rgba(255,255,255,.78);
    border-left: 1px solid rgba(255,255,255,.32);
    pointer-events: none;
}

.sphere::after {
    content: "";
    position: absolute;
    z-index: 5;
    top: 10px;
    left: 18px;
    width: 33px;
    height: 8px;
    border-radius: 50%;
    transform: rotate(-35deg);
    background: rgba(255,255,255,.40);
    filter: blur(3px);
    pointer-events: none;
}

/* LIQUID */

.liquid {
    position: absolute;
    z-index: 1;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 0%;
    background: linear-gradient(
        180deg,
        #cbb1ff 0%,
        #a178f2 23%,
        #8553df 62%,
        #5832ad 100%
    );
    transition: height 5s linear;
}

/* WATER SURFACE */

.wave {
    position: absolute;
    top: -10px;
    left: -50%;
    width: 200%;
    height: 22px;
    border-radius: 44%;
    background: rgba(241,229,255,.88);
    animation: waveMove 2.5s ease-in-out infinite alternate;
}

.wave-back {
    position: absolute;
    top: -8px;
    left: -45%;
    width: 200%;
    height: 18px;
    border-radius: 44%;
    background: rgba(197,170,255,.48);
    animation: waveMoveBack 3.4s ease-in-out infinite alternate;
}

@keyframes waveMove {
    0% {
        transform: translateY(4px) rotate(-4deg) scaleY(.9);
    }
    50% {
        transform: translateY(-4px) rotate(3deg) scaleY(1.1);
    }
    100% {
        transform: translateY(3px) rotate(-3deg) scaleY(.94);
    }
}

@keyframes waveMoveBack {
    0% { transform: translateY(-2px) rotate(3deg); }
    100% { transform: translateY(3px) rotate(-4deg); }
}

/* COUNTDOWN */

.timer-content {
    position: absolute;
    inset: 0;
    z-index: 7;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-shadow: 0 3px 12px rgba(0,0,0,.8);
    pointer-events: none;
}

#countdown {
    font-family: 'Cinzel', serif;
    font-size: 47px;
    font-weight: 800;
    line-height: 1;
    color: #fff;
}

.seconds {
    margin-top: 7px;
    font-size: 8px;
    letter-spacing: 3px;
    color: #fff0c8;
}

/* STATUS */

.status-container {
    text-align: center;
    margin-bottom: 15px;
}

.status-title {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .8px;
    color: #fff0c7;
}

.status-subtext {
    margin-top: 6px;
    font-size: 11px;
    color: #d0c5dc;
}

/* DOWNLOAD BUTTON */

.primary-btn {
    width: 100%;
    min-height: 49px;
    padding: 13px;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    border: 1px solid rgba(255,255,255,.12);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .8px;
    margin-bottom: 11px;
    transition: .3s;
}

.btn-verifying {
    color: #d1c6dc;
    background: rgba(255,255,255,.06);
    cursor: wait;
}

.btn-ready {
    color: #21170b;
    background: linear-gradient(
        100deg,#fff0bd,#e5b451,#fff0bd
    );
    border-color: rgba(255,235,181,.8);
    box-shadow: 0 5px 20px rgba(232,189,105,.35);
    cursor: pointer;
}

.spinner {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,.22);
    border-top-color: var(--gold-light);
    border-radius: 50%;
    animation: spin .8s linear infinite;
}

/* TELEGRAM */

.secondary-btn {
    display: block;
    width: 100%;
    padding: 12px;
    border-radius: 11px;
    background: rgba(147,100,190,.12);
    border: 1px solid rgba(190,150,220,.30);
    color: #fff0ce;
    text-decoration: none;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .6px;
    margin-bottom: 17px;
}

.footer-text {
    color: rgba(255,220,145,.68);
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 1.4px;
}

@media(max-width:360px) {
    .card {
        max-width: 330px;
        padding: 19px 15px 17px;
    }

    .timer-wrap {
        width: 146px;
        height: 146px;
    }

    .sphere {
        width: 110px;
        height: 110px;
    }
}
</style>
</head>

<body>

<div class="ambient one"></div>
<div class="ambient two"></div>

<main class="card">

    <div class="logo-box">
        <img src="/RudraMovies.png"
             class="logo"
             alt="Rudra Movies Logo">
    </div>

    <h1 class="brand">RUDRA MOVIES</h1>
    <div class="divider"></div>

    <div class="heading">SECURITY VERIFICATION</div>
    <div class="description">
        PREPARING YOUR DOWNLOAD LINK...
    </div>

    <div class="verified">
        <span class="verified-dot"></span>
        SECURED &amp; VERIFIED LINK
    </div>

    <div class="timer-wrap">
        <div class="orbit orbit-one"></div>
        <div class="orbit orbit-two"></div>
        <div class="orbit orbit-three"></div>

        <div class="sphere">
            <div class="liquid" id="liquid">
                <div class="wave"></div>
                <div class="wave-back"></div>
            </div>

            <div class="timer-content">
                <div id="countdown">5</div>
                <div class="seconds">SECONDS</div>
            </div>
        </div>
    </div>

    <div class="status-container">
        <div class="status-title">SECURITY VERIFICATION</div>
        <div class="status-subtext" id="status-subtext">
            Preparing your download link...
        </div>
    </div>

    <button
        class="primary-btn btn-verifying"
        id="primary-btn"
        type="button"
        disabled
    >
        <span class="spinner" id="btn-spinner"></span>
        <span id="btn-text">VERIFYING...</span>
    </button>

    <a
        href="https://t.me/RudraMoviez"
        class="secondary-btn"
        target="_blank"
        rel="noopener noreferrer"
    >
        ➤ &nbsp; RUDRA MAIN CHANNEL ✨
    </a>

    <div class="footer-text">
        RUDRA MOVIES SECURITY
    </div>

</main>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const liquid = document.getElementById("liquid");
    const countdownEl = document.getElementById("countdown");
    const statusSubtext = document.getElementById("status-subtext");
    const primaryBtn = document.getElementById("primary-btn");
    const btnText = document.getElementById("btn-text");
    const btnSpinner = document.getElementById("btn-spinner");

    const TOTAL_SECONDS = 5;

    const params = new URLSearchParams(window.location.search);
    const redirectParam = params.get("redirect");
    const token = params.get("token");

    let destination = null;

    // Existing File Store Bot links
    if (redirectParam) {
        try {
            const parsed = new URL(redirectParam);

            if (parsed.protocol === "https:") {
                destination = parsed.href;
            }
        } catch (error) {
            destination = null;
        }
    }

    // Existing token API support
    else if (token) {
        destination = "/api/verify?token=" +
            encodeURIComponent(token);
    }

    let timeLeft = TOTAL_SECONDS;
    let redirectStarted = false;

    function goToDestination() {
        if (!destination || redirectStarted) return;

        redirectStarted = true;
        window.location.replace(destination);
    }

    // Start water filling
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            liquid.style.height = "100%";
        });
    });

    function finishCountdown() {

        countdownEl.textContent = "0";

        if (!destination) {
            statusSubtext.textContent = "Download link unavailable.";
            btnSpinner.style.display = "none";
            btnText.textContent = "LINK NOT FOUND";
            return;
        }

        statusSubtext.textContent = "Redirecting in progress...";

        btnSpinner.style.display = "none";
        btnText.textContent = "DOWNLOAD NOW";

        primaryBtn.classList.remove("btn-verifying");
        primaryBtn.classList.add("btn-ready");
        primaryBtn.disabled = false;

        primaryBtn.addEventListener("click", goToDestination);

        // Automatic redirect after short button preview
        setTimeout(goToDestination, 900);
    }

    const timer = setInterval(() => {

        timeLeft--;
        countdownEl.textContent = timeLeft;

        if (timeLeft === 2) {
            statusSubtext.textContent = "Redirecting in progress...";
        }

        if (timeLeft <= 0) {
            clearInterval(timer);
            finishCountdown();
        }

    }, 1000);

});
</script>

</body>
</html>
