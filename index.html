
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PREPARING YOUR DOWNLOAD LINK...</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background:
        radial-gradient(circle at 50% 35%, #142e49 0%, transparent 42%),
        linear-gradient(145deg, #050b17, #091629 55%, #050914);
    font-family: 'Poppins', sans-serif;
    color: #fff;
    overflow-x: hidden;
}

.card {
    width: 100%;
    max-width: 355px;
    padding: 27px 22px 25px;
    text-align: center;
    position: relative;
    border: 1px solid rgba(66, 220, 255, .25);
    border-radius: 25px;
    background: linear-gradient(
        145deg,
        rgba(17, 37, 59, .97),
        rgba(7, 17, 34, .98)
    );
    box-shadow:
        0 0 35px rgba(0, 190, 255, .10),
        0 20px 60px rgba(0, 0, 0, .45);
}

.logo {
    width: 75px;
    height: 75px;
    object-fit: contain;
    margin-bottom: 9px;
    filter: drop-shadow(0 0 12px rgba(0, 210, 255, .4));
}

.brand {
    font-family: 'Orbitron', sans-serif;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #fff, #4de5ff, #a48aff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.subtitle {
    margin-top: 7px;
    font-size: 9px;
    letter-spacing: 2px;
    color: #83a9c4;
    font-weight: 600;
}

.divider {
    width: 65px;
    height: 2px;
    margin: 18px auto;
    border-radius: 10px;
    background: linear-gradient(90deg, #00d9ff, #8d68ff);
    box-shadow: 0 0 12px #00d9ff;
}

.section-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    color: #d9f8ff;
    margin-bottom: 7px;
}

.description {
    color: #8199b1;
    font-size: 10px;
    letter-spacing: 1px;
    margin-bottom: 23px;
}

/* COUNTDOWN CIRCLE */

.timer-wrap {
    width: 166px;
    height: 166px;
    margin: 0 auto 20px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

.outer-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid rgba(0, 211, 255, .2);
    box-shadow:
        0 0 18px rgba(0, 211, 255, .17),
        inset 0 0 18px rgba(0, 211, 255, .08);
}

.orbit {
    position: absolute;
    inset: -7px;
    border-radius: 50%;
    border: 2px dashed rgba(86, 220, 255, .65);
    animation: rotate 12s linear infinite;
}

@keyframes rotate {
    to { transform: rotate(360deg); }
}

.inner-circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    overflow: hidden;
    position: relative;
    background: #091a2e;
    border: 2px solid rgba(75, 221, 255, .65);
    box-shadow:
        0 0 22px rgba(0, 204, 255, .28),
        inset 0 0 20px rgba(0, 0, 0, .7);
}

.water {
    position: absolute;
    left: -50%;
    bottom: 0;
    width: 200%;
    height: 0%;
    background: linear-gradient(
        180deg,
        rgba(105, 236, 255, .85),
        #087bca 60%,
        #1746a6
    );
    transition: height 1s linear;
    box-shadow: 0 -5px 18px rgba(0, 220, 255, .5);
}

.wave {
    position: absolute;
    width: 200%;
    height: 22px;
    top: -13px;
    left: 0;
    border-radius: 40%;
    background: rgba(103, 234, 255, .85);
    animation: wave 4s linear infinite;
}

.wave.two {
    top: -9px;
    left: -50%;
    opacity: .45;
    animation-duration: 6s;
}

@keyframes wave {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.timer-content {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-shadow: 0 2px 8px #00101d;
}

#timer {
    font-family: 'Orbitron', sans-serif;
    font-size: 43px;
    font-weight: 800;
    color: #fff;
}

.seconds {
    font-size: 9px;
    letter-spacing: 3px;
    color: #d4f7ff;
    margin-top: 2px;
}

.status {
    display: inline-block;
    padding: 7px 15px;
    border-radius: 30px;
    border: 1px solid rgba(0, 220, 255, .3);
    background: rgba(0, 190, 255, .08);
    color: #70eaff;
    font-size: 9px;
    letter-spacing: 1.5px;
    margin-bottom: 19px;
}

.action-btn {
    display: block;
    width: 100%;
    padding: 14px 10px;
    border: none;
    border-radius: 12px;
    text-decoration: none;
    color: #03101c;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.5px;
    background: linear-gradient(100deg, #51eaff, #8a9aff);
    box-shadow: 0 0 20px rgba(0, 210, 255, .23);
    transition: .3s;
    opacity: .55;
    pointer-events: none;
}

.action-btn.ready {
    opacity: 1;
    pointer-events: auto;
}

.action-btn.ready:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 28px rgba(0, 210, 255, .5);
}

.footer {
    margin-top: 19px;
    color: #627e98;
    font-size: 8px;
    letter-spacing: 1.5px;
}

.telegram {
    display: inline-block;
    margin-top: 12px;
    color: #69dfff;
    font-size: 9px;
    letter-spacing: 1px;
    text-decoration: none;
}

</style>
</head>

<body>

<div class="card">

    <!-- BRAND LOGO -->
    <img src="RudraMovies.png" class="logo" alt="Rudra Movies Logo">

    <div class="brand">RUDRA MOVIES</div>

    <div class="subtitle">YOUR CINEMATIC DESTINATION</div>

    <div class="divider"></div>

    <div class="section-title">LINK PREPARATION</div>

    <div class="description">
        PLEASE WAIT WHILE WE PREPARE YOUR LINK
    </div>

    <!-- COUNTDOWN -->
    <div class="timer-wrap">

        <div class="outer-ring"></div>
        <div class="orbit"></div>

        <div class="inner-circle">

            <div class="water" id="water">
                <div class="wave"></div>
                <div class="wave two"></div>
            </div>

            <div class="timer-content">
                <div id="timer">5</div>
                <div class="seconds">SECONDS</div>
            </div>

        </div>
    </div>

    <div class="status" id="status">
        PREPARING YOUR LINK...
    </div>

    <a href="#" id="actionBtn" class="action-btn">
        PLEASE WAIT...
    </a>

    <div class="footer">
        FAST • SIMPLE • CINEMATIC
    </div>

    <a class="telegram"
       href="https://t.me/RudraMoviez"
       target="_blank"
       rel="noopener noreferrer">
       JOIN OUR TELEGRAM CHANNEL
    </a>

</div>

<script>

const timerElement = document.getElementById("timer");
const water = document.getElementById("water");
const status = document.getElementById("status");
const actionBtn = document.getElementById("actionBtn");

const params = new URLSearchParams(window.location.search);
const redirectValue = params.get("redirect");

let targetRedirect = null;

if (redirectValue) {
    try {
        const parsed = new URL(redirectValue);

        if (parsed.protocol === "https:") {
            targetRedirect = parsed.href;
        }
    } catch (error) {
        targetRedirect = null;
    }
}

let currentSeconds = 5;

function updateTimer() {

    timerElement.innerText = currentSeconds;

    const progress = ((5 - currentSeconds) / 5) * 100;
    water.style.height = progress + "%";

    if (currentSeconds > 0) {
        currentSeconds--;
        setTimeout(updateTimer, 1000);
    } else {
        finishPreparation();
    }
}

function finishPreparation() {

    timerElement.innerText = "✓";
    water.style.height = "100%";

    if (targetRedirect) {

        status.innerText = "YOUR LINK IS READY";

        actionBtn.innerText = "DOWNLOAD NOW";
        actionBtn.href = targetRedirect;
        actionBtn.classList.add("ready");

    } else {

        status.innerText = "DIRECT LINK NOT FOUND";

        actionBtn.innerText = "LINK UNAVAILABLE";
        actionBtn.removeAttribute("href");
    }
}

updateTimer();

</script>

</body>
</html>
