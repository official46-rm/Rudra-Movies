
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10152b">

<title>PREPARING YOUR DOWNLOAD LINK...</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:18px;
 overflow:hidden;
 font-family:Arial,sans-serif;
 font-variant-caps:all-small-caps;
 color:white;
 background:
 radial-gradient(circle at 5% 15%,#008fc5 0%,transparent 35%),
 radial-gradient(circle at 95% 85%,#8528e9 0%,transparent 38%),
 linear-gradient(145deg,#101b32,#191a36,#101326);
}

/* BACKGROUND GLOW */

body:before,body:after{
 content:"";
 position:fixed;
 width:230px;
 height:230px;
 border-radius:50%;
 filter:blur(100px);
 opacity:.35;
 pointer-events:none;
}

body:before{
 background:#00c8ff;
 top:0;left:-100px;
}

body:after{
 background:#a52dff;
 bottom:0;right:-100px;
}

/* CARD */

.card{
 width:100%;
 max-width:350px;
 padding:24px 19px;
 text-align:center;
 position:relative;
 z-index:2;
 border-radius:30px;
 background:linear-gradient(
  145deg,
  rgba(18,130,195,.36),
  rgba(24,31,61,.85),
  rgba(117,35,163,.35)
 );
 border:1px solid #b6dfff75;
 backdrop-filter:blur(24px);
 -webkit-backdrop-filter:blur(24px);
 box-shadow:
 0 20px 55px #0008,
 inset 0 0 25px #ffffff10,
 0 0 25px #469aff25;
}

/* LOGO */

.logo-wrapper{
 display:flex;
 justify-content:center;
 margin-bottom:13px;
}

.logo-img{
 width:78px;
 height:78px;
 border-radius:50%;
 object-fit:cover;
 background:#101b32;
 border:3px solid #80ddff;
 box-shadow:
 0 0 12px #00cfff90,
 0 0 25px #478cff70;
}

.brand-title{
 font-size:25px;
 font-weight:900;
 letter-spacing:2px;
 color:#f5f8ff;
 text-shadow:0 2px 12px #0008;
}

/* SMALL TOP TEXT */

.top-caption{
 font-size:11px;
 letter-spacing:2px;
 color:#9bc9e9;
 margin-top:6px;
}

/* BADGE */

.security-badge{
 display:inline-flex;
 align-items:center;
 gap:8px;
 margin-top:13px;
 padding:8px 15px;
 border-radius:30px;
 background:#14b9ff18;
 border:1px solid #42caff70;
 color:#71d8ff;
 font-size:13px;
}

.security-badge span{
 width:8px;
 height:8px;
 border-radius:50%;
 background:#32e9b4;
 box-shadow:0 0 10px #32e9b4;
}

/* ROUND COUNTDOWN */

.timer-container{
 width:170px;
 height:170px;
 margin:28px auto;
 position:relative;
 display:flex;
 justify-content:center;
 align-items:center;
}

/* DOTTED RING */

.outer-ring{
 position:absolute;
 inset:0;
 border-radius:50%;
 border:2px dashed #50cfff85;
 animation:rotate 16s linear infinite;
}

.second-ring{
 position:absolute;
 inset:8px;
 border-radius:50%;
 border:3px solid #4caaff;
 border-left-color:transparent;
 border-bottom-color:#ad55ff;
 animation:reverse 5s linear infinite;
}

@keyframes rotate{
 to{transform:rotate(360deg)}
}

@keyframes reverse{
 to{transform:rotate(-360deg)}
}

/* LIQUID CIRCLE */

.inner-circle{
 position:absolute;
 width:138px;
 height:138px;
 border-radius:50%;
 overflow:hidden;
 background:linear-gradient(145deg,#172d4c,#111c39);
 border:5px solid #76d9ff;
 box-shadow:
 inset 0 0 20px #0009,
 0 0 0 5px #348cff25,
 0 0 25px #20baff70;
}

.water{
 position:absolute;
 bottom:0;
 left:0;
 width:100%;
 height:0%;
 background:linear-gradient(
  180deg,#39dfff,#1198ec,#5347e5
 );
 transition:height 1s ease;
}

.water:before{
 content:"";
 position:absolute;
 top:-12px;
 left:-50%;
 width:200%;
 height:24px;
 border-radius:50%;
 background:#e6ffffa0;
 animation:wave 3s linear infinite;
}

.water:after{
 content:"";
 position:absolute;
 top:20px;
 left:25%;
 width:10px;
 height:10px;
 border-radius:50%;
 background:#ffffffa0;
 box-shadow:30px 20px 0 #ffffff70,
 65px 8px 0 #ffffff50;
 animation:rise 2s infinite;
}

@keyframes wave{
 to{transform:rotate(360deg)}
}

@keyframes rise{
 0%,100%{transform:translateY(8px);opacity:.3}
 50%{transform:translateY(-12px);opacity:1}
}

/* PROGRESS RING */

.progress-svg{
 position:absolute;
 width:170px;
 height:170px;
 transform:rotate(-90deg);
 z-index:3;
 pointer-events:none;
}

.progress-svg circle{
 fill:none;
 cx:85;
 cy:85;
 r:81;
 stroke-width:4;
}

.progress-bg{stroke:#ffffff25}

.progress-bar{
 stroke:#68eaff;
 stroke-linecap:round;
 stroke-dasharray:508.94;
 stroke-dashoffset:508.94;
 transition:stroke-dashoffset 1s linear;
 filter:drop-shadow(0 0 4px #36dfff);
}

/* NUMBER */

.timer-number{
 position:absolute;
 inset:0;
 display:flex;
 justify-content:center;
 align-items:center;
 z-index:4;
 font-size:53px;
 font-weight:900;
 color:white;
 text-shadow:0 3px 15px #001b45;
}

/* STATUS */

.status-title{
 font-size:19px;
 font-weight:900;
 color:#f4f7ff;
}

.status-message{
 margin:8px 0 20px;
 font-size:16px;
 color:#c2d3e8;
}

/* BUTTONS */

.btn{
 width:100%;
 min-height:52px;
 display:flex;
 justify-content:center;
 align-items:center;
 margin-top:12px;
 border-radius:18px;
 text-decoration:none;
 font-size:17px;
 font-weight:bold;
 transition:.3s;
}

.btn-disabled{
 background:linear-gradient(110deg,#137eae,#4054b9);
 color:#dceaff;
 opacity:.8;
 pointer-events:none;
}

.btn-ready{
 background:linear-gradient(110deg,#087fce,#287df4,#8144e8);
 color:white;
 box-shadow:0 6px 23px #338dff70;
}

.btn-telegram{
 background:linear-gradient(110deg,#ffffff12,#9e4bdc35);
 border:1px solid #c2ddff70;
 color:white;
}

.btn:active{transform:scale(.96)}

.footer{
 margin-top:19px;
 color:#a7c0dc;
 font-size:13px;
 letter-spacing:1.5px;
}
</style>
</head>

<body>

<div class="card">

 <!-- ORIGINAL LOGO -->

 <div class="logo-wrapper">
  <img
   src="RudraMovies.png"
   alt="Rudra Movies"
   class="logo-img"
   onerror="this.outerHTML='<div class=&quot;logo-img&quot; style=&quot;display:grid;place-items:center;font-weight:bold;font-size:24px&quot;>RM</div>'"
  >
 </div>

 <!-- BRAND TITLE -->

 <div class="brand-title">RUDRA MOVIES</div>

 <div class="top-caption">
  PREPARING YOUR DOWNLOAD LINK
 </div>

 <div class="security-badge">
  <span></span>
  LINK PREPARATION
 </div>

 <!-- COUNTDOWN -->

 <div class="timer-container">

  <div class="outer-ring"></div>
  <div class="second-ring"></div>

  <div class="inner-circle">
   <div class="water" id="water"></div>
  </div>

  <svg class="progress-svg" viewBox="0 0 170 170">
   <circle class="progress-bg"
    cx="85" cy="85" r="81"/>

   <circle class="progress-bar"
    id="progress-bar"
    cx="85" cy="85" r="81"/>
  </svg>

  <div class="timer-number" id="timer">5</div>

 </div>

 <div class="status-title">
  DOWNLOAD STATUS
 </div>

 <div class="status-message" id="status-msg">
  PREPARING YOUR LINK...
 </div>

 <!-- REDIRECT -->

 <a id="action-btn"
    class="btn btn-disabled"
    href="#">
  PLEASE WAIT...
 </a>

 <!-- TELEGRAM -->

 <a href="https://t.me/RudraMoviez"
    target="_blank"
    rel="noopener noreferrer"
    class="btn btn-telegram">
  ➤ ⚡ JOIN OFFICIAL CHANNEL ✨
 </a>

 <div class="footer">
  ⚡ RUDRA MOVIES EXPERIENCE
 </div>

</div>

<script>

const params = new URLSearchParams(location.search);
const rawRedirect = params.get("redirect");

let targetRedirect = null;

try{
 if(rawRedirect){
  const parsed = new URL(rawRedirect);

  if(parsed.protocol === "https:"){
   targetRedirect = parsed.href;
  }
 }
}catch(e){}

const totalSeconds = 5;
let seconds = totalSeconds;

const timer = document.getElementById("timer");
const water = document.getElementById("water");
const status = document.getElementById("status-msg");
const button = document.getElementById("action-btn");
const progress = document.getElementById("progress-bar");

const circumference = 2 * Math.PI * 81;

progress.style.strokeDasharray = circumference;
progress.style.strokeDashoffset = circumference;

const interval = setInterval(()=>{

 seconds--;

 const percentage =
  (totalSeconds-seconds)/totalSeconds;

 water.style.height = (percentage*85)+"%";

 progress.style.strokeDashoffset =
  circumference-(circumference*percentage);

 if(seconds>0){

  timer.textContent=seconds;
  button.textContent=`PLEASE WAIT (${seconds}s)`;

  if(seconds<=2){
   status.textContent="ALMOST READY...";
  }

 }else{

  clearInterval(interval);

  timer.textContent="✓";
  water.style.height="100%";

  if(targetRedirect){

   status.textContent="YOUR LINK IS READY!";

   button.href=targetRedirect;
   button.textContent="CONTINUE TO DESTINATION ➜";

   button.classList.remove("btn-disabled");
   button.classList.add("btn-ready");

  }else{

   status.textContent="LINK NOT AVAILABLE";
   button.textContent="DIRECT LINK NOT FOUND";

  }
 }

},1000);

</script>

</body>
</html>
