
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#202632">
  <title>ʀᴜᴅʀᴀ ᴍᴏᴠɪᴇꜱ - Security Verification</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        radial-gradient(ellipse at top left, #302900 0%, transparent 48%),
        radial-gradient(ellipse at bottom right, #29220a 0%, transparent 48%),
        #080808;
    }

    .card {
      width: 100%;
      max-width: 650px;
      min-height: 600px;
      padding: 45px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: rgba(17, 17, 17, 0.97);
      border: 1px solid #4b421d;
      border-radius: 52px;
      box-shadow: 0 20px 65px #0009;
    }

    .circle {
      width: 238px;
      height: 238px;
      max-width: 65vw;
      max-height: 65vw;
      border-radius: 50%;
      padding: 13px;
      margin-bottom: 54px;
      background: conic-gradient(
        from 30deg,
        #fff064,
        #e8c900,
        #3b3514,
        #b79b00,
        #ffdf32
      );
      box-shadow: 0 0 20px #f5d51b20;
    }

    .inner-circle {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #302b18;
      border-radius: 50%;
      background: radial-gradient(circle, #191919, #080808);
      box-shadow: inset 0 0 20px #000;
    }

    #count {
      font-size: 72px;
      font-weight: 900;
      color: #ffdf32;
    }

    h1 {
      margin: 0 0 35px;
      color: #ffdf32;
      font-size: clamp(24px, 6vw, 36px);
      font-weight: 900;
      letter-spacing: 3px;
      overflow-wrap: anywhere;
    }

    h2 {
      margin: 0 0 34px;
      font-size: clamp(25px, 6vw, 36px);
      line-height: 1.25;
    }

    #status {
      margin: 0;
      color: #d4b94c;
      font-size: clamp(19px, 5vw, 27px);
      font-weight: 600;
      line-height: 1.5;
    }

    #note {
      margin: 28px 0 0;
      color: #999;
      font-size: 14px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 40px;
      padding: 17px 27px;
      border: 1px solid #62551c;
      border-radius: 50px;
      color: #ffdf32;
      background: #28230f;
      text-decoration: none;
      font-size: 21px;
      font-weight: 800;
      box-shadow: 0 0 18px #0005;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 400px) {
      .card {
        min-height: 530px;
        padding: 35px 16px;
        border-radius: 38px;
      }

      .circle {
        margin-bottom: 42px;
      }

      h1 {
        letter-spacing: 2px;
        margin-bottom: 28px;
      }
    }
  </style>
</head>

<body>
  <main class="card">

    <div class="circle">
      <div class="inner-circle">
        <span id="count">5</span>
      </div>
    </div>

    <h1>ʀᴜᴅʀᴀ ᴍᴏᴠɪᴇꜱ</h1>

    <h2 id="heading">Security Verification</h2>

    <p id="status" aria-live="polite">
      Checking your download link...
    </p>

    <p id="note">
      Please wait while we prepare your download.
    </p>

    <a id="download" class="button hidden" href="#">
      ⚡ ʀᴜᴅʀᴀ ᴍᴏᴠɪᴇꜱ
    </a>

    <a id="back" class="button hidden" href="/">
      Go Back
    </a>

  </main>

  <script>
    const countElement = document.getElementById("count");
    const heading = document.getElementById("heading");
    const status = document.getElementById("status");
    const note = document.getElementById("note");
    const download = document.getElementById("download");
    const back = document.getElementById("back");

    function showError(message) {
      countElement.textContent = "!";
      heading.textContent = "Download Link";
      status.textContent = message;
      note.textContent = "Please open a valid link supplied by your provider.";
      back.classList.remove("hidden");
    }

    function getDestination() {
      const params = new URLSearchParams(location.search);

      // Support both existing parameter names.
      const value = params.get("redirect") || params.get("url");

      if (!value) return null;

      try {
        const destination = new URL(value);

        if (destination.protocol !== "https:") return null;

        const host = destination.hostname.toLowerCase();

        if (
          host !== "arolinks.com" &&
          !host.endsWith(".arolinks.com")
        ) {
          return null;
        }

        return destination.href;
      } catch {
        return null;
      }
    }

    const destination = getDestination();

    if (!destination) {
      showError("A valid Arolinks URL is required.");
    } else {
      let seconds = 5;

      countElement.textContent = seconds;
      status.textContent = "⚡ ʀᴜᴅʀᴀ ᴍᴏᴠɪᴇꜱ";
      note.textContent = "Your download is being prepared.";

      const timer = setInterval(() => {
        seconds--;
        countElement.textContent = seconds;
        note.textContent = "Redirecting in " + seconds + " seconds...";

        if (seconds <= 0) {
          clearInterval(timer);
          heading.textContent = "Redirecting...";
          status.textContent = "⚡ ʀᴜᴅʀᴀ ᴍᴏᴠɪᴇꜱ";
          note.textContent = "Please wait...";

          window.location.replace(destination);
        }
      }, 1000);
    }
  </script>
</body>
</html>
