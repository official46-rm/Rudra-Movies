<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d1d">
<title>RUDRA MOVIES | Link Portal</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 font-family:Arial,sans-serif;
 color:#fff;
 background:
 radial-gradient(ellipse at 10% 15%,#12386a 0,transparent 40%),
 radial-gradient(ellipse at 90% 90%,#461568 0,transparent 40%),
 #060a15;
}

.card{
 width:100%;
 max-width:500px;
 text-align:center;
 padding:35px 24px;
 border:1px solid #16475e;
 border-radius:28px;
 background:linear-gradient(145deg,#151e38,#0b1022);
 box-shadow:0 0 45px #00dfff12;
 position:relative;
 overflow:hidden;
}

.card:before{
 content:"";
 position:absolute;
 top:0;left:0;
 width:100%;height:3px;
 background:linear-gradient(90deg,#00eaff,#8755ff,#ff43c8);
}

.logo{
 width:115px;height:115px;
 object-fit:contain;
 border-radius:50%;
 border:3px solid #00eaff;
 background:#fff;
 padding:5px;
 box-shadow:0 0 25px #00eaff40;
 margin-bottom:22px;
}

h1{
 font-size:clamp(27px,7vw,38px);
 letter-spacing:2px;
 background:linear-gradient(90deg,#a3f7ff,#00dcff,#bb8aff);
 -webkit-background-clip:text;
 background-clip:text;
 color:transparent;
}

.subtitle{
 color:#98a8c6;
 font-size:11px;
 letter-spacing:3px;
 line-height:1.8;
 margin:13px 0 28px;
}

.tag{
 display:inline-block;
 padding:12px 22px;
 border:1px solid #20566d;
 border-radius:30px;
 color:#a0f5ff;
 font-size:12px;
 letter-spacing:2px;
}

.timer{
 --progress:100%;
 width:165px;height:165px;
 border-radius:50%;
 margin:35px auto 26px;
 display:grid;
 place-items:center;
 position:relative;
 background:conic-gradient(#00eaff var(--progress),#29334c 0);
 box-shadow:0 0 28px #00eaff20;
}

.timer:before{
 content:"";
 position:absolute;
 inset:10px;
 border-radius:50%;
 background:#10182d;
}

#count{
 position:relative;
 font-size:58px;
 font-weight:800;
}

.label{
 color:#91a0bd;
 font-size:12px;
 letter-spacing:3px;
}

.status{
 margin:14px 0 27px;
 color:#00eaff;
 font-size:14px;
 font-weight:bold;
}

.wait{
 padding:20px 10px;
 border:1px solid #35415a;
 border-radius:16px;
 background:#1b2438;
 color:#aab6ce;
 font-size:13px;
 font-weight:bold;
}

.button{
 display:block;
 padding:20px 10px;
 margin-top:18px;
 border-radius:15px;
 text-decoration:none;
 color:white;
 font-size:14px;
 font-weight:bold;
 letter-spacing:1px;
 background:linear-gradient(100deg,#6949f5,#b33be9);
 box-shadow:0 8px 28px #8739ed30;
 transition:transform .2s;
}

.button:active{transform:scale(.97)}

.footer{
 margin-top:32px;
 color:#71809b;
 font-size:11px;
 letter-spacing:2px;
}

</style>
</head>

<body>
<main class="card">

<img class="logo" src="RudraMovies.png"
     alt="Rudra Movies Logo">

<h1>RUDRA MOVIES</h1>
<p class="subtitle">YOUR ENTERTAINMENT DESTINATION</p>

<div class="tag">● &nbsp; LINK REDIRECT</div>

<div class="timer" id="timer">
 <span id="count">5</span>
</div>

<div class="label">LINK STATUS</div>
<p class="status" id="status">PREPARING YOUR LINK...</p>

<div class="wait" id="wait">PLEASE WAIT (5s)</div>

<a class="button"
   href="https://t.me/+AYGNnSIln8BkYjNl"
   target="_blank"
   rel="noopener noreferrer">
 ⚡ JOIN OFFICIAL CHANNEL ⚡
</a>

<div class="footer">RUDRA MOVIES · LINK PORTAL</div>

</main>

<script>
const total = 5;
let remaining = total;

const count = document.getElementById("count");
const wait = document.getElementById("wait");
const status = document.getElementById("status");
const timer = document.getElementById("timer");

function tick(){
 count.textContent = remaining;

 timer.style.setProperty(
   "--progress",
   (remaining / total * 100) + "%"
 );

 if(remaining > 0){
   wait.textContent = `PLEASE WAIT (${remaining}s)`;
   remaining--;
   setTimeout(tick, 1000);
 }else{
   status.textContent = "YOUR LINK IS READY";
   wait.textContent = "LINK READY";
 }
}

tick();
</script>

</body>
</html>
