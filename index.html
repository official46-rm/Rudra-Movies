<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ʀᴜᴅʀᴀ ᴍᴏᴠɪᴇs - ᴜʟᴛʀᴀ sᴇᴄᴜʀᴇ ʟɪɴᴋ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #030712;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      padding: 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* ಬ್ಯಾಕ್‌ಗ್ರೌಂಡ್ ನಿಯಾನ್ ಬ್ಲರ್ ಎಫೆಕ್ಟ್ */
    .bg-glow-1 {
      position: absolute;
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.28), transparent 70%);
      top: 10%;
      left: 10%;
      filter: blur(50px);
      z-index: 0;
    }
    .bg-glow-2 {
      position: absolute;
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.25), transparent 70%);
      bottom: 10%;
      right: 10%;
      filter: blur(60px);
      z-index: 0;
    }

    /* ಪ್ರೀಮಿಯಂ ಗ್ಲಾಸ್ ಕಾರ್ಡ್ */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 30px;
      padding: 30px 22px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(6, 182, 212, 0.15);
    }

    /* ರುದ್ರಾ ಲೋಗೋ */
    .logo-wrapper {
      position: relative;
      width: 82px;
      height: 82px;
      margin: 0 auto 12px;
    }
    .logo-wrapper::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: linear-gradient(45deg, #00f2fe, #4facfe, #f093fb, #f5576c);
      animation: spin 6s linear infinite;
      filter: blur(4px);
    }
    .logo-img {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #020617;
      border: 2px solid rgba(255, 255, 255, 0.8);
      display: block;
      z-index: 1;
    }

    .brand-title {
      font-size: 21px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #38bdf8, #e879f9, #38bdf8);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 4s linear infinite;
    }

    .security-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      font-size: 11px;
      font-weight: 700;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 5px 14px;
      border-radius: 30px;
      letter-spacing: 1px;
    }
    .security-badge span {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    /* ಟೆಕ್ ಕೌಂಟ್‌ಡೌನ್ ಏರಿಯಾ */
    .timer-container {
      position: relative;
      width: 180px;
      height: 180px;
      margin: 28px auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 1. ಹೊರಗಿನ ತಿರುಗುವ ಡ್ಯಾಶ್ಡ್ ಸರ್ಕಲ್ */
    .outer-circle {
      position: absolute;
      width: 176px;
      height: 176px;
      border-radius: 50%;
      border: 2px dashed rgba(56, 189, 248, 0.35);
      animation: spin 10s linear infinite;
    }

    /* 2. ಒಳಗಿನ ತಿರುಗುವ ಡಾಟ್ ಸರ್ಕಲ್ */
    .inner-circle {
      position: absolute;
      width: 154px;
      height: 154px;
      border-radius: 50%;
      border: 2px dotted rgba(232, 121, 249, 0.5);
      animation: spinReverse 7s linear infinite;
    }

    /* 3. ತಿರುಗುವ ನಿಯಾನ್ ಆರೋ ಮಾರ್ಕ್ಸ್ (Dual Orbit Arrows) */
    .orbit-arrows {
      position: absolute;
      width: 176px;
      height: 176px;
      animation: spin 3.2s linear infinite;
      pointer-events: none;
    }
    .arrow-top {
      position: absolute;
      top: -8px;
      left: calc(50% - 7px);
      width: 0;
      height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-bottom: 12px solid #00f2fe;
      transform: rotate(90deg);
      filter: drop-shadow(0 0 8px #00f2fe);
    }
    .arrow-bottom {
      position: absolute;
      bottom: -8px;
      left: calc(50% - 7px);
      width: 0;
      height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-bottom: 12px solid #f093fb;
      transform: rotate(-90deg);
      filter: drop-shadow(0 0 8px #f093fb);
    }

    /* SVG ಪ್ರೋಗ್ರೆಸ್ ಸರ್ಕಲ್ */
    .progress-svg {
      width: 130px;
      height: 130px;
      transform: rotate(-90deg);
      z-index: 2;
    }
    .progress-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.05);
      stroke-width: 9;
    }
    .progress-bar {
      fill: none;
      stroke: url(#neonGradient);
      stroke-width: 9;
      stroke-linecap: round;
      stroke-dasharray: 351.85; /* 2 * PI * 56 */
      stroke-dashoffset: 351.85;
      transition: stroke-dashoffset 1s linear;
      filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.7));
    }

    /* ಟೈಮರ್ ಸಂಖ್ಯೆ */
    .timer-number {
      position: absolute;
      font-size: 42px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.9), 0 0 10px rgba(255, 255, 255, 0.6);
      z-index: 3;
    }

    /* ಕೀಫ್ರೇಮ್ಸ್ */
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes shine {
      to { background-position: 200% center; }
    }

    /* ಸ್ಟೇಟಸ್ ಟೆಕ್ಸ್ಟ್ */
    .status-badge {
      font-size: 11px;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 2px;
      font-weight: 600;
    }
    .status-highlight {
      font-size: 13px;
      color: #38bdf8;
      font-weight: 600;
      margin-top: 4px;
      margin-bottom: 24px;
    }

    /* ಬಟನ್‌ಗಳು */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 12px;
      transition: all 0.3s ease;
      letter-spacing: 0.8px;
    }
    .btn-disabled {
      background: rgba(30, 41, 59, 0.7);
      color: #64748b;
      cursor: not-allowed;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .btn-ready {
      background: linear-gradient(135deg, #0284c7, #6366f1);
      color: #fff;
      box-shadow: 0 0 25px rgba(2, 132, 199, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.3);
      animation: btnPulse 1.4s infinite;
      cursor: pointer;
    }
    .btn-telegram {
      background: linear-gradient(135deg, #0284c7 0%, #06b6d4 100%);
      color: #fff;
      box-shadow: 0 5px 20px rgba(6, 182, 212, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .btn-telegram:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(6, 182, 212, 0.5);
    }

    @keyframes btnPulse {
      0% { transform: scale(1); box-shadow: 0 0 20px rgba(2, 132, 199, 0.5); }
      50% { transform: scale(1.02); box-shadow: 0 0 32px rgba(2, 132, 199, 0.9); }
      100% { transform: scale(1); box-shadow: 0 0 20px rgba(2, 132, 199, 0.5); }
    }
  </style>
</head>
<body>

  <!-- ನಿಯಾನ್ ಬ್ಯಾಕ್‌ಗ್ರೌಂಡ್ ಗ್ಲೋ -->
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <div class="card">
    <!-- ನಿಮ್ಮ ರುದ್ರಾ ಲೋಗೋ (GitHub ನಲ್ಲಿರೋ rudra.png) -->
    <div class="logo-wrapper">
      <img src="RudraMovie.png" alt="Rudra Movies Logo" class="logo-img" onerror="this.onerror=null; this.src='https://via.placeholder.com/82/0284c7/ffffff?text=RM';">
    </div>

    <div class="brand-title">ʀᴜᴅʀᴀ ᴍᴏᴠɪᴇs</div>
    <div class="security-badge">
      <span></span> ʜɪɢʜ sᴇᴄᴜʀᴇᴅ ʟɪɴᴋ
    </div>

    <!-- ಸೈಬರ್‌ಪಂಕ್ ಕೌಂಟ್‌ಡೌನ್ ಅನಿಮೇಷನ್ -->
    <div class="timer-container">
      <div class="outer-circle"></div>
      <div class="inner-circle"></div>

      <!-- ವೃತ್ತದ ಸುತ್ತಲೂ ತಿರುಗುವ ನಿಯಾನ್ ಆರೋಗಳು -->
      <div class="orbit-arrows">
        <div class="arrow-top"></div>
        <div class="arrow-bottom"></div>
      </div>

      <!-- ಗ್ರೇಡಿಯಂಟ್ ಸರ್ಕಲ್ ಫಿಲ್ (SVG) -->
      <svg class="progress-svg">
        <defs>
          <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00f2fe" />
            <stop offset="50%" stop-color="#4facfe" />
            <stop offset="100%" stop-color="#f093fb" />
          </linearGradient>
        </defs>
        <circle class="progress-bg" cx="65" cy="65" r="56"></circle>
        <circle class="progress-bar" id="progress-bar" cx="65" cy="65" r="56"></circle>
      </svg>

      <div class="timer-number" id="timer">5</div>
    </div>

    <div class="status-badge">ʟɪɴᴋ sᴛᴀᴛᴜs</div>
    <div class="status-highlight" id="status-msg">Encrypting & Verifying File...</div>

    <!-- ಗೆಟ್ ಲಿಂಕ್ ಬಟನ್ -->
    <a id="action-btn" class="btn btn-disabled" href="#">ᴡᴀɪᴛ 5 sᴇᴄᴏɴᴅs...</a>

    <!-- ಟೆಲಿಗ್ರಾಂ ಚಾನೆಲ್ ಬಟನ್ -->
    <a href="https://t.me/RudraMovies" target="_blank" class="btn btn-telegram">
      ⚡ ᴊᴏɪɴ ᴏғғɪᴄɪᴀʟ ᴄʜᴀɴɴᴇʟ ⚡
    </a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetRedirect = urlParams.get('redirect');

    const totalSeconds = 5;
    let currentSeconds = totalSeconds;

    const timerText = document.getElementById('timer');
    const statusMsg = document.getElementById('status-msg');
    const actionBtn = document.getElementById('action-btn');
    const progressBar = document.getElementById('progress-bar');

    const totalLength = 2 * Math.PI * 56; // 351.85

    const interval = setInterval(() => {
      currentSeconds--;

      // ಕೌಂಟ್‌ಡೌನ್ ಆದಂತೆ ಸರ್ಕಲ್ ಪೂರ್ತಿ ತುಂಬಿಕೊಳ್ಳುವುದು
      const percentage = (totalSeconds - currentSeconds) / totalSeconds;
      progressBar.style.strokeDashoffset = totalLength - (totalLength * percentage);

      if (currentSeconds > 0) {
        timerText.innerText = currentSeconds;
        actionBtn.innerText = `WAIT ${currentSeconds} SECONDS...`;
        if (currentSeconds <= 2) {
          statusMsg.innerText = "ᴀʟᴍᴏsᴛ ʀᴇᴀᴅʏ... ɢᴇɴᴇʀᴀᴛɪɴɢ ᴅᴏᴡɴʟᴏᴀᴅ ʟɪɴᴋ";
        }
      } else {
        clearInterval(interval);
        timerText.innerText = "✓";
        progressBar.style.strokeDashoffset = 0;
        statusMsg.innerText = "ᴠᴇʀɪғɪᴄᴀᴛɪᴏɴ ᴄᴏᴍᴘʟᴇᴛᴇ! ʟɪɴᴋ ʀᴇᴀᴅʏ ";

        if (targetRedirect) {
          actionBtn.href = targetRedirect;
          actionBtn.innerText = "ᴅᴏᴡɴʟᴏᴀᴅ ɴᴏᴡ ➜";
          actionBtn.classList.remove('btn-disabled');
          actionBtn.classList.add('btn-ready');

          // ಆಟೋಮ್ಯಾಟಿಕ್ ಆಗಿ ರೀಡೈರೆಕ್ಟ್ ಆಗಬೇಕಿದ್ದರೆ ಕೆಳಗಿನ ಲೈನ್ ಅನ್‌ಕಮೆಂಟ್ ಮಾಡಿ:
          // setTimeout(() => { window.location.href = targetRedirect; }, 600);
        } else {
          actionBtn.innerText = "DIRECT LINK NOT FOUND";
        }
      }
    }, 1000);
  </script>
</body>
</html>
