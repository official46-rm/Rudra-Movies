
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090612">
<title>RUDRA MOVIES | DOWNLOAD</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --gold: #e8bd69;
    --gold-light: #ffe9b2;
    --purple: #9560e8;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    padding: 24px 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    color: #fff;
    font-family: 'Plus Jakarta Sans', sans-serif;
    background:
        radial-gradient(ellipse at 10% 15%, rgba(115,48,180,.25), transparent 42%),
        radial-gradient(ellipse at 90% 85%, rgba(174,111,48,.17), transparent 42%),
        linear-gradient(145deg,#090612,#171020 55%,#080610);
}

.ambient {
    position: fixed;
    width: 240px;
    height: 240px;
    border-radius: 50%;
    filter: blur(105px);
    opacity: .28;
    pointer-events: none;
}

.ambient.one {
    background: #873ce5;
    top: -110px;
    left: -110px;
}

.ambient.two {
    background: #c18a3e;
    bottom: -110px;
    right: -110px;
}

/* MAIN CARD */

.card {
    width: 100%;
    max-width: 390px;
    position: relative;
    z-index: 1;
    overflow: hidden;
    padding: 29px 23px 24px;
    text-align: center;
    border-radius: 27px;
    background:
        linear-gradient(145deg,
        rgba(55,39,75,.78),
        rgba(15,12,25,.94) 55%,
        rgba(53,35,36,.78));
    border: 1px solid rgba(232,189,105,.42);
    box-shadow:
        0 0 35px rgba(145,89,220,.13),
        0 0 35px rgba(232,189,105,.10),
        0 25px 75px rgba(0,0,0,.65),
        inset 0 1px 1px rgba(255,255,255,.15);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
}

.card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 8%;
    width: 84%;
    height: 2px;
    background: linear-gradient(
        90deg, transparent, var(--gold-light),
        var(--purple), transparent
    );
}

/* BRAND */

.logo-box {
    width: 86px;
    height: 86px;
    padding: 3px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: #100d18;
    border: 2px solid var(--gold);
    box-shadow: 0 0 24px rgba(232,189,105,.3);
    overflow: hidden;
}

.logo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
}

.brand {
    font-family: 'Cinzel', serif;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(
        90deg,#fff0c4,#dba94e,#fff1c7
    );
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.divider {
    width: 82px;
    height: 3px;
    margin: 15px auto 20px;
    border-radius: 20px;
    background: linear-gradient(90deg,var(--gold),var(--purple));
    box-shadow: 0 0 14px rgba(232,189,105,.35);
}

.heading {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1.2px;
    color: var(--gold-light);
}

.description {
    margin-top: 8px;
    color: #c0b7cb;
    font-size: 11px;
    letter-spacing: 1px;
}

/* VERIFIED BADGE */

.verified {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    margin: 17px auto 0;
    padding: 9px 15px;
    border-radius: 30px;
    color: #e8ce91;
    background: rgba(211,166,87,.08);
    border: 1px solid rgba(232,189,105,.32);
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .8px;
}

.verified-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #48e3a3;
    box-shadow: 0 0 10px #48e3a3;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%,100% { box-shadow: 0 0 4px #48e3a3; }
    50% { box-shadow: 0 0 12px #48e3a3; }
}

/* COUNTDOWN AREA */

.timer-wrap {
    width: 190px;
    height: 190px;
    margin: 27px auto 22px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* OUTER ROTATING RINGS */

.orbit {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
}

.orbit-one {
    inset: 0;
    border: 2px dashed rgba(232,189,105,.58);
    animation: orbitSpin 12s linear infinite;
}

.orbit-two {
    inset: 9px;
    border: 2px solid transparent;
    border-top-color: rgba(157,104,239,.95);
    border-bottom-color: rgba(232,189,105,.75);
    animation: orbitReverse 5s linear infinite;
}

.orbit-three {
    inset: 17px;
    border: 1px solid rgba(255,255,255,.12);
}

@keyframes orbitSpin {
    to { transform: rotate(360deg); }
}

@keyframes orbitReverse {
    to { transform: rotate(-360deg); }
}

/* TRANSPARENT GLASS SPHERE */

.sphere {
    width: 146px;
    height: 146px;
    position: relative;
    overflow: hidden;
    isolation: isolate;
    border-radius: 50%;
    background: rgba(255,255,255,.025);
    border: 2px solid rgba(255,255,255,.66);

    box-shadow:
        0 0 0 2px rgba(255,255,255,.06),
        0 0 25px rgba(159,110,255,.18),
        inset 0 0 18px rgba(255,255,255,.15),
        inset 0 0 35px rgba(255,255,255,.055);
}

/* NATURAL OUTER GLASS REFLECTION */

.sphere::before {
    content: "";
    position: absolute;
    inset: 2px;
    z-index: 5;
    border-radius: 50%;
    border-top: 2px solid rgba(255,255,255,.75);
    border-left: 1px solid rgba(255,255,255,.3);
    pointer-events: none;
}

.sphere::after {
    content: "";
    position: absolute;
    z-index: 5;
    top: 12px;
    left: 23px;
    width: 37px;
    height: 9px;
    border-radius: 50%;
    transform: rotate(-35deg);
    background: rgba(255,255,255,.32);
    filter: blur(3px);
    pointer-events: none;
}

/* PURPLE LIQUID */

.liquid {
    position: absolute;
    z-index: 1;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 0%;
    overflow: visible;
    background: linear-gradient(
        180deg,
        rgba(191,163,255,.90) 0%,
        rgba(137,100,235,.94) 35%,
        rgba(91,61,187,.97) 100%
    );
    transition: height 5s linear;
}

/* MOVING WATER SURFACE */

.wave {
    position: absolute;
    left: -50%;
    top: -12px;
    width: 200%;
    height: 25px;
    border-radius: 43%;
    background: rgba(222,208,255,.78);
    animation: waterWave 2.8s ease-in-out infinite alternate;
    transform-origin: center;
}

.wave-back {
    position: absolute;
    top: -9px;
    left: -45%;
    width: 200%;
    height: 20px;
    border-radius: 43%;
    background: rgba(183,153,255,.36);
    animation: waterWaveBack 3.7s ease-in-out infinite alternate;
}

@keyframes waterWave {
    0% {
        transform: translateY(4px) rotate(-4deg) scaleY(.92);
    }
    50% {
        transform: translateY(-4px) rotate(3deg) scaleY(1.08);
    }
    100% {
        transform: translateY(3px) rotate(-2deg) scaleY(.95);
    }
}

@keyframes waterWaveBack {
    0% {
        transform: translateY(-2px) rotate(3deg);
    }
    100% {
        transform: translateY(3px) rotate(-4deg);
    }
}

/* COUNTDOWN TEXT */

.timer-content {
    position: absolute;
    inset: 0;
    z-index: 7;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-shadow: 0 3px 12px rgba(0,0,0,.75);
    pointer-events: none;
}

#countdown {
    font-family: 'Cinzel', serif;
    font-size: 54px;
    font-weight: 800;
    line-height: 1;
    color: #fff;
    transition: transform .2s ease;
}

#countdown.tick {
    transform: scale(1.12);
}

.seconds {
    margin-top: 8px;
    font-size: 9px;
    letter-spacing: 4px;
    color: #fff0ca;
}

/* STATUS */

.status-container {
    text-align: center;
    margin-bottom: 20px;
}

.status-title {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #fff0c7;
}

.status-subtext {
    margin-top: 7px;
    font-size: 12px;
    color: #c0b7cb;
}

/* DOWNLOAD BUTTON */

.primary-btn {
    width: 100%;
    min-height: 55px;
    padding: 15px;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border: 1px solid rgba(255,255,255,.12);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1px;
    transition: all .3s ease;
    margin-bottom: 13px;
}

.btn-verifying {
    color: #c6bccc;
    background: rgba(255,255,255,.045);
    cursor: wait;
}

.btn-ready {
    color: #21170b;
    background: linear-gradient(
        100deg,#ffe8ad,#d8a34b,#f5d28b
    );
    border-color: rgba(255,235,181,.7);
    box-shadow: 0 5px 22px rgba(232,189,105,.32);
    cursor: pointer;
}

.btn-ready:active {
    transform: scale(.98);
}

.spinner {
    width: 17px;
    height: 17px;
    border: 2px solid rgba(255,255,255,.2);
    border-top-color: var(--gold-light);
    border-radius: 50%;
    animation: spin .8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* TELEGRAM BUTTON */

.secondary-btn {
    display: block;
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    background: rgba(147,100,190,.10);
    border: 1px solid rgba(190,150,220,.25);
    color: #f6e7c5;
    text-decoration: none;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .7px;
    transition: .3s;
    margin-bottom: 22px;
}

.secondary-btn:active {
    background: rgba(147,100,190,.2);
}

.footer-text {
    color: rgba(232,189,105,.58);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.5px;
}

@media(max-width:380px) {
    .card {
        padding: 23px 17px 20px;
    }

    .timer-wrap {
        width: 175px;
        height: 175px;
    }

    .sphere {
        width: 136px;
        height: 136px;
    }
}

@media(prefers-reduced-motion: reduce) {
    .orbit-one,
    .orbit-two,
    .wave,
    .wave-back,
    .verified-dot,
    .spinner {
        animation-duration: 10s;
    }
}
</style>
</head>

<body>

<div class="ambient one"></div>
<div class="ambient two"></div>

<main class="card">

    <div class="logo-box">
        <img src="/RudraMovies.png"
             class="logo"
             alt="Rudra Movies Logo">
    </div>

    <h1 class="brand">RUDRA MOVIES</h1>
    <div class="divider"></div>

    <div class="heading">SECURITY VERIFICATION</div>
    <div class="description">
        PREPARING YOUR DOWNLOAD LINK...
    </div>

    <div class="verified">
        <span class="verified-dot"></span>
        SECURED &amp; VERIFIED LINK
    </div>

    <!-- GLASS LIQUID COUNTDOWN -->

    <div class="timer-wrap">

        <div class="orbit orbit-one"></div>
        <div class="orbit orbit-two"></div>
        <div class="orbit orbit-three"></div>

        <div class="sphere">

            <div class="liquid" id="liquid">
                <div class="wave"></div>
                <div class="wave-back"></div>
            </div>

            <div class="timer-content">
                <div id="countdown">5</div>
                <div class="seconds">SECONDS</div>
            </div>

        </div>
    </div>

    <!-- STATUS -->

    <div class="status-container">
        <div class="status-title">SECURITY VERIFICATION</div>
        <div class="status-subtext" id="status-subtext">
            Preparing your download link...
        </div>
    </div>

    <!-- DOWNLOAD BUTTON -->

    <button
        class="primary-btn btn-verifying"
        id="primary-btn"
        type="button"
        disabled
    >
        <span class="spinner" id="btn-spinner"></span>
        <span id="btn-text">VERIFYING...</span>
    </button>

    <a
        href="https://t.me/RudraMoviez"
        class="secondary-btn"
        target="_blank"
        rel="noopener noreferrer"
    >
        ➤ &nbsp; RUDRA MAIN CHANNEL ✨
    </a>

    <div class="footer-text">
        RUDRA MOVIES SECURITY
    </div>

</main>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const liquid = document.getElementById("liquid");
    const countdownEl = document.getElementById("countdown");
    const statusSubtext = document.getElementById("status-subtext");
    const primaryBtn = document.getElementById("primary-btn");
    const btnText = document.getElementById("btn-text");
    const btnSpinner = document.getElementById("btn-spinner");

    const TOTAL_SECONDS = 5;

    const params = new URLSearchParams(window.location.search);
    const redirectParam = params.get("redirect");
    const token = params.get("token");

    let destination = null;

    /*
      EXISTING BOT LINKS:
      ?redirect=https%3A%2F%2F...
    */

    if (redirectParam) {
        try {
            const parsed = new URL(redirectParam);

            if (parsed.protocol === "https:") {
                destination = parsed.href;
            }
        } catch (error) {
            destination = null;
        }
    }

    /*
      TOKEN LINKS:
      Existing API endpoint support.
    */

    else if (token) {
        destination = "/api/verify?token=" +
            encodeURIComponent(token);
    }

    let timeLeft = TOTAL_SECONDS;
    let redirectStarted = false;

    function goToDestination() {
        if (!destination || redirectStarted) return;

        redirectStarted = true;
        window.location.replace(destination);
    }

    function finishCountdown() {

        countdownEl.textContent = "0";
        liquid.style.height = "100%";

        if (!destination) {
            statusSubtext.textContent = "Download link unavailable.";
            btnSpinner.style.display = "none";
            btnText.textContent = "LINK NOT FOUND";
            return;
        }

        statusSubtext.textContent = "Redirecting in progress...";

        btnSpinner.style.display = "none";
        btnText.textContent = "DOWNLOAD NOW";

        primaryBtn.classList.remove("btn-verifying");
        primaryBtn.classList.add("btn-ready");
        primaryBtn.disabled = false;

        /*
          Manual fallback if automatic navigation is blocked.
        */

        primaryBtn.addEventListener("click", goToDestination);

        /*
          Show the button briefly, then redirect automatically.
        */

        setTimeout(goToDestination, 900);
    }

    /*
      Start gradual water filling.
    */

    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            liquid.style.height = "100%";
        });
    });

    /*
      Countdown.
    */

    const timer = setInterval(() => {

        timeLeft--;

        countdownEl.textContent = timeLeft;

        countdownEl.classList.add("tick");

        setTimeout(() => {
            countdownEl.classList.remove("tick");
        }, 180);

        if (timeLeft === 2) {
            statusSubtext.textContent = "Redirecting in progress...";
        }

        if (timeLeft <= 0) {
            clearInterval(timer);
            finishCountdown();
        }

    }, 1000);

});
</script>

</body>
</html>
