<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10152d">
<title>RM Movies - Preparing Your Download</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font-family:Arial,sans-serif;
  color:white;
  background:
    radial-gradient(circle at 15% 15%,#0879a5,transparent 40%),
    radial-gradient(circle at 90% 80%,#792de4,transparent 40%),
    linear-gradient(135deg,#10152d,#17152c,#080d20);
}
.card{
  width:100%;
  max-width:390px;
  padding:30px 20px 24px;
  text-align:center;
  border:1px solid #ffffff35;
  border-radius:24px;
  background:#ffffff12;
  backdrop-filter:blur(18px);
  box-shadow:0 15px 45px #0006;
}
.logo{
  width:66px;height:66px;
  margin:0 auto 18px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:25px;
  font-weight:900;
  color:#ffd66b;
  background:#080d20;
  border:2px solid #20cfff;
  box-shadow:0 0 22px #00cfff55;
}
h2{font-size:21px;letter-spacing:2px}
.subtitle{
  margin:12px 0 24px;
  font-size:12px;
  color:#b9d9f5;
}
.status{
  display:inline-block;
  padding:7px 13px;
  border-radius:20px;
  background:#00c78120;
  color:#58ffbb;
  font-size:10px;
  margin-bottom:25px;
}
.timer{
  width:112px;height:112px;
  border:5px solid #21cfff;
  border-radius:50%;
  margin:0 auto 24px;
  display:grid;
  place-items:center;
  font-size:44px;
  font-weight:bold;
  background:linear-gradient(145deg,#0879be,#12d9ed);
  box-shadow:0 0 25px #00cfff55;
}
h4{font-size:12px;margin-bottom:10px}
.description{
  color:#bdc9df;
  font-size:12px;
  line-height:1.7;
  margin-bottom:22px;
}
button,.channel{
  width:100%;
  min-height:46px;
  display:flex;
  justify-content:center;
  align-items:center;
  border:0;
  border-radius:11px;
  text-decoration:none;
  font-weight:bold;
  font-size:12px;
  margin-top:10px;
  cursor:pointer;
}
#continueBtn{
  color:white;
  background:linear-gradient(90deg,#058edb,#563cff);
}
#continueBtn:disabled{
  opacity:.7;cursor:wait;
}
.channel{
  color:white;
  border:1px solid #ffffff35;
  background:#ffffff12;
}
.footer{
  margin-top:23px;
  color:#a6b1cb;
  font-size:10px;
  letter-spacing:1px;
}
  .logo {
  width: 80px;
  height: 80px;
  margin: 0 auto 18px;
}

.logo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}
</style>
</head>

<body>
<main class="card">

  <div class="logo">
  <img src="RudraMovies.png" alt="RUDRA MOVIES Logo">
  </div>

  <h2>RM MOVIES</h2>
  <p class="subtitle">YOUR MOVIE DOWNLOAD DESTINATION</p>

  <div class="status">● LINK PREPARATION</div>

  <div class="timer" id="timer">3</div>

  <h4 id="heading">PREPARING YOUR DOWNLOAD</h4>

  <p class="description" id="message">
    Please wait while your download link is being prepared.
    You can continue when the countdown finishes.
  </p>

  <button id="continueBtn" disabled>
    Please wait... (3)
  </button>

  <a class="channel"
     href="https://t.me/RudraMoviez"
     target="_blank" rel="noopener">
    ➤ JOIN RM MOVIES CHANNEL
  </a>

  <div class="footer">✦ RM MOVIES • OFFICIAL PAGE ✦</div>
</main>

<script>
const params = new URLSearchParams(location.search);
const destination = params.get("url");

let seconds = 3;

const timer = document.getElementById("timer");
const btn = document.getElementById("continueBtn");
const heading = document.getElementById("heading");
const message = document.getElementById("message");

function validUrl(value) {
  try {
    const u = new URL(value);
    return u.protocol === "https:" || u.protocol === "http:";
  } catch {
    return false;
  }
}

const countdown = setInterval(() => {
  seconds--;
  timer.textContent = seconds;

  if (seconds <= 0) {
    clearInterval(countdown);
    timer.textContent = "✓";
    heading.textContent = "YOUR LINK IS READY";
    message.textContent =
      "Click the button below to continue to your destination.";

    btn.disabled = false;
    btn.textContent = "➤  PROCEED TO DOWNLOAD";
  } else {
    btn.textContent = `Please wait... (${seconds})`;
  }
}, 1000);

btn.addEventListener("click", () => {
  if (btn.disabled) return;

  if (!destination || !validUrl(destination)) {
    message.textContent =
      "Download link is not configured. Please contact the channel admin.";
    return;
  }

  location.href = destination;
});
</script>
</body>
</html>
