<html lang="en">
<head>

  <style>
    :root {
      --bg: #070b18;
      --panel: #101a32;
      --blue: #168bff;
      --cyan: #20d9ef;
      --purple: #9747ff;
      --pink: #db42ce;
      --white: #f5f8ff;
      --muted: #9eacc9;
      --green: #31e6a0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px 16px;
      overflow-x: hidden;
      position: relative;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 8% 18%, rgba(0,151,255,.19), transparent 35%),
        radial-gradient(ellipse at 92% 14%, rgba(205,44,180,.15), transparent 35%),
        radial-gradient(ellipse at 80% 95%, rgba(116,53,255,.18), transparent 36%),
        linear-gradient(145deg,#080f20,#080b18 52%,#100b22);
      color: var(--white);
      font-family: Inter, Arial, sans-serif;
    }

    /* BACKGROUND EFFECTS */

    .background-effects {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .glow {
      position: absolute;
      width: 330px;
      height: 330px;
      border-radius: 50%;
      filter: blur(95px);
      opacity: .38;
      animation: glowMove 12s ease-in-out infinite alternate;
    }

    .glow-blue {
      top: -120px;
      left: -150px;
      background: #087fe8;
    }

    .glow-purple {
      top: 12%;
      right: -180px;
      background: #a22ee8;
      animation-delay: -4s;
    }

    .glow-pink {
      bottom: -180px;
      left: 25%;
      background: #7e32d8;
      animation-delay: -7s;
    }

    @keyframes glowMove {
      from { transform: translate(0,0) scale(1); }
      to { transform: translate(30px,-25px) scale(1.16); }
    }

    .grid-overlay {
      position: absolute;
      inset: 0;
      opacity: .10;
      background-image:
        linear-gradient(rgba(90,150,255,.15) 1px,transparent 1px),
        linear-gradient(90deg,rgba(90,150,255,.15) 1px,transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom,black,transparent 85%);
    }

    /* MAIN LAYOUT */

    .page-shell {
      width: 100%;
      max-width: 405px;
      position: relative;
      z-index: 1;
      perspective: 1000px;
    }

    .card {
      width: 100%;
      position: relative;
      overflow: hidden;
      isolation: isolate;
      padding: 30px 21px 21px;
      border-radius: 29px;
      text-align: center;
      background:
        radial-gradient(circle at 0% 0%,rgba(13,125,255,.22),transparent 48%),
        radial-gradient(circle at 100% 100%,rgba(139,57,255,.22),transparent 45%),
        linear-gradient(155deg,rgba(24,38,67,.96),rgba(10,17,37,.97) 60%,rgba(24,17,48,.97));
      border: 1px solid rgba(135,175,255,.24);
      box-shadow:
        0 30px 80px rgba(0,0,0,.55),
        0 0 35px rgba(24,116,255,.12),
        inset 0 1px 0 rgba(255,255,255,.12);
      animation: cardEnter .8s cubic-bezier(.2,.8,.2,1) both;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      padding: 1.5px;
      border-radius: inherit;
      background: conic-gradient(
        from var(--edge-angle,0deg),
        transparent 0deg,
        #23d9f5 55deg,
        #168bff 110deg,
        transparent 165deg,
        #c344ed 230deg,
        #8b50ff 295deg,
        transparent 360deg
      );
      -webkit-mask: linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: .85;
      animation: edgeRotate 9s linear infinite;
    }

    .card::after {
      content: "";
      position: absolute;
      top: 0;
      left: 12%;
      width: 76%;
      height: 1px;
      background: linear-gradient(90deg,transparent,#8eeaff,#b4a4ff,transparent);
      opacity: .8;
      pointer-events: none;
    }

    @property --edge-angle {
      syntax: "<angle>";
      inherits: false;
      initial-value: 0deg;
    }

    @keyframes edgeRotate {
      to { --edge-angle: 360deg; }
    }

    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(25px) scale(.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* TOP LABEL */

    .top-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-bottom: 19px;
      color: rgba(180,203,245,.6);
      font-size: .58rem;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .top-label-line {
      width: 23px;
      height: 1px;
      background: linear-gradient(90deg,transparent,#4b9cff);
    }

    /* LOGO */

    .logo-wrap {
      width: 78px;
      height: 78px;
      margin: 0 auto 13px;
      padding: 3px;
      border-radius: 24px;
      background: linear-gradient(140deg,#3cdcff,#347bff 48%,#b34cff);
      box-shadow:
        0 0 24px rgba(44,147,255,.34),
        0 0 40px rgba(151,71,255,.15);
      transform: rotate(-4deg);
      animation: logoFloat 4s ease-in-out infinite;
    }

    .logo-inner {
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 21px;
      background: #060a16;
      transform: rotate(4deg);
    }

    .logo-inner img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    @keyframes logoFloat {
      50% { transform: translateY(-5px) rotate(-2deg); }
    }

    .brand-title {
      font-size: 1.25rem;
      line-height: 1.3;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #fff;
      text-shadow:
        0 0 10px rgba(42,157,255,.5),
        0 0 25px rgba(151,71,255,.28);
      margin-bottom: 7px;
    }

    .brand-subtitle {
      font-size: .57rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: #8da6ce;
      margin-bottom: 19px;
    }

    /* VERIFIED STATUS */

    .verified-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 7px 14px;
      border-radius: 50px;
      border: 1px solid rgba(42,195,255,.27);
      background: rgba(24,125,180,.10);
      box-shadow: inset 0 0 15px rgba(34,180,255,.06);
      margin-bottom: 24px;
    }

    .verified-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
      animation: statusBlink 1.8s ease-in-out infinite;
    }

    .verified-text {
      color: #5bd2ff;
      font-size: .62rem;
      font-weight: 800;
      letter-spacing: 1px;
    }

    @keyframes statusBlink {
      50% { opacity: .45; transform: scale(.8); }
    }

    /* COUNTDOWN */

    .countdown-area {
      margin: 0 auto 24px;
      width: 156px;
      height: 156px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .orbit {
      position: absolute;
      inset: 0;
      border: 1px dashed rgba(75,168,255,.55);
      border-radius: 50%;
      animation: orbitSpin 25s linear infinite;
    }

    .orbit::before {
      content: "";
      position: absolute;
      width: 7px;
      height: 7px;
      top: 12px;
      left: 20px;
      border-radius: 50%;
      background: #3dd9ff;
      box-shadow: 0 0 12px #3dd9ff;
    }

    .orbit-inner {
      position: absolute;
      inset: 9px;
      border: 1px solid rgba(103,160,255,.22);
      border-radius: 50%;
      animation: orbitSpin 16s linear infinite reverse;
    }

    @keyframes orbitSpin {
      to { transform: rotate(360deg); }
    }

    .progress-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      z-index: 3;
      pointer-events: none;
    }

    .progress-track {
      fill: none;
      stroke: rgba(83,143,255,.13);
      stroke-width: 4;
    }

    .progress-ring {
      fill: none;
      stroke: url(#progressGradient);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 339.29;
      stroke-dashoffset: 339.29;
      filter: drop-shadow(0 0 7px #1bbaff);
    }

    .liquid-ball {
      width: 116px;
      height: 116px;
      position: relative;
      overflow: hidden;
      border-radius: 50%;
      border: 5px solid rgba(38,75,126,.85);
      background: radial-gradient(circle at 40% 20%,#485c80,#14233e 80%);
      box-shadow:
        inset 0 8px 18px rgba(0,0,0,.55),
        inset 0 -5px 15px rgba(34,190,255,.2),
        0 0 25px rgba(30,146,255,.28);
      z-index: 2;
    }

    .liquid-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0%;
      background: linear-gradient(180deg,#36e4f1,#11a8e2 60%,#176be8);
      transition: height .08s linear;
    }

    .liquid-fill::before {
      content: "";
      position: absolute;
      left: -10%;
      top: -6px;
      width: 120%;
      height: 13px;
      border-radius: 50%;
      background: #9cf7ff;
      box-shadow: 0 0 13px rgba(75,227,255,.8);
      animation: liquidWave 2s ease-in-out infinite alternate;
    }

    @keyframes liquidWave {
      to { transform: translateY(3px) scaleY(1.3); }
    }

    .ball-shine {
      position: absolute;
      inset: 0;
      z-index: 3;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle at 32% 20%,rgba(255,255,255,.3),transparent 57%);
    }

    .count-number {
      position: absolute;
      z-index: 4;
      font-size: 2.65rem;
      font-weight: 900;
      color: white;
      text-shadow: 0 2px 5px #06365c,0 0 17px rgba(125,230,255,.8);
      transition: transform .2s cubic-bezier(.34,1.56,.64,1);
    }

    .count-number.pop {
      transform: scale(1.18);
    }

    /* STATUS */

    .status-section {
      margin-bottom: 20px;
    }

    .status-title {
      font-size: .85rem;
      font-weight: 900;
      letter-spacing: .8px;
      margin-bottom: 7px;
    }

    .status-description {
      font-size: .76rem;
      color: var(--muted);
      font-weight: 500;
    }

    .status-progress {
      width: 100%;
      max-width: 180px;
      height: 3px;
      margin: 12px auto 0;
      overflow: hidden;
      border-radius: 10px;
      background: rgba(255,255,255,.08);
    }

    .status-progress span {
      display: block;
      width: 35%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg,#1a8fff,#2be2ed,#a64cff);
      animation: loadingBar 1.8s ease-in-out infinite;
    }

    @keyframes loadingBar {
      from { transform: translateX(-120%); }
      to { transform: translateX(350%); }
    }

    .error-box {
      display: none;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 12px;
      text-align: left;
      color: #ffd0d0;
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.35);
      font-size: .75rem;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    /* BUTTONS */

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 11px;
      margin-bottom: 19px;
    }

    .button {
      width: 100%;
      min-height: 49px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border-radius: 14px;
      text-decoration: none;
      font-family: inherit;
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .4px;
      transition: .25s ease;
      cursor: pointer;
    }

    .download-button {
      color: rgba(220,236,255,.58);
      background: linear-gradient(110deg,#18599d,#174b9b);
      border: 1px solid rgba(92,172,255,.28);
      box-shadow: 0 4px 0 #10356c,0 9px 20px rgba(0,100,255,.15);
      pointer-events: none;
    }

    .download-button.ready {
      color: #fff;
      background: linear-gradient(110deg,#08a9df,#1677f5 55%,#5c53ef);
      border-color: rgba(123,223,255,.55);
      box-shadow: 0 4px 0 #124a9d,0 9px 25px rgba(23,142,255,.35);
      pointer-events: auto;
      animation: buttonGlow 1.8s ease-in-out infinite;
    }

    @keyframes buttonGlow {
      50% {
        box-shadow: 0 4px 0 #124a9d,0 10px 30px rgba(23,142,255,.65);
      }
    }

    .download-button.ready:hover {
      transform: translateY(-2px);
    }

    .spinner {
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255,255,255,.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .telegram-button {
      color: #fff;
      background: linear-gradient(110deg,rgba(255,255,255,.09),rgba(120,120,255,.09));
      border: 1px solid rgba(168,190,255,.27);
      box-shadow: 0 4px 0 rgba(5,10,25,.6),0 8px 18px rgba(0,0,0,.2);
    }

    .telegram-button:hover {
      background: rgba(255,255,255,.15);
      border-color: rgba(80,190,255,.5);
      transform: translateY(-2px);
    }

    .telegram-icon {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
      color: #39c7ff;
    }

    /* FOOTER */

    .footer {
      padding-top: 15px;
      border-top: 1px solid rgba(150,180,255,.12);
    }

    .footer-brand {
      color: #a8b9da;
      font-size: .65rem;
      font-weight: 800;
      letter-spacing: 1.4px;
    }

    .footer-caption {
      margin-top: 6px;
      color: rgba(153,174,212,.5);
      font-size: .55rem;
      letter-spacing: 1px;
    }

    /* RESPONSIVE */

    @media (max-width: 360px) {
      body { padding: 12px; }
      .card { padding: 25px 15px 18px; }
      .countdown-area { transform: scale(.94); margin-bottom: 18px; }
      .brand-title { font-size: 1.12rem; }
    }

    @media (max-height: 690px) {
      body { align-items: flex-start; }
    }

    @media (min-width: 768px) {
      .page-shell { max-width: 420px; }
      .card { padding: 34px 25px 23px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

  <script>
    (function () {
      "use strict";

      const COUNTDOWN_SECONDS = 5;
      const ARC_CIRCUMFERENCE = 2 * Math.PI * 54;

      const countdownNumber = document.getElementById("countdownNumber");
      const progressRing = document.getElementById("progressRing");
      const liquidFill = document.getElementById("liquidFill");
      const statusTitle = document.getElementById("statusTitle");
      const statusDescription = document.getElementById("statusDescription");
      const statusDot = document.getElementById("statusDot");
      const loadingBar = document.getElementById("loadingBar");
      const errorBox = document.getElementById("errorBox");
      const downloadButton = document.getElementById("downloadButton");
      const downloadButtonText = document.getElementById("downloadButtonText");
      const buttonSpinner = document.getElementById("buttonSpinner");

      progressRing.style.strokeDasharray = String(ARC_CIRCUMFERENCE);
      progressRing.style.strokeDashoffset = String(ARC_CIRCUMFERENCE);

      let finalRedirectUrl = null;
      let hasError = false;

      function parseValidUrl(input) {
        if (!input || typeof input !== "string") return null;

        const raw = input.trim();
        if (!raw) return null;

        if (/^(https?:\/\/|tg:\/\/)/i.test(raw)) {
          return raw;
        }

        try {
          const decoded = atob(raw).trim();

          if (/^(https?:\/\/|tg:\/\/)/i.test(decoded)) {
            return decoded;
          }
        } catch (_) {}

        return null;
      }

      function displayError(message) {
        if (hasError) return;

        hasError = true;

        buttonSpinner.style.display = "none";
        downloadButtonText.textContent = "LINK ERROR";

        statusTitle.textContent = "VERIFICATION FAILED";
        statusTitle.style.color = "#ff7777";

        statusDescription.textContent = "Unable to continue with redirect.";
        statusDot.style.background = "#ef4444";
        statusDot.style.boxShadow = "0 0 9px #ef4444";

        countdownNumber.textContent = "!";
        liquidFill.style.height = "0%";

        loadingBar.style.display = "none";

        errorBox.textContent = message;
        errorBox.style.display = "block";

        downloadButton.classList.remove("ready");
        downloadButton.removeAttribute("href");
        downloadButton.setAttribute("aria-disabled", "true");
      }

      async function resolveDestination() {
        const params = new URLSearchParams(window.location.search);

        const token = params.get("token");
        const redirect = params.get("redirect");

        if (token) {
          try {
            let response = await fetch(
              `/api/verify?token=${encodeURIComponent(token)}`,
              {
                method: "GET",
                headers: {
                  "Accept": "application/json"
                }
              }
            );

            if (response.status === 405) {
              response = await fetch("/api/verify", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Accept": "application/json"
                },
                body: JSON.stringify({ token, redirect })
              });
            }

            const data = await response.json().catch(() => ({}));

            if (
              !response.ok ||
              data.error ||
              data.valid === false ||
              data.success === false
            ) {
              throw new Error(
                data.message ||
                data.error ||
                "This download token is invalid or has expired."
              );
            }

            const target =
              data.redirect ||
              data.url ||
              data.target ||
              data.link ||
              redirect;

            const validTarget = parseValidUrl(target);

            if (!validTarget) {
              throw new Error("Destination download link is missing or invalid.");
            }

            return validTarget;

          } catch (error) {
            displayError(
              error.message ||
              "Failed to verify download token. Please try again."
            );

            return null;
          }
        }

        if (redirect) {
          const validTarget = parseValidUrl(redirect);

          if (validTarget) {
            return validTarget;
          }

          displayError("The provided redirect URL is invalid.");
          return null;
        }

        displayError("No download link or token was found in the URL.");
        return null;
      }

      function startCountdown() {
        const destinationPromise = resolveDestination();

        const startTime = performance.now();
        const totalDuration = COUNTDOWN_SECONDS * 1000;

        let previousSecond = COUNTDOWN_SECONDS;

        liquidFill.style.height = "15%";

        const statusTimer = setTimeout(() => {
          if (!hasError && !finalRedirectUrl) {
            statusDescription.textContent = "Preparing secure destination...";
          }
        }, 1200);

        function tick(now) {
          if (hasError) {
            clearTimeout(statusTimer);
            return;
          }

          const elapsed = Math.min(now - startTime, totalDuration);
          const progress = elapsed / totalDuration;

          const remaining = Math.max(
            1,
            Math.ceil((totalDuration - elapsed) / 1000)
          );

          progressRing.style.strokeDashoffset =
            String(ARC_CIRCUMFERENCE * (1 - progress));

          liquidFill.style.height =
            `${15 + progress * 80}%`;

          if (remaining !== previousSecond && elapsed < totalDuration) {
            previousSecond = remaining;

            countdownNumber.textContent = String(remaining);
            countdownNumber.classList.add("pop");

            setTimeout(() => {
              countdownNumber.classList.remove("pop");
            }, 180);
          }

          if (elapsed < totalDuration) {
            requestAnimationFrame(tick);
          } else {
            completeCountdown(destinationPromise);
          }
        }

        requestAnimationFrame(tick);
      }

      async function completeCountdown(destinationPromise) {
        finalRedirectUrl = await destinationPromise;

        if (hasError || !finalRedirectUrl) return;

        progressRing.style.strokeDashoffset = "0";
        liquidFill.style.height = "100%";

        countdownNumber.textContent = "0";
        countdownNumber.classList.add("pop");

        statusTitle.textContent = "YOUR DESTINATION IS READY";
        statusDescription.textContent = "Secure verification completed.";

        statusDot.style.background = "#31e6a0";
        statusDot.style.boxShadow = "0 0 10px #31e6a0";

        loadingBar.style.display = "none";

        buttonSpinner.style.display = "none";

        downloadButtonText.textContent =
          "PROCEED TO DESTINATION →";

        downloadButton.href = finalRedirectUrl;
        downloadButton.classList.add("ready");
        downloadButton.setAttribute("aria-disabled", "false");

        setTimeout(() => {
          if (finalRedirectUrl && !hasError) {
            window.location.href = finalRedirectUrl;
          }
        }, 300);
      }

      downloadButton.addEventListener("click", function (event) {
        if (!finalRedirectUrl || hasError) {
          event.preventDefault();
          return;
        }

        event.preventDefault();
        window.location.href = finalRedirectUrl;
      });

      startCountdown();
    })();
  </script>
