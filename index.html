<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secured Download Link</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: radial-gradient(circle at top, #1a2a4a, #0b0f19 80%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 30px 20px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .logo {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      margin: 0 auto 12px;
      background: #111;
      border: 2px solid #ffd700;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #ffd700;
      font-size: 18px;
    }
    .title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .badge {
      display: inline-block;
      margin-top: 6px;
      font-size: 11px;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 4px 10px;
      border-radius: 12px;
    }
    .timer-circle {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 4px solid #0284c7;
      box-shadow: 0 0 20px rgba(2, 132, 199, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 25px auto;
      font-size: 38px;
      font-weight: bold;
    }
    .status {
      font-size: 12px;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 1px;
    }
    .sub-status {
      font-size: 13px;
      color: #cbd5e1;
      margin-top: 4px;
      margin-bottom: 25px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 13px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      transition: 0.2s;
      border: none;
      cursor: pointer;
    }
    .btn-primary {
      background: #0284c7;
      color: #fff;
    }
    .btn-disabled {
      background: #1e293b;
      color: #64748b;
      cursor: not-allowed;
    }
    .btn-channel {
      background: linear-gradient(90deg, #38bdf8 0%, #818cf8 100%);
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- ನಿಮ್ಮ ಲೋಗೋ ಅಥವಾ ಬ್ರ್ಯಾಂಡ್ ಹೆಸರು -->
    <div class="logo">RM</div>
    <div class="title">RUDRA MOVIES</div>
    <div class="badge">🔒 SECURED & VERIFIED LINK</div>

    <!-- ಕೌಂಟ್‌ಡೌನ್ ಸರ್ಕಲ್ -->
    <div class="timer-circle" id="timer">5</div>

    <div class="status">Security Verification</div>
    <div class="sub-status" id="status-text">Scanning Link...</div>

    <!-- ಡೆಸ್ಟಿನೇಷನ್ ಬಟನ್ -->
    <a id="proceed-btn" class="btn btn-disabled" href="#">Please Wait...</a>

    <!-- ಟೆಲಿಗ್ರಾಂ ಚಾನೆಲ್ ಬಟನ್ -->
    <a href="https://t.me/RudraMoviez" target="_blank" class="btn btn-channel">⚡ MAIN CHANNEL ⚡</a>
  </div>

  <script>
    // URL ನಿಂದ redirect ಲಿಂಕ್ ಪಡೆಯುವುದು
    const params = new URLSearchParams(window.location.search);
    const targetUrl = params.get('redirect');

    let count = 5;
    const timerElem = document.getElementById('timer');
    const statusText = document.getElementById('status-text');
    const proceedBtn = document.getElementById('proceed-btn');

    const countdown = setInterval(() => {
      count--;
      if (count > 0) {
        timerElem.innerText = count;
        if (count <= 2) {
          statusText.innerText = "Redirecting in progress...";
        }
      } else {
        clearInterval(countdown);
        timerElem.innerText = "0";
        statusText.innerText = "Verification Complete!";
        
        if (targetUrl) {
          proceedBtn.href = targetUrl;
          proceedBtn.innerText = "Proceed to Destination ➜";
          proceedBtn.classList.remove('btn-disabled');
          proceedBtn.classList.add('btn-primary');
          
          // ಆಟೋಮ್ಯಾಟಿಕ್ ಆಗಿ ಓಪನ್ ಆಗಲು:
          // window.location.href = targetUrl;
        } else {
          proceedBtn.innerText = "No Destination Found";
        }
      }
    }, 1000);
  </script>
</body>
</html>
