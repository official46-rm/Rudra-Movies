<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preparing Your Download Link...</title>
    <style>
        /* Modern Gradient Background & Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0e1e38 0%, #0a325c 50%, #4a154b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Glassmorphism Main Card Container */
        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            padding: 40px 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            color: #ffffff;
        }

        /* Top Circular Logo Styling */
        .logo-container {
            margin: 0 auto 20px;
            width: 85px;
            height: 85px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Typography */
        h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        /* Secured Link Badge */
        .badge {
            display: inline-flex;
            align-items: center;
            background: rgba(0, 150, 136, 0.15);
            border: 1px solid rgba(0, 150, 136, 0.3);
            color: #00ffcc;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }
        .badge::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #00ffcc;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 8px #00ffcc;
        }

        /* Circular Countdown Timer Styling */
        .timer-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .circle-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.05);
            box-sizing: border-box;
        }

        .circle-progress {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid transparent;
            border-top-color: #00d2ff;
            border-right-color: #00d2ff;
            transform: rotate(-45deg);
            box-sizing: border-box;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        .timer-number {
            font-size: 42px;
            font-weight: bold;
            background: linear-gradient(to bottom, #ffffff, #a5c7f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            z-index: 1;
        }

        /* Status Texts */
        .status-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .status-desc {
            font-size: 13px;
            color: #b0c4de;
            margin-bottom: 25px;
        }

        /* Action Buttons */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 12px;
            border: none;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        /* Primary Dynamic Button (Verifying / Get Link) */
        .btn-primary {
            background: linear-gradient(90deg, #1d64b4, #1579d4);
            color: #ffffff;
            opacity: 0.8;
            cursor: not-allowed;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-primary.active {
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            opacity: 1;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 114, 255, 0.4);
        }

        /* Channel Secondary Button */
        .btn-secondary {
            background: linear-gradient(90deg, rgba(81, 45, 168, 0.3), rgba(49, 27, 146, 0.4));
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-secondary:hover {
            background: linear-gradient(90deg, rgba(81, 45, 168, 0.5), rgba(49, 27, 146, 0.6));
            box-shadow: 0 8px 20px rgba(81, 45, 168, 0.3);
        }
        .btn-secondary span {
            margin-right: 8px;
        }

        /* Live View Tracker Container */
        .views-tracker {
            font-size: 12px;
            color: #00ffcc;
            margin-top: 15px;
            opacity: 0.85;
            letter-spacing: 0.5px;
        }

        /* Footer Branding */
        .footer-brand {
            font-size: 10px;
            color: #647b9c;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 20px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- New Top Dynamic Logo Area -->
        <div class="logo-container">
            <img src="RudraMovies.png" alt="Rudra Movies Logo">
        </div>

        <!-- Title & Verification Status -->
        <h1>Rudra Movies</h1>
        <div class="badge">Secured & Verified Link</div>

        <!-- Progress Counter -->
        <div class="timer-container">
            <div class="circle-bg"></div>
            <div class="circle-progress"></div>
            <div class="timer-number" id="countdown">5</div>
        </div>

        <!-- Informative status Text -->
        <div class="status-title">Security Verification</div>
        <div class="status-desc" id="status-text">Redirecting in progress...</div>

        <!-- Action Button (changes when countdown finishes) -->
        <button class="btn btn-primary" id="action-btn" disabled>
            <span id="btn-text">Verifying...</span>
        </button>

        <!-- Official Telegram Channel Link Button -->
        <a href="https://t.me/RudraMoviez" target="_blank" class="btn btn-secondary">
            <span>➤ ⚡</span> Rudra Main Channel ✨
        </a>

        <!-- Live View Counter Section -->
        <div class="views-tracker">
            👁️ Total Views: <span id="view-count">Loading...</span>
        </div>

        <!-- Footer Text -->
        <div class="footer-brand">
            ⚡ Rudra Movies Security
        </div>
    </div>

    <script>
        // Set the countdown time in seconds
        let timeLeft = 5; 
        const countdownEl = document.getElementById('countdown');
        const actionBtn = document.getElementById('action-btn');
        const btnText = document.getElementById('btn-text');
        const statusText = document.getElementById('status-text');

        // Destination link when verified - Change this to your final destination URL
        const targetDestination = "https://example.com";

        // Logic for tracking view counts dynamically based on hostname
        const trackerNamespace = window.location.hostname.replace(/\./g, '-') || "rudra-movies-official-preview";
        fetch(`https://countapi.xyz{trackerNamespace}/visits`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('view-count').textContent = data.value.toLocaleString();
            })
            .catch(() => {
                document.getElementById('view-count').textContent = "Live";
            });

        const timer = setInterval(() => {
            timeLeft--;
            countdownEl.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timer);
                
                // Update UI elements once done
                statusText.textContent = "Verification Complete!";
                btnText.textContent = "Get Link";
                
                // Activate the button
                actionBtn.classList.add('active');
                actionBtn.removeAttribute('disabled');
                
                // Add click function to redirect
                actionBtn.addEventListener('click', () => {
                    window.location.href = targetDestination;
                });
            }
        }, 1000);
    </script>
</body>
</html>
