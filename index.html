
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#080b1c">
  <title>PREPARING YOUR DOWNLOAD LINK... | RUDRA MOVIES</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --blue: #168eea;
      --cyan: #22d3ee;
      --purple: #a52be8;
      --white: #f5f7ff;
      --muted: #b9c5df;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      overflow-x: hidden;
      color: var(--white);
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(ellipse at 0% 20%, rgba(0,160,220,.65), transparent 38%),
        radial-gradient(ellipse at 100% 5%, rgba(170,35,115,.48), transparent 40%),
        radial-gradient(ellipse at 100% 100%, rgba(150,25,230,.72), transparent 40%),
        linear-gradient(145deg,#071b2a,#0b1025 55%,#130b28);
    }

    .ambient {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .blob {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(85px);
      opacity: .45;
      animation: float 9s ease-in-out infinite alternate;
    }

    .blob.one {
      background: #078ac9;
      top: 5%;
      left: -160px;
    }

    .blob.two {
      background: #a52b91;
      top: 5%;
      right: -170px;
      animation-delay: -3s;
    }

    .blob.three {
      background: #8d27e9;
      bottom: -140px;
      right: -100px;
      animation-delay: -5s;
    }

    @keyframes float {
      to { transform: translate(20px,-18px) scale(1.12); }
    }

    .scene {
      width: 100%;
      max-width: 390px;
      position: relative;
      z-index: 1;
      perspective: 1000px;
    }

    .card {
      position: relative;
      width: 100%;
      padding: 25px 17px 19px;
      text-align: center;
      overflow: hidden;
      border-radius: 27px;
      border: 1.5px solid rgba(210,220,255,.38);
      background:
        radial-gradient(circle at 0% 0%,rgba(0,139,255,.67),transparent 48%),
        radial-gradient(circle at 100% 0%,rgba(190,45,130,.42),transparent 48%),
        radial-gradient(circle at 100% 100%,rgba(155,35,230,.85),transparent 48%),
        linear-gradient(155deg,rgba(37,54,83,.88),rgba(18,25,53,.96) 60%,rgba(42,25,76,.9));
      backdrop-filter: blur(22px) saturate(150%);
      -webkit-backdrop-filter: blur(22px) saturate(150%);
      box-shadow:
        0 25px 65px rgba(0,0,0,.55),
        0 0 30px rgba(50,130,255,.17),
        inset 0 1px 1px rgba(255,255,255,.2);
      animation: cardIn .7s ease both, glow 4s ease-in-out infinite alternate;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px) scale(.97); }
      to { opacity: 1; transform: none; }
    }

    @keyframes glow {
      to {
        box-shadow: 0 25px 65px rgba(0,0,0,.6),
        0 0 42px rgba(55,130,255,.3),
        0 0 45px rgba(155,45,220,.2);
      }
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      padding: 1.5px;
      border-radius: inherit;
      background: conic-gradient(
        from var(--angle,0deg),
        transparent,
        #27d9ff,
        #398bff,
        transparent 45%,
        #d13bdc,
        #8e40ff,
        transparent
      );
      -webkit-mask: linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      animation: borderSpin 7s linear infinite;
    }

    @property --angle {
      syntax: "<angle>";
      inherits: false;
      initial-value: 0deg;
    }

    @keyframes borderSpin {
      to { --angle: 360deg; }
    }

    .logo-ring {
      width: 66px;
      height: 66px;
      margin: 0 auto 12px;
      border-radius: 50%;
      overflow: hidden;
      background: #000;
      border: 2px solid rgba(110,180,255,.5);
      box-shadow: 0 0 20px rgba(50,150,255,.55);
      animation: logoGlow 3s ease-in-out infinite alternate;
    }

    .logo-ring img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @keyframes logoGlow {
      to { box-shadow: 0 0 30px rgba(160,80,255,.8); }
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 11px;
      text-shadow: 0 0 14px rgba(80,170,255,.75);
    }

    .tagline-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 5px 12px;
      border-radius: 30px;
      margin-bottom: 19px;
      background: rgba(20,110,150,.23);
      border: 1px solid rgba(75,190,235,.38);
      box-shadow: inset 0 1px 2px rgba(255,255,255,.08);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22e08a;
      box-shadow: 0 0 9px #22e08a;
      animation: blink 1.8s infinite;
    }

    @keyframes blink {
      50% { opacity: .45; transform: scale(.8); }
    }

    .tagline-text {
      color: #51c9ff;
      font-size: .65rem;
      font-weight: 800;
      letter-spacing: .6px;
    }

    .orb-wrapper {
      position: relative;
      width: 126px;
      height: 126px;
      margin: 0 auto 23px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .orb-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      overflow: visible;
    }

    .ring-dashed {
      fill: none;
      stroke: rgba(105,190,255,.65);
      stroke-width: 1.4;
      stroke-dasharray: 4 5;
      transform-origin: 63px 63px;
      animation: ringSpin 25s linear infinite;
    }

    @keyframes ringSpin {
      to { transform: rotate(360deg); }
    }

    .ring-track {
      fill: none;
      stroke: rgba(100,165,255,.16);
      stroke-width: 4;
    }

    .ring-progress {
      fill: none;
      stroke: url(#arcGrad);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 408.41;
      stroke-dashoffset: 408.41;
      filter: drop-shadow(0 0 5px #28baff);
    }

    .liquid-sphere {
      position: relative;
      width: 96px;
      height: 96px;
      overflow: hidden;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 25%,#606c86,#1c2947 80%);
      border: 4px solid #243c65;
      box-shadow:
        inset 0 7px 15px rgba(0,0,0,.65),
        inset 0 -5px 12px rgba(35,200,255,.3),
        0 0 23px rgba(35,155,255,.6);
      z-index: 2;
    }

    .liquid-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0%;
      background: linear-gradient(180deg,#24d7ef,#10a9d6 65%,#087ad7);
      transition: height .08s linear;
    }

    .liquid-fill::before {
      content: "";
      position: absolute;
      top: -5px;
      left: -8%;
      width: 116%;
      height: 11px;
      border-radius: 50%;
      background: #75edff;
      box-shadow: 0 0 12px rgba(100,235,255,.8);
      animation: slosh 2s ease-in-out infinite alternate;
    }

    @keyframes slosh {
      to { transform: translateY(2px) scaleY(1.2); }
    }

    .sphere-gloss {
      position: absolute;
      inset: 0;
      z-index: 3;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 20%,rgba(255,255,255,.3),transparent 58%);
      pointer-events: none;
    }

    .countdown-num {
      position: absolute;
      z-index: 4;
      font-size: 2.3rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 2px 5px #06345d,0 0 14px rgba(130,220,255,.9);
      user-select: none;
      transition: transform .2s;
    }

    .countdown-num.pop {
      transform: scale(1.15);
    }

    .status-block {
      margin-bottom: 17px;
    }

    .status-heading {
      font-size: .78rem;
      font-weight: 900;
      letter-spacing: .5px;
      margin-bottom: 5px;
    }

    .status-sub {
      color: var(--muted);
      font-size: .76rem;
      font-weight: 500;
    }

    .error-banner {
      display: none;
      padding: 11px;
      border-radius: 12px;
      margin-bottom: 14px;
      color: #fecaca;
      background: rgba(239,68,68,.16);
      border: 1px solid rgba(239,68,68,.4);
      font-size: .75rem;
      line-height: 1.4;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-bottom: 15px;
    }

    .btn {
      width: 100%;
      min-height: 44px;
      padding: 10px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      text-decoration: none;
      font-size: .73rem;
      font-weight: 800;
      letter-spacing: .3px;
      cursor: pointer;
      transition: .25s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-primary {
      color: rgba(220,235,255,.65);
      background: linear-gradient(180deg,#2376bd,#2058a8);
      border: 1px solid rgba(110,190,255,.4);
      box-shadow: 0 4px 0 #153b75,0 8px 18px rgba(20,100,220,.25);
      pointer-events: none;
    }

    .btn-primary.ready {
      color: #fff;
      pointer-events: auto;
      background: linear-gradient(180deg,#19b8e8,#1478ed 65%,#205ee0);
      border-color: rgba(150,225,255,.7);
      box-shadow: 0 4px 0 #10458e,0 9px 22px rgba(20,140,255,.45);
      animation: readyPulse 1.6s ease-in-out infinite;
    }

    @keyframes readyPulse {
      50% { box-shadow: 0 4px 0 #10458e,0 10px 30px rgba(20,150,255,.8); }
    }

    .btn-spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(220,240,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .btn-channel {
      color: #fff;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(195,210,255,.32);
      box-shadow: 0 4px 0 rgba(15,20,50,.65),0 7px 14px rgba(0,0,0,.25);
      backdrop-filter: blur(8px);
    }

    .btn-channel:hover {
      background: rgba(255,255,255,.17);
    }

    .tg-icon {
      width: 15px;
      height: 15px;
      color: #36baff;
      flex-shrink: 0;
    }

    .card-footer {
      color: rgba(210,220,245,.72);
      font-size: .62rem;
      font-weight: 700;
      letter-spacing: .7px;
    }

    @media (min-width: 768px) {
      .scene { max-width: 410px; }
      .card { padding: 30px 22px 21px; }
    }

    @media (max-width: 360px) {
      body { padding: 12px; }
      .card { padding: 23px 14px 17px; }
    }

    @media (max-height: 680px) {
      body { align-items: flex-start; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div class="ambient">
    <div class="blob one"></div>
    <div class="blob two"></div>
    <div class="blob three"></div>
  </div>

  <div class="scene">
    <main class="card">

      <div class="logo-ring">
        <img src="RudraMovies.png" alt="RUDRA MOVIES"
             onerror="this.style.opacity='.25'">
      </div>

      <h1 class="brand-title">ʀᴜᴅʀᴀ ᴍᴏᴠɪᴇꜱ</h1>

      <div class="tagline-pill">
        <span class="status-dot" id="statusDot"></span>
        <span class="tagline-text">ꜱᴇᴄᴜʀᴇᴅ &amp; ᴠᴇʀɪꜰɪᴇᴅ ʟɪɴᴋ</span>
      </div>

      <div class="orb-wrapper">
        <svg class="orb-svg" viewBox="0 0 126 126">
          <defs>
            <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#72e4ff"/>
              <stop offset="55%" stop-color="#2f8cff"/>
              <stop offset="100%" stop-color="#2460e8"/>
            </linearGradient>
          </defs>

          <circle class="ring-dashed" cx="63" cy="63" r="60"/>
          <circle class="ring-track" cx="63" cy="63" r="56"/>
          <circle class="ring-progress" id="ringProgress" cx="63" cy="63" r="56"/>
        </svg>

        <div class="liquid-sphere">
          <div class="liquid-fill" id="liquidFill"></div>
          <div class="sphere-gloss"></div>
        </div>

        <div class="countdown-num" id="countdownNum">5</div>
      </div>

      <div class="status-block">
        <div class="status-heading" id="statusHeading">ꜱᴇᴄᴜʀɪᴛʏ ᴠᴇʀɪꜰɪᴄᴀᴛɪᴏɴ</div>
        <div class="status-sub" id="statusSub">ꜱᴄᴀɴɴɪɴɢ ʟɪɴᴋ...</div>
      </div>

      <div class="error-banner" id="errorBanner"></div>

      <div class="btn-group">
        <a href="#" id="downloadBtn" class="btn btn-primary"
           role="button" aria-disabled="true">
          <span class="btn-spinner" id="btnSpinner"></span>
          <span id="downloadBtnText">ᴠᴇʀɪꜰʏɪɴɢ...</span>
        </a>

        <a href="https://t.me/RudraMovies"
           id="telegramBtn"
           target="_blank"
           rel="noopener noreferrer"
           class="btn btn-channel">
          <svg class="tg-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3.4 20.4l17.45-7.48a1 1 0 0 0 0-1.84L3.4 3.6a.993.993 0 0 0-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.07-.87.5-.87 1l.01 4.61c0 .71.73 1.2 1.39.91z"/>
          </svg>
          <span>⚡ ʀᴜᴅʀᴀ ᴍᴀɪɴ ᴄʜᴀɴɴᴇʟ ✨</span>
        </a>
      </div>

      <div class="card-footer">
        ⚡ ʀᴜᴅʀᴀ ᴍᴏᴠɪᴇꜱ ꜱᴇᴄᴜʀɪᴛʏ
      </div>

    </main>
  </div>

  <script>
    (function () {
      const COUNTDOWN_SECONDS = 5;
      const ARC_CIRCUMFERENCE = 2 * Math.PI * 56;

      const countdownNum = document.getElementById('countdownNum');
      const ringProgress = document.getElementById('ringProgress');
      const liquidFill = document.getElementById('liquidFill');
      const statusHeading = document.getElementById('statusHeading');
      const statusSub = document.getElementById('statusSub');
      const statusDot = document.getElementById('statusDot');
      const errorBanner = document.getElementById('errorBanner');
      const downloadBtn = document.getElementById('downloadBtn');
      const downloadBtnText = document.getElementById('downloadBtnText');
      const btnSpinner = document.getElementById('btnSpinner');

      ringProgress.style.strokeDasharray = `${ARC_CIRCUMFERENCE}`;
      ringProgress.style.strokeDashoffset = `${ARC_CIRCUMFERENCE}`;

      let finalRedirectUrl = null;
      let hasError = false;

      function parseValidUrl(input) {
        if (!input || typeof input !== 'string') return null;

        const raw = input.trim();
        if (!raw) return null;

        if (/^(https?:\/\/|tg:\/\/)/i.test(raw)) return raw;

        try {
          const decoded = atob(raw).trim();
          if (/^(https?:\/\/|tg:\/\/)/i.test(decoded)) return decoded;
        } catch (_) {}

        return null;
      }

      function displayError(msg) {
        hasError = true;
        btnSpinner.style.display = 'none';
        downloadBtnText.textContent = 'ʟɪɴᴋ ᴇʀʀᴏʀ';
        statusHeading.textContent = 'ɪɴᴠᴀʟɪᴅ ᴏʀ ᴍɪꜱꜱɪɴɢ ʟɪɴᴋ';
        statusHeading.style.color = '#f87171';
        statusSub.textContent = 'ᴜɴᴀʙʟᴇ ᴛᴏ ᴘʀᴏᴄᴇᴇᴅ ᴡɪᴛʜ ʀᴇᴅɪʀᴇᴄᴛ.';
        statusDot.style.background = '#ef4444';
        statusDot.style.boxShadow = '0 0 8px #ef4444';
        countdownNum.textContent = '!';
        errorBanner.textContent = msg;
        errorBanner.style.display = 'block';
        downloadBtn.classList.remove('ready');
        downloadBtn.removeAttribute('href');
        downloadBtn.setAttribute('aria-disabled', 'true');
      }

      async function resolveDestination() {
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const redirect = params.get('redirect');

        if (token) {
          try {
            let res = await fetch(`/api/verify?token=${encodeURIComponent(token)}`, {
              method: 'GET',
              headers: { 'Accept': 'application/json' }
            });

            if (res.status === 405) {
              res = await fetch('/api/verify', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Accept': 'application/json'
                },
                body: JSON.stringify({ token, redirect })
              });
            }

            const data = await res.json().catch(() => ({}));

            if (!res.ok || data.error || data.valid === false || data.success === false) {
              throw new Error(data.message || data.error || 'This download token is invalid or has expired.');
            }

            const target = data.redirect || data.url || data.target || data.link || redirect;
            const validTarget = parseValidUrl(target);

            if (!validTarget) {
              throw new Error('Destination download link is missing or invalid.');
            }

            return validTarget;
          } catch (err) {
            displayError(err.message || 'Failed to verify download token. Please try again from the channel.');
            return null;
          }
        }

        if (redirect) {
          const validTarget = parseValidUrl(redirect);
          if (validTarget) return validTarget;

          displayError('The provided redirect URL is invalid.');
          return null;
        }

        displayError('No download link or token was found in the URL.');
        return null;
      }

      function startCountdown() {
        const destinationPromise = resolveDestination();
        const startTime = performance.now();
        const totalDuration = COUNTDOWN_SECONDS * 1000;
        let currentDisplayed = COUNTDOWN_SECONDS;

        liquidFill.style.height = '20%';

        setTimeout(() => {
          if (!hasError && !finalRedirectUrl) {
            statusSub.textContent = 'ʀᴇᴅɪʀᴇᴄᴛɪɴɢ ɪɴ ᴘʀᴏɢʀᴇꜱꜱ...';
          }
        }, 1200);

        function tick(now) {
          if (hasError) return;

          const elapsed = Math.min(now - startTime, totalDuration);
          const progress = elapsed / totalDuration;
          const secondsLeft = Math.max(1, Math.ceil((totalDuration - elapsed) / 1000));

          ringProgress.style.strokeDashoffset =
            `${ARC_CIRCUMFERENCE * (1 - progress)}`;

          liquidFill.style.height = `${20 + progress * 68}%`;

          if (secondsLeft !== currentDisplayed && elapsed < totalDuration) {
            currentDisplayed = secondsLeft;
            countdownNum.textContent = String(secondsLeft);
            countdownNum.classList.add('pop');
            setTimeout(() => countdownNum.classList.remove('pop'), 180);
          }

          if (elapsed < totalDuration) {
            requestAnimationFrame(tick);
          } else {
            completeCountdown(destinationPromise);
          }
        }

        requestAnimationFrame(tick);
      }

      async function completeCountdown(destinationPromise) {
        finalRedirectUrl = await destinationPromise;

        if (hasError || !finalRedirectUrl) return;

        ringProgress.style.strokeDashoffset = '0';
        liquidFill.style.height = '100%';
        countdownNum.textContent = '0';
        countdownNum.classList.add('pop');

        statusSub.textContent = 'ʀᴇᴅɪʀᴇᴄᴛɪɴɢ...';
        btnSpinner.style.display = 'none';
        downloadBtnText.textContent = 'ᴘʀᴏᴄᴇᴇᴅ ᴛᴏ ᴅᴇꜱᴛɪɴᴀᴛɪᴏɴ →';
        downloadBtn.href = finalRedirectUrl;
        downloadBtn.classList.add('ready');
        downloadBtn.setAttribute('aria-disabled', 'false');

        setTimeout(() => {
          window.location.href = finalRedirectUrl;
        }, 300);
      }

      downloadBtn.addEventListener('click', function (e) {
        if (!finalRedirectUrl || hasError) {
          e.preventDefault();
          return;
        }
        window.location.href = finalRedirectUrl;
      });

      startCountdown();
    })();
  </script>
</body>
</html>
