
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rudra Movies Premium</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:
 radial-gradient(circle at 20% 10%,#45331d,transparent 40%),
 radial-gradient(circle at 90% 90%,#342719,transparent 40%),
 #080909;
 color:#f4e4bd;
 font-family:Arial,sans-serif;
 font-variant-caps:all-small-caps;
}

.card{
 width:100%;
 max-width:340px;
 padding:27px 21px;
 border-radius:25px;
 text-align:center;
 background:linear-gradient(145deg,#191a19,#0d0e0d);
 border:1px solid #a98a4c;
 box-shadow:0 15px 50px #000b,
 inset 0 0 25px #c29a3410;
}

.logo-wrapper{margin-bottom:15px}

.logo-img{
 width:78px;
 height:78px;
 border-radius:50%;
 object-fit:cover;
 border:2px solid #d8b66b;
 box-shadow:0 0 20px #c9a34b55;
}

.brand-title{
 font-size:27px;
 font-weight:900;
 letter-spacing:2px;
 color:#e9cc88;
}

.security-badge{
 display:inline-flex;
 align-items:center;
 gap:7px;
 margin-top:12px;
 padding:7px 15px;
 border-radius:30px;
 background:#c5a35b16;
 border:1px solid #b897504c;
 color:#d6bd86;
 font-size:14px;
}

.security-badge span{
 width:7px;
 height:7px;
 border-radius:50%;
 background:#d6b35e;
 box-shadow:0 0 9px #e7bd5c;
}

/* RECTANGLE LIQUID COUNTDOWN */

.timer-container{
 width:100%;
 height:105px;
 margin:27px auto;
 position:relative;
 overflow:hidden;
 border-radius:22px;
 border:2px solid #c5a35b;
 background:#171816;
 box-shadow:0 0 22px #c49a3930;
}

.water{
 position:absolute;
 bottom:0;
 left:0;
 width:0%;
 height:100%;
 background:linear-gradient(
  110deg,
  #76531e,
  #d5ad59,
  #f1d99b
 );
 transition:width 1s linear;
 overflow:hidden;
}

.water::before{
 content:"";
 position:absolute;
 top:-10px;
 left:-30%;
 width:160%;
 height:22px;
 border-radius:50%;
 background:#fff5ce75;
 animation:wave 2.5s linear infinite;
}

.water::after{
 content:"";
 position:absolute;
 top:0;
 right:0;
 width:30%;
 height:100%;
 background:linear-gradient(90deg,transparent,#fff4c055);
 filter:blur(10px);
}

@keyframes wave{
 from{transform:translateX(-10%) rotate(0)}
 to{transform:translateX(10%) rotate(360deg)}
}

.timer-number{
 position:absolute;
 inset:0;
 display:flex;
 align-items:center;
 justify-content:center;
 z-index:2;
 font-size:48px;
 font-weight:900;
 color:#fff3cf;
 text-shadow:0 2px 15px #000;
}

.status-badge{
 font-size:14px;
 letter-spacing:2px;
 color:#a99160;
}

.status-highlight{
 margin:9px 0 22px;
 font-size:18px;
 font-weight:bold;
 color:#e9cd91;
}

.btn{
 display:flex;
 align-items:center;
 justify-content:center;
 width:100%;
 min-height:49px;
 margin-top:12px;
 border-radius:15px;
 text-decoration:none;
 font-size:18px;
 font-weight:bold;
 transition:.3s;
}

.btn-disabled{
 background:#39352c;
 color:#a79a7b;
 pointer-events:none;
}

.btn-ready{
 color:#17130b;
 background:linear-gradient(110deg,#a77c30,#f0d99b,#b58a3d);
 box-shadow:0 5px 20px #d4ae5640;
}

.btn-telegram{
 color:#e9d5a8;
 background:#24251f;
 border:1px solid #927744;
}

.btn:active{transform:scale(.96)}

.footer{
 margin-top:21px;
 color:#8c7955;
 font-size:14px;
 letter-spacing:1px;
}
</style>
</head>

<body>

<div class="card">

 <div class="logo-wrapper">
  <img src="RudraMovies.png"
   alt="Rudra Movies"
   class="logo-img"
   onerror="this.outerHTML='<div class=&quot;logo-img&quot;>RM</div>'">
 </div>

 <div class="brand-title">RUDRA MOVIES</div>

 <div class="security-badge">
  <span></span> LINK PREPARATION
 </div>

 <div class="timer-container">
  <div class="water" id="water"></div>
  <div class="timer-number" id="timer">5</div>
 </div>

 <div class="status-badge">DOWNLOAD STATUS</div>

 <div class="status-highlight" id="status-msg">
  PREPARING YOUR LINK...
 </div>

 <a id="action-btn" class="btn btn-disabled" href="#">
  PLEASE WAIT...
 </a>

 <a href="https://t.me/RudraMoviez"
  target="_blank"
  rel="noopener noreferrer"
  class="btn btn-telegram">
  ⚡ JOIN OFFICIAL CHANNEL
 </a>

 <div class="footer">
  ✦ RUDRA MOVIES ✦
 </div>

</div>

<script>
const params = new URLSearchParams(location.search);
const rawRedirect = params.get("redirect");

let targetRedirect = null;

try{
 if(rawRedirect){
  const parsed = new URL(rawRedirect);
  if(parsed.protocol === "https:"){
   targetRedirect = parsed.href;
  }
 }
}catch(e){}

let seconds = 5;

const timer = document.getElementById("timer");
const water = document.getElementById("water");
const status = document.getElementById("status-msg");
const button = document.getElementById("action-btn");

const interval = setInterval(()=>{

 seconds--;

 let percentage = ((5-seconds)/5)*100;
 water.style.width = percentage+"%";

 if(seconds > 0){

  timer.textContent = seconds;
  button.textContent = `PLEASE WAIT (${seconds}s)`;

  if(seconds <= 2){
   status.textContent = "ALMOST READY...";
  }

 }else{

  clearInterval(interval);
  timer.textContent = "✓";

  if(targetRedirect){

   status.textContent = "YOUR LINK IS READY!";

   button.href = targetRedirect;
   button.textContent = "CONTINUE TO LINK ➜";
   button.classList.remove("btn-disabled");
   button.classList.add("btn-ready");

  }else{

   status.textContent = "LINK NOT AVAILABLE";
   button.textContent = "DIRECT LINK NOT FOUND";

  }
 }

},1000);
</script>

</body>
</html>
