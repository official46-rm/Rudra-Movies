
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUDRA MOVIES</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 25px 0;
  overflow-x: hidden;
  font-family: Arial, sans-serif;
  background: #080d20;
  color: white;
  font-variant-caps: all-small-caps;
}

/* BACKGROUND GLOW */

body::before,
body::after {
  content: "";
  position: fixed;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  filter: blur(100px);
  opacity: .55;
  pointer-events: none;
}

body::before {
  background: #008cff;
  top: 0;
  left: -120px;
}

body::after {
  background: #a020f0;
  bottom: 0;
  right: -120px;
}

.glow {
  position: fixed;
  width: 250px;
  height: 250px;
  background: #00e5ff;
  filter: blur(110px);
  opacity: .25;
  top: 45%;
  right: 0;
  pointer-events: none;
}

/* FLOATING BUBBLES */

.bubbles {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.bubbles span {
  position: absolute;
  bottom: -80px;
  width: 25px;
  height: 25px;
  border-radius: 50%;
  border: 1px solid #ffffff50;
  background: #ffffff12;
  animation: float 13s linear infinite;
}

.bubbles span:nth-child(1) {
  left: 10%;
  animation-duration: 11s;
}

.bubbles span:nth-child(2) {
  left: 30%;
  width: 40px;
  height: 40px;
  animation-duration: 15s;
}

.bubbles span:nth-child(3) {
  left: 60%;
  animation-duration: 10s;
}

.bubbles span:nth-child(4) {
  left: 85%;
  width: 50px;
  height: 50px;
  animation-duration: 17s;
}

@keyframes float {
  0% {
    transform: translateY(0);
    opacity: 0;
  }
  20% { opacity: .8; }
  100% {
    transform: translateY(-110vh);
    opacity: 0;
  }
}

/* MAIN GLASS CARD */

.card {
  width: 92%;
  max-width: 460px;
  padding: 35px 24px 28px;
  position: relative;
  z-index: 2;
  text-align: center;
  border-radius: 38px;
  background: linear-gradient(
    145deg,
    rgba(15,130,220,.35),
    rgba(35,40,80,.65),
    rgba(120,30,180,.30)
  );
  border: 1px solid rgba(190,220,255,.45);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  box-shadow:
    0 20px 60px #0008,
    inset 0 0 30px #ffffff0c,
    0 0 35px #477aff20;
}

/* LOGO */

.logo-wrapper {
  display: flex;
  justify-content: center;
  margin-bottom: 24px;
}

.logo-img {
  width: 105px;
  height: 105px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #b8ecff;
  background: linear-gradient(135deg,#008cff,#753bff);
  box-shadow:
    0 0 15px #00c8ff80,
    0 0 35px #4e75ff50;
}

.brand-title {
  font-size: 29px;
  font-weight: 900;
  letter-spacing: 2px;
  color: #f3f8ff;
  text-shadow: 0 3px 15px #0008;
}

/* BADGE */

.security-badge {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  margin-top: 17px;
  padding: 10px 17px;
  border-radius: 30px;
  background: #16b9ff18;
  border: 1px solid #32baff70;
  color: #62d5ff;
  font-size: 15px;
  font-weight: bold;
}

.security-badge span {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #27dfad;
  box-shadow: 0 0 12px #27dfad;
}

/* ROUND TIMER */

.timer-container {
  width: 205px;
  height: 205px;
  margin: 40px auto 35px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* OUTER RING */

.outer-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px dashed #51baff80;
  animation: rotate 15s linear infinite;
}

@keyframes rotate {
  to { transform: rotate(360deg); }
}

.inner-ring {
  position: absolute;
  width: 175px;
  height: 175px;
  border-radius: 50%;
  border: 6px solid #55caff;
  background: #111f40;
  overflow: hidden;
  box-shadow:
    0 0 0 7px #299eff25,
    0 0 30px #168fff60,
    inset 0 0 20px #0008;
}

/* LIQUID */

.water {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 0%;
  background: linear-gradient(
    180deg,
    #34e5ff,
    #1499f5,
    #5947e9
  );
  transition: height 1s ease;
}

.water::before {
  content: "";
  position: absolute;
  top: -13px;
  left: -50%;
  width: 200%;
  height: 25px;
  background: #c8faff90;
  border-radius: 50%;
  animation: wave 3s linear infinite;
}

.water::after {
  content: "";
  position: absolute;
  top: 20px;
  left: 25%;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff90;
  box-shadow:
    35px 20px 0 #ffffff60,
    65px 5px 0 #ffffff40;
  animation: bubble 2s infinite ease-in-out;
}

@keyframes wave {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes bubble {
  0%,100% {
    transform: translateY(10px);
    opacity: .3;
  }
  50% {
    transform: translateY(-12px);
    opacity: 1;
  }
}

/* PROGRESS RING */

.progress-svg {
  position: absolute;
  width: 205px;
  height: 205px;
  transform: rotate(-90deg);
  z-index: 3;
  pointer-events: none;
}

.progress-bg,
.progress-bar {
  fill: none;
  cx: 102.5;
  cy: 102.5;
  r: 98;
  stroke-width: 5;
}

.progress-bg {
  stroke: #ffffff30;
}

.progress-bar {
  stroke: #55d9ff;
  stroke-linecap: round;
  stroke-dasharray: 615.75;
  stroke-dashoffset: 615.75;
  transition: stroke-dashoffset 1s linear;
}

/* NUMBER */

.timer-number {
  position: relative;
  z-index: 4;
  font-size: 65px;
  font-weight: 900;
  color: white;
  text-shadow: 0 4px 15px #001c45;
}

/* STATUS */

.status-badge {
  font-size: 22px;
  font-weight: 900;
  color: #f0f5ff;
}

.status-highlight {
  margin: 10px 0 28px;
  font-size: 19px;
  color: #b9cbe8;
}

/* BUTTONS */

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 62px;
  margin-top: 14px;
  border-radius: 23px;
  text-decoration: none;
  font-size: 20px;
  font-weight: bold;
  transition: .3s;
}

.btn-disabled {
  background: linear-gradient(110deg,#167ebd,#4059c9);
  color: #d5e7ff;
  opacity: .75;
  pointer-events: none;
}

.btn-ready {
  background: linear-gradient(
    110deg,
    #087edb,
    #2478fa,
    #7544ec
  );
  color: white;
  box-shadow: 0 8px 25px #358aff65;
  animation: buttonGlow 1.5s infinite alternate;
}

@keyframes buttonGlow {
  to {
    box-shadow: 0 8px 35px #328aff90;
  }
}

.btn-telegram {
  color: white;
  background: #ffffff13;
  border: 1px solid #ffffff50;
  box-shadow: inset 0 0 20px #ffffff08;
}

.btn:active {
  transform: scale(.96);
}

.footer {
  margin-top: 27px;
  color: #a8b9d5;
  font-size: 16px;
  letter-spacing: 1px;
}

@media(max-width:380px) {
  .card {
    padding: 28px 17px;
  }

  .brand-title {
    font-size: 25px;
  }

  .timer-container {
    transform: scale(.9);
    margin: 30px auto;
  }
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="bubbles">
  <span></span>
  <span></span>
  <span></span>
  <span></span>
</div>

<div class="card">

  <!-- YOUR LOGO -->
  <div class="logo-wrapper">
    <img
      src="RudraMovies.png"
      alt="Rudra Movies Logo"
      class="logo-img"
      onerror="this.outerHTML='<div class=&quot;logo-img&quot; style=&quot;display:grid;place-items:center;font-size:27px;font-weight:bold&quot;>RM</div>'"
    >
  </div>

  <div class="brand-title">
    RUDRA MOVIES
  </div>

  <div class="security-badge">
    <span></span>
    LINK PREPARATION
  </div>

  <!-- COUNTDOWN -->
  <div class="timer-container">

    <div class="outer-ring"></div>

    <div class="inner-ring">
      <div class="water" id="water"></div>
    </div>

    <svg class="progress-svg" viewBox="0 0 205 205">
      <circle class="progress-bg"
        cx="102.5" cy="102.5" r="98">
      </circle>

      <circle class="progress-bar"
        id="progress-bar"
        cx="102.5" cy="102.5" r="98">
      </circle>
    </svg>

    <div class="timer-number" id="timer">5</div>

  </div>

  <div class="status-badge">
    DOWNLOAD STATUS
  </div>

  <div class="status-highlight" id="status-msg">
    PREPARING YOUR DOWNLOAD LINK...
  </div>

  <!-- REDIRECT BUTTON -->
  <a id="action-btn"
     class="btn btn-disabled"
     href="#">
    PLEASE WAIT...
  </a>

  <!-- TELEGRAM -->
  <a
    href="https://t.me/RudraMoviez"
    target="_blank"
    rel="noopener noreferrer"
    class="btn btn-telegram">
    ➤ ⚡ JOIN OFFICIAL CHANNEL ✨
  </a>

  <div class="footer">
    ⚡ RUDRA MOVIES EXPERIENCE
  </div>

</div>

<script>

// GET REDIRECT URL
const params = new URLSearchParams(
  window.location.search
);

const rawRedirect = params.get("redirect");

let targetRedirect = null;

try {
  if (rawRedirect) {
    const parsed = new URL(rawRedirect);

    if (parsed.protocol === "https:") {
      targetRedirect = parsed.href;
    }
  }
} catch (e) {
  targetRedirect = null;
}

// TIMER SETTINGS
const totalSeconds = 5;
let currentSeconds = totalSeconds;

const timer = document.getElementById("timer");
const statusMsg = document.getElementById("status-msg");
const actionBtn = document.getElementById("action-btn");
const water = document.getElementById("water");
const progressBar = document.getElementById("progress-bar");

const circumference = 2 * Math.PI * 98;

progressBar.style.strokeDasharray = circumference;
progressBar.style.strokeDashoffset = circumference;

// COUNTDOWN
const interval = setInterval(() => {

  currentSeconds--;

  const percentage =
    (totalSeconds - currentSeconds) / totalSeconds;

  // LIQUID FILL
  water.style.height = (percentage * 85) + "%";

  // CIRCULAR PROGRESS
  progressBar.style.strokeDashoffset =
    circumference - (circumference * percentage);

  if (currentSeconds > 0) {

    timer.textContent = currentSeconds;

    actionBtn.textContent =
      `PLEASE WAIT (${currentSeconds}s)`;

    if (currentSeconds <= 2) {
      statusMsg.textContent =
        "ALMOST READY...";
    }

  } else {

    clearInterval(interval);

    timer.textContent = "✓";
    water.style.height = "100%";
    progressBar.style.strokeDashoffset = 0;

    if (targetRedirect) {

      statusMsg.textContent =
        "YOUR DOWNLOAD LINK IS READY!";

      actionBtn.href = targetRedirect;
      actionBtn.textContent = "CONTINUE TO LINK ➜";

      actionBtn.classList.remove("btn-disabled");
      actionBtn.classList.add("btn-ready");

    } else {

      statusMsg.textContent =
        "LINK NOT AVAILABLE";

      actionBtn.textContent =
        "DIRECT LINK NOT FOUND";

    }
  }

}, 1000);

</script>

</body>
</html>
