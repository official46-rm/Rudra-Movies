
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071426">
<title>RUDRA MOVIES | PREPARING YOUR LINK...</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --cyan: #42eaff;
    --blue: #238cff;
    --purple: #984cff;
    --pink: #ed54d5;
}

body {
    min-height: 100vh;
    padding: 24px 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    color: white;
    font-family: 'Poppins', sans-serif;

    background:
        radial-gradient(ellipse at 10% 20%, rgba(0,190,255,.48), transparent 35%),
        radial-gradient(ellipse at 95% 75%, rgba(220,45,220,.38), transparent 36%),
        radial-gradient(ellipse at 75% 5%, rgba(90,65,190,.25), transparent 35%),
        linear-gradient(145deg, #071426, #11182d 55%, #090d20);
}

/* BACKGROUND GLOW */

.glow {
    position: fixed;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    filter: blur(85px);
    opacity: .35;
    pointer-events: none;
    z-index: -1;
}

.glow.cyan {
    top: 8%;
    left: -110px;
    background: #00d9ff;
}

.glow.pink {
    right: -110px;
    bottom: 8%;
    background: #ec36d0;
}

/* MAIN CARD */

.card {
    width: 100%;
    max-width: 390px;
    position: relative;
    overflow: hidden;
    padding: 26px 20px 20px;
    text-align: center;
    border-radius: 25px;

    background:
        linear-gradient(135deg,
            rgba(42,80,112,.45),
            rgba(22,31,57,.90) 48%,
            rgba(86,35,100,.40));

    border: 1px solid rgba(174,207,255,.38);

    box-shadow:
        0 0 28px rgba(0,191,255,.14),
        0 0 38px rgba(213,54,205,.12),
        0 25px 65px rgba(0,0,0,.48),
        inset 0 1px 1px rgba(255,255,255,.18);

    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
}

.card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 8%;
    width: 84%;
    height: 1px;
    background: linear-gradient(
        90deg, transparent, #8eeeff, #f29bff, transparent
    );
}

/* LOGO */

.logo-box {
    width: 68px;
    height: 68px;
    padding: 3px;
    margin: 0 auto 11px;
    border-radius: 50%;
    background: #091426;
    border: 2px solid rgba(90,224,255,.9);

    box-shadow:
        0 0 12px rgba(0,218,255,.65),
        0 0 25px rgba(0,160,255,.30);

    overflow: hidden;
}

.logo {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    border-radius: 50%;
}

.brand {
    font-family: 'Orbitron', sans-serif;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 1.8px;

    background: linear-gradient(
        90deg, #d9fbff, #55e4ff, #d69aff
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.tagline {
    margin-top: 6px;
    color: #a9c4dc;
    font-size: 8px;
    letter-spacing: 1.5px;
}

.divider {
    width: 75px;
    height: 3px;
    margin: 15px auto 17px;
    border-radius: 20px;
    background: linear-gradient(
        90deg, var(--cyan), var(--blue), var(--pink)
    );
    box-shadow: 0 0 10px rgba(50,215,255,.65);
}

/* HEADING */

.heading {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #e5f8ff;
}

.description {
    margin-top: 7px;
    color: #a8b9ce;
    font-size: 9px;
    letter-spacing: 1px;
}

/* BIG CIRCULAR TIMER */

.timer-wrap {
    width: 160px;
    height: 160px;
    margin: 25px auto 20px;
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;
}

/* OUTER GLASS RING */

.outer-track {
    position: absolute;
    inset: 2px;
    border-radius: 50%;

    border: 5px solid rgba(74,180,230,.13);

    box-shadow:
        0 0 12px rgba(0,190,255,.12),
        inset 0 0 12px rgba(0,190,255,.08);
}

/* OUTER LIQUID RING */

.ring-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
    z-index: 5;
    overflow: visible;
}

.ring-bg,
.ring-fill {
    fill: none;
    stroke-width: 7;
}

.ring-bg {
    stroke: rgba(89,180,225,.14);
}

.ring-fill {
    stroke: url(#liquidGradient);
    stroke-linecap: round;

    stroke-dasharray: 452.39;
    stroke-dashoffset: 452.39;

    filter:
        drop-shadow(0 0 5px rgba(48,220,255,.95))
        drop-shadow(0 0 10px rgba(80,120,255,.55));

    transition: stroke-dashoffset .04s linear;
}

/* MOVING WATER LIGHT */

.ring-light {
    position: absolute;
    width: 13px;
    height: 13px;
    top: 0;
    left: 50%;
    margin-left: -6.5px;
    border-radius: 50%;

    background: #dfffff;

    box-shadow:
        0 0 7px #fff,
        0 0 15px #3ceaff,
        0 0 25px #398cff;

    z-index: 7;

    transform-origin: 6.5px 80px;
}

/* ROTATING DOTTED RING */

.dotted-ring {
    position: absolute;
    inset: -7px;
    border-radius: 50%;

    border: 2px dashed rgba(84,210,255,.55);

    animation: rotateRing 13s linear infinite;
}

@keyframes rotateRing {
    to {
        transform: rotate(360deg);
    }
}

/* INNER CIRCLE */

.circle {
    width: 120px;
    height: 120px;
    position: relative;
    overflow: hidden;
    border-radius: 50%;

    background:
        radial-gradient(circle at 32% 23%,
            #64768b 0%,
            #30445c 34%,
            #142239 72%,
            #070e1c 100%);

    border: 2px solid rgba(130,210,245,.75);

    box-shadow:
        0 0 0 5px rgba(41,153,205,.12),
        0 0 20px rgba(30,191,255,.25),
        inset 0 6px 14px rgba(255,255,255,.16),
        inset 0 -13px 20px rgba(0,0,0,.58);

    z-index: 3;
}

/* GLASS REFLECTION */

.circle::before {
    content: "";
    position: absolute;
    width: 90px;
    height: 48px;
    left: 13px;
    top: 6px;
    border-radius: 50%;

    background: linear-gradient(
        180deg, rgba(255,255,255,.20), transparent
    );

    z-index: 5;
    pointer-events: none;
}

/* INNER WATER */

.water {
    position: absolute;
    bottom: 0;
    left: -50%;
    width: 200%;
    height: 0%;

    background: linear-gradient(
        180deg,
        #9cf6ff 0%,
        #37dfff 16%,
        #168eea 52%,
        #3547bd 78%,
        #6936a8 100%
    );

    box-shadow:
        inset 0 7px 13px rgba(255,255,255,.38),
        inset 0 -12px 17px rgba(0,0,50,.35),
        0 -3px 12px rgba(65,220,255,.35);
}

/* MOVING WAVES */

.wave {
    position: absolute;
    top: -10px;
    left: 0;
    width: 200%;
    height: 20px;

    border-radius: 42%;

    background: linear-gradient(
        180deg,
        rgba(245,255,255,.98),
        rgba(126,239,255,.88) 45%,
        rgba(35,177,245,.45)
    );

    box-shadow:
        0 0 10px rgba(100,230,255,.65),
        0 0 20px rgba(35,190,255,.25);

    animation: waveMove 3.5s linear infinite;
}

.wave.two {
    left: -50%;
    top: -7px;
    opacity: .40;
    animation-duration: 5.5s;
}

@keyframes waveMove {
    to {
        transform: rotate(360deg);
    }
}

/* WATER FLOW INSIDE */

.water-flow {
    position: absolute;
    width: 150%;
    height: 150%;
    left: -25%;
    top: -25%;

    border-radius: 40%;

    border: 2px solid rgba(210,250,255,.20);

    animation: innerFlow 7s linear infinite;
    pointer-events: none;
}

.water-flow.two {
    border-color: rgba(255,255,255,.12);
    animation-duration: 11s;
    animation-direction: reverse;
}

@keyframes innerFlow {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(360deg);
    }
}

/* WATER SHINE */

.water-shine {
    position: absolute;
    top: 3px;
    left: 10%;
    width: 80%;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,.35);
    filter: blur(5px);
    pointer-events: none;
}

/* TIMER TEXT */

.timer-content {
    position: absolute;
    inset: 0;
    z-index: 6;

    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;

    text-shadow: 0 3px 10px rgba(0,0,0,.75);
}

#timer {
    font-family: 'Orbitron', sans-serif;
    font-size: 37px;
    font-weight: 800;
    line-height: 1;
    color: white;
}

.seconds {
    margin-top: 7px;
    font-size: 7px;
    letter-spacing: 2.5px;
    color: #e8f6ff;
}

/* STATUS */

.status {
    display: inline-block;
    padding: 9px 17px;
    margin-bottom: 15px;
    border-radius: 30px;

    color: #82eaff;
    background: rgba(20,157,206,.10);
    border: 1px solid rgba(65,208,245,.35);

    font-size: 9px;
    letter-spacing: 1px;

    box-shadow: 0 0 12px rgba(0,190,255,.08);
}

/* BUTTONS */

.action-btn {
    display: flex;
    width: 100%;
    min-height: 43px;

    align-items: center;
    justify-content: center;
    gap: 8px;

    padding: 12px 10px;
    border-radius: 11px;

    text-decoration: none;

    font-family: 'Orbitron', sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .8px;

    color: #eafaff;

    background: linear-gradient(
        105deg, #087fae, #285fc0, #7546b9
    );

    border: 1px solid rgba(126,206,255,.30);

    box-shadow:
        0 5px 16px rgba(0,0,0,.23),
        inset 0 1px 1px rgba(255,255,255,.15);

    transition: .3s;
}

.action-btn.disabled {
    opacity: .55;
    pointer-events: none;
}

.action-btn.ready {
    opacity: 1;
    pointer-events: auto;

    background: linear-gradient(
        100deg, #16b9dc, #427ee8, #a24cce
    );

    box-shadow:
        0 0 18px rgba(34,191,255,.30),
        0 0 18px rgba(214,65,208,.18);
}

.action-btn.ready:hover {
    transform: translateY(-2px);
}

.action-btn.secondary {
    margin-top: 9px;

    background: linear-gradient(
        110deg,
        rgba(60,185,225,.16),
        rgba(175,66,185,.17)
    );

    border: 1px solid rgba(190,180,255,.25);
}

/* FOOTER */

.note {
    margin-top: 12px;
    color: #aabbd0;
    font-size: 8px;
    letter-spacing: .5px;
}

.footer {
    margin-top: 15px;
    color: #8498b0;
    font-size: 8px;
    letter-spacing: 1.4px;
}

/* MOBILE */

@media(max-width:380px) {
    .card {
        padding: 22px 16px 18px;
    }

    .timer-wrap {
        width: 150px;
        height: 150px;
    }
}
</style>
</head>

<body>

<div class="glow cyan"></div>
<div class="glow pink"></div>

<main class="card">

    <div class="logo-box">
        <img
            src="RudraMovies.png"
            class="logo"
            alt="Rudra Movies Logo">
    </div>

    <div class="brand">RUDRA MOVIES</div>

    <div class="tagline">
        YOUR CINEMA DESTINATION
    </div>

    <div class="divider"></div>

    <div class="heading">
        LINK PREPARATION
    </div>

    <div class="description">
        PREPARING YOUR DOWNLOAD LINK...
    </div>

    <!-- ADVANCED LIQUID CIRCLE -->

    <div class="timer-wrap">

        <div class="outer-track"></div>
        <div class="dotted-ring"></div>

        <!-- OUTER LIQUID RING -->

        <svg class="ring-svg" viewBox="0 0 160 160">

            <defs>
                <linearGradient
                    id="liquidGradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">

                    <stop offset="0%" stop-color="#a9faff"/>
                    <stop offset="25%" stop-color="#39e7ff"/>
                    <stop offset="55%" stop-color="#238cff"/>
                    <stop offset="80%" stop-color="#8d54ff"/>
                    <stop offset="100%" stop-color="#f05bd8"/>

                </linearGradient>
            </defs>

            <circle
                class="ring-bg"
                cx="80"
                cy="80"
                r="72"/>

            <circle
                class="ring-fill"
                id="ringFill"
                cx="80"
                cy="80"
                r="72"/>

        </svg>

        <div class="ring-light" id="ringLight"></div>

        <!-- INNER CIRCLE -->

        <div class="circle">

            <div class="water" id="water">

                <div class="wave"></div>
                <div class="wave two"></div>

                <div class="water-flow"></div>
                <div class="water-flow two"></div>

                <div class="water-shine"></div>

            </div>

            <div class="timer-content">

                <div id="timer">5</div>

                <div class="seconds">
                    SECONDS
                </div>

            </div>

        </div>

    </div>

    <div class="status" id="status">
        PREPARING YOUR LINK...
    </div>

    <a
        href="#"
        class="action-btn disabled"
        id="downloadBtn"
        aria-disabled="true">

        PLEASE WAIT...

    </a>

    <a
        href="https://t.me/RudraMoviez"
        class="action-btn secondary"
        target="_blank"
        rel="noopener noreferrer">

        ✦ JOIN RUDRA MAIN CHANNEL

    </a>

    <div class="note">
        PLEASE WAIT WHILE WE PREPARE YOUR LINK
    </div>

    <div class="footer">
        RUDRA MOVIES • FAST • SIMPLE • CINEMATIC
    </div>

</main>

<script>
const timer = document.getElementById("timer");
const water = document.getElementById("water");
const ringFill = document.getElementById("ringFill");
const ringLight = document.getElementById("ringLight");
const status = document.getElementById("status");
const button = document.getElementById("downloadBtn");

const params = new URLSearchParams(window.location.search);
const redirect = params.get("redirect");

let safeLink = null;

if (redirect) {
    try {
        const parsed = new URL(redirect);

        if (parsed.protocol === "https:") {
            safeLink = parsed.href;
        }
    } catch (error) {
        safeLink = null;
    }
}

const totalSeconds = 5;
const circumference = 2 * Math.PI * 72;

ringFill.style.strokeDasharray = circumference;
ringFill.style.strokeDashoffset = circumference;

const startTime = performance.now();

function animateCountdown(now) {

    const elapsed = Math.min(
        (now - startTime) / 1000,
        totalSeconds
    );

    const completed = elapsed / totalSeconds;

    /* INNER WATER FILL */

    water.style.height =
        (completed * 100) + "%";

    /* OUTER LIQUID RING FILL */

    ringFill.style.strokeDashoffset =
        circumference * (1 - completed);

    /* MOVING RING LIGHT */

    ringLight.style.transform =
        `rotate(${completed * 360}deg)`;

    /* COUNTDOWN */

    const remaining = Math.max(
        0,
        Math.ceil(totalSeconds - elapsed)
    );

    timer.textContent = remaining;

    if (elapsed < totalSeconds) {

        requestAnimationFrame(animateCountdown);

    } else {

        finishCountdown();

    }
}

function finishCountdown() {

    timer.textContent = "✓";

    water.style.height = "100%";

    ringFill.style.strokeDashoffset = 0;

    if (safeLink) {

        status.textContent = "YOUR LINK IS READY";

        button.textContent = "➜ CONTINUE TO LINK";

        button.href = safeLink;

        button.classList.remove("disabled");
        button.classList.add("ready");

        button.setAttribute("aria-disabled", "false");

    } else {

        status.textContent = "DIRECT LINK NOT FOUND";

        button.textContent = "LINK UNAVAILABLE";

        button.removeAttribute("href");

        button.classList.add("disabled");

        button.setAttribute("aria-disabled", "true");

    }
}

requestAnimationFrame(animateCountdown);
</script>

</body>
</html>
