<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071426">
  <meta name="description" content="Rudra Moviez download gateway.">
  <title>PREPARING YOUR DOWNLOAD LINK... | RUDRA MOVIEZ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #050d1b;
      --panel: #0b1930;
      --cyan: #00efff;
      --blue: #398cff;
      --violet: #9874ff;
      --white: #f7fbff;
      --muted: #9bb1ca;
      --green: #42e6ae;
      --danger: #ff627a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { min-height: 100%; background: var(--bg); }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: var(--white);
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(circle at 12% 12%, rgba(0, 190, 255, .18), transparent 38%),
        radial-gradient(circle at 88% 18%, rgba(142, 83, 255, .16), transparent 40%),
        radial-gradient(circle at 50% 100%, rgba(0, 220, 190, .10), transparent 42%),
        linear-gradient(145deg, #071426, #030812 65%, #0b1023);
      overflow-x: hidden;
    }

    .ambient {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .ambient::before,
    .ambient::after {
      content: "";
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: .22;
      animation: ambientDrift 16s ease-in-out infinite alternate;
    }
    .ambient::before { top: -130px; left: -100px; background: #007bff; }
    .ambient::after {
      right: -130px;
      bottom: -120px;
      background: #8b43ff;
      animation-delay: -7s;
    }
    @keyframes ambientDrift {
      to { transform: translate(35px, 25px) scale(1.15); }
    }

    .page-shell {
      width: 100%;
      max-width: 410px;
      position: relative;
      z-index: 1;
    }

    /* Main card intentionally stays clean and flat. */
    .card {
      width: 100%;
      padding: 32px 24px 25px;
      text-align: center;
      border-radius: 26px;
      border: 1px solid rgba(117, 177, 226, .18);
      background: linear-gradient(155deg, rgba(13, 31, 55, .97), rgba(7, 18, 35, .98));
      box-shadow: 0 22px 55px rgba(0, 0, 0, .42);
      animation: cardEnter .55s ease both;
    }
    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .top-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-bottom: 17px;
      color: #9bb5d2;
      font-size: .65rem;
      font-weight: 800;
      letter-spacing: 2px;
      font-variant: small-caps;
    }
    .label-line {
      width: 25px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan));
    }
    .label-line.right { transform: rotate(180deg); }

    .logo-wrap {
      width: 76px;
      height: 76px;
      margin: 0 auto 14px;
      padding: 2px;
      border-radius: 22px;
      background: linear-gradient(135deg, var(--cyan), var(--blue), var(--violet));
      box-shadow: 0 0 18px rgba(0, 220, 255, .18);
    }
    .logo-inner {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 20px;
      background: #071426;
    }
    .logo-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .logo-fallback {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: white;
      font-variant: small-caps;
      text-shadow: 0 0 12px rgba(0, 239, 255, .7);
    }

    .brand-title {
      color: #fff;
      font-size: 1.5rem;
      line-height: 1.2;
      font-weight: 900;
      letter-spacing: 1.3px;
      font-variant: small-caps;
    }
    .brand-subtitle {
      margin-top: 7px;
      color: #91aac6;
      font-size: .65rem;
      font-weight: 700;
      letter-spacing: 2.1px;
      font-variant: small-caps;
    }

    .verified-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 20px 0 22px;
      padding: 8px 14px;
      border: 1px solid rgba(0, 239, 255, .25);
      border-radius: 30px;
      background: rgba(0, 220, 255, .07);
    }
    .verified-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
      animation: blink 1.7s ease-in-out infinite;
    }
    .verified-text {
      color: #72f5dc;
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: 1px;
      font-variant: small-caps;
    }
    @keyframes blink { 50% { opacity: .45; } }

    /* Only the countdown gets the glossy 3D treatment. */
    .countdown-area {
      width: 172px;
      height: 172px;
      margin: 0 auto 22px;
      position: relative;
      display: grid;
      place-items: center;
      filter: drop-shadow(0 12px 18px rgba(0, 0, 0, .38));
    }
    .orbit {
      position: absolute;
      inset: 1px;
      border: 1px dashed rgba(0, 239, 255, .45);
      border-radius: 50%;
      animation: orbitSpin 22s linear infinite;
    }
    .orbit::before {
      content: "";
      position: absolute;
      top: 13px;
      left: 24px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan), 0 0 22px var(--blue);
    }
    @keyframes orbitSpin { to { transform: rotate(360deg); } }

    .progress-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      overflow: visible;
      z-index: 4;
      pointer-events: none;
    }
    .progress-track {
      fill: none;
      stroke: rgba(0, 239, 255, .13);
      stroke-width: 6;
    }
    .progress-ring {
      fill: none;
      stroke: url(#progressGradient);
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 361.28;
      stroke-dashoffset: 361.28;
      filter: drop-shadow(0 0 4px #00efff) drop-shadow(0 0 10px #398cff);
    }

    .liquid-ball {
      width: 126px;
      height: 126px;
      position: relative;
      overflow: hidden;
      border-radius: 50%;
      border: 3px solid rgba(0, 239, 255, .88);
      background:
        radial-gradient(ellipse at 30% 17%, rgba(83, 173, 218, .65), transparent 38%),
        linear-gradient(145deg, #153e64, #071a32 70%);
      box-shadow:
        inset 0 8px 15px rgba(255, 255, 255, .18),
        inset 0 -12px 20px rgba(0, 0, 0, .72),
        inset 0 0 18px rgba(0, 239, 255, .25),
        0 0 13px rgba(0, 239, 255, .62),
        0 0 30px rgba(57, 140, 255, .27);
      transform: translateZ(0);
      z-index: 2;
    }
    .liquid-fill {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 0%;
      background: linear-gradient(180deg, #8ffff8 0%, #00e8f5 34%, #1689f8 100%);
      box-shadow: 0 0 22px rgba(0, 239, 255, .8);
      transition: height .08s linear;
    }
    .liquid-fill::before {
      content: "";
      position: absolute;
      top: -7px;
      left: -12%;
      width: 124%;
      height: 14px;
      border-radius: 50%;
      background: #bffffb;
      box-shadow: 0 0 12px #00efff, 0 0 24px rgba(255, 255, 255, .8);
      animation: liquidWave 1.5s ease-in-out infinite alternate;
    }
    @keyframes liquidWave {
      to { transform: translateY(4px) scaleY(1.35); }
    }
    .ball-shine {
      position: absolute;
      inset: 0;
      z-index: 3;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(ellipse at 29% 18%, rgba(255,255,255,.42), transparent 48%);
    }
    .count-number {
      position: absolute;
      z-index: 5;
      color: #fff;
      font-size: 3rem;
      line-height: 1;
      font-weight: 900;
      text-shadow: 0 2px 3px #03182d, 0 0 12px var(--cyan), 0 0 24px rgba(0, 150, 255, .85);
      font-variant-numeric: tabular-nums;
      transition: transform .22s cubic-bezier(.2, .8, .2, 1), opacity .18s ease;
    }
    .count-number.pop { transform: scale(1.16); }

    .status-section { margin-bottom: 19px; }
    .status-title {
      margin-bottom: 7px;
      color: #fff;
      font-size: .9rem;
      font-weight: 800;
      letter-spacing: .8px;
      font-variant: small-caps;
    }
    .status-description {
      color: var(--muted);
      font-size: .79rem;
      line-height: 1.55;
      font-variant: small-caps;
      letter-spacing: .35px;
    }
    .status-progress {
      width: 100%;
      max-width: 185px;
      height: 4px;
      margin: 14px auto 0;
      overflow: hidden;
      border-radius: 10px;
      background: rgba(255, 255, 255, .08);
    }
    .status-progress span {
      display: block;
      width: 35%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--cyan), var(--blue), var(--violet));
      box-shadow: 0 0 9px var(--cyan);
      animation: loadingBar 1.7s ease-in-out infinite;
    }
    @keyframes loadingBar {
      from { transform: translateX(-120%); }
      to { transform: translateX(390%); }
    }

    .download-button {
      width: 100%;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-top: 18px;
      padding: 13px 16px;
      border: 1px solid rgba(0, 239, 255, .28);
      border-radius: 13px;
      color: #eafcff;
      background: linear-gradient(100deg, rgba(0, 198, 230, .13), rgba(57, 140, 255, .13));
      font: inherit;
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .8px;
      text-decoration: none;
      font-variant: small-caps;
      opacity: .55;
      pointer-events: none;
      transition: background .2s ease, opacity .2s ease, box-shadow .2s ease;
    }
    .download-button.ready {
      opacity: 1;
      pointer-events: auto;
      cursor: pointer;
      color: #041524;
      background: linear-gradient(100deg, #8bfff4, #3bbdff);
      box-shadow: 0 0 18px rgba(0, 220, 255, .25);
    }
    .download-button.ready:hover { box-shadow: 0 0 25px rgba(0, 220, 255, .42); }

    .footer {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid rgba(150, 190, 225, .10);
      color: #7189a5;
      font-size: .62rem;
      line-height: 1.6;
      letter-spacing: .6px;
      font-variant: small-caps;
    }
    .footer strong { color: #a7c3df; font-weight: 800; }

    .error-message {
      display: none;
      margin-top: 13px;
      padding: 10px 12px;
      border: 1px solid rgba(255, 98, 122, .3);
      border-radius: 10px;
      color: #ff9aaa;
      background: rgba(255, 98, 122, .08);
      font-size: .75rem;
      line-height: 1.5;
      font-variant: small-caps;
    }

    @media (max-width: 360px) {
      .card { padding: 27px 18px 22px; }
      .countdown-area { width: 160px; height: 160px; }
      .liquid-ball { width: 118px; height: 118px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div class="ambient" aria-hidden="true"></div>

  <main class="page-shell">
    <section class="card" aria-label="Download link preparation">
      <div class="top-label">
        <span class="label-line"></span>
        <span>SECURE DOWNLOAD GATEWAY</span>
        <span class="label-line right"></span>
      </div>

      <div class="logo-wrap">
        <div class="logo-inner">
          <img src="RudraMovies.png" alt="Rudra Moviez logo"
               onerror="this.style.display='none';document.getElementById('logoFallback').style.display='grid';">
          <span class="logo-fallback" id="logoFallback" style="display:none">RM</span>
        </div>
      </div>

      <h1 class="brand-title">RUDRA MOVIEZ</h1>
      <p class="brand-subtitle">PREMIUM DOWNLOAD EXPERIENCE</p>

      <div class="verified-pill">
        <span class="verified-dot" id="statusDot"></span>
        <span class="verified-text">CONNECTION SECURE</span>
      </div>

      <div class="countdown-area" aria-label="Download preparation countdown">
        <div class="orbit" aria-hidden="true"></div>

        <div class="liquid-ball">
          <div class="liquid-fill" id="liquidFill"></div>
          <div class="ball-shine"></div>
        </div>

        <svg class="progress-svg" viewBox="0 0 172 172" aria-hidden="true">
          <defs>
            <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00f0ff"/>
              <stop offset="55%" stop-color="#398cff"/>
              <stop offset="100%" stop-color="#9874ff"/>
            </linearGradient>
          </defs>
          <circle class="progress-track" cx="86" cy="86" r="57.5"></circle>
          <circle class="progress-ring" id="progressRing" cx="86" cy="86" r="57.5"></circle>
        </svg>

        <span class="count-number" id="countdownNumber">5</span>
      </div>

      <div class="status-section">
        <h2 class="status-title" id="statusTitle">PREPARING YOUR DOWNLOAD LINK</h2>
        <p class="status-description" id="statusDescription">
          Please wait while we securely verify your request.
        </p>
        <div class="status-progress" id="loadingBar"><span></span></div>
      </div>

      <a class="download-button" id="downloadButton" href="#" aria-disabled="true">
        <span id="buttonSpinner">●</span>
        <span id="downloadButtonText">PLEASE WAIT...</span>
      </a>

      <p class="error-message" id="errorMessage" role="alert"></p>

      <footer class="footer">
        <strong>RUDRA MOVIEZ</strong><br>
        SECURE ACCESS • FAST • SIMPLE
      </footer>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const TOTAL_DURATION = 5000;
      const ARC_CIRCUMFERENCE = 2 * Math.PI * 57.5;

      const progressRing = document.getElementById("progressRing");
      const liquidFill = document.getElementById("liquidFill");
      const countdownNumber = document.getElementById("countdownNumber");
      const statusTitle = document.getElementById("statusTitle");
      const statusDescription = document.getElementById("statusDescription");
      const statusDot = document.getElementById("statusDot");
      const loadingBar = document.getElementById("loadingBar");
      const buttonSpinner = document.getElementById("buttonSpinner");
      const downloadButton = document.getElementById("downloadButton");
      const downloadButtonText = document.getElementById("downloadButtonText");
      const errorMessage = document.getElementById("errorMessage");

      let hasError = false;
      let finalRedirectUrl = null;
      let previousSecond = 5;

      /*
       * SECURITY NOTE:
       * The server endpoint must validate the token and return a permitted URL.
       * This client-side host check is an additional guard, not a replacement
       * for server-side validation. Add only domains you control or are
       * authorized to send users to.
       */
      const ALLOWED_REDIRECT_HOSTS = [
        window.location.hostname
        // Add your own authorized hostnames here, for example:
        // "downloads.example.com"
      ];

      function showError(message) {
        hasError = true;
        statusTitle.textContent = "UNABLE TO PREPARE LINK";
        statusDescription.textContent = "Please refresh the page or contact the site administrator.";
        statusDot.style.background = "var(--danger)";
        statusDot.style.boxShadow = "0 0 12px var(--danger)";
        loadingBar.style.display = "none";
        buttonSpinner.style.display = "none";
        errorMessage.textContent = message;
        errorMessage.style.display = "block";
        downloadButton.classList.remove("ready");
        downloadButton.setAttribute("aria-disabled", "true");
      }

      function validateRedirectUrl(rawUrl) {
        try {
          const url = new URL(rawUrl, window.location.origin);
          if (url.protocol !== "https:" && url.protocol !== "http:") return null;
          if (!ALLOWED_REDIRECT_HOSTS.includes(url.hostname)) return null;
          return url.href;
        } catch {
          return null;
        }
      }

      async function requestVerifiedDestination() {
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");

        if (!token) {
          throw new Error("Verification token is missing. Please open the original link again.");
        }

        const response = await fetch("/api/verify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token }),
          cache: "no-store",
          credentials: "same-origin"
        });

        if (!response.ok) {
          throw new Error("The verification service could not approve this request.");
        }

        const data = await response.json();
        const safeUrl = validateRedirectUrl(data.redirectUrl);

        if (!safeUrl) {
          throw new Error("The server returned a missing or unapproved destination.");
        }

        return safeUrl;
      }

      function startCountdown(destinationPromise) {
        const startTime = performance.now();

        function tick(now) {
          if (hasError) return;

          const elapsed = Math.min(now - startTime, TOTAL_DURATION);
          const progress = elapsed / TOTAL_DURATION;
          const remaining = Math.max(0, Math.ceil((TOTAL_DURATION - elapsed) / 1000));

          progressRing.style.strokeDashoffset =
            String(ARC_CIRCUMFERENCE * (1 - progress));

          liquidFill.style.height = `${progress * 100}%`;

          if (remaining !== previousSecond && elapsed < TOTAL_DURATION) {
            previousSecond = remaining;
            countdownNumber.textContent = String(remaining);
            countdownNumber.classList.remove("pop");
            requestAnimationFrame(() => countdownNumber.classList.add("pop"));
            window.setTimeout(() => countdownNumber.classList.remove("pop"), 180);
          }

          if (elapsed < TOTAL_DURATION) {
            requestAnimationFrame(tick);
          } else {
            completeCountdown(destinationPromise);
          }
        }

        requestAnimationFrame(tick);
      }

      async function completeCountdown(destinationPromise) {
        try {
          finalRedirectUrl = await destinationPromise;
          if (hasError || !finalRedirectUrl) return;

          progressRing.style.strokeDashoffset = "0";
          liquidFill.style.height = "100%";
          countdownNumber.textContent = "0";
          countdownNumber.classList.add("pop");

          statusTitle.textContent = "YOUR DOWNLOAD LINK IS READY";
          statusDescription.textContent = "Verification completed. Continue using the button below.";
          statusDot.style.background = "var(--green)";
          statusDot.style.boxShadow = "0 0 12px var(--green)";
          loadingBar.style.display = "none";
          buttonSpinner.style.display = "none";
          downloadButtonText.textContent = "OPEN VERIFIED LINK →";
          downloadButton.href = finalRedirectUrl;
          downloadButton.classList.add("ready");
          downloadButton.setAttribute("aria-disabled", "false");
        } catch (error) {
          showError(error instanceof Error ? error.message : "Verification failed. Please try again.");
        }
      }

      downloadButton.addEventListener("click", (event) => {
        if (!finalRedirectUrl || hasError) {
          event.preventDefault();
          return;
        }
        // The verified destination was validated before enabling this link.
      });

      const destinationPromise = requestVerifiedDestination();
      destinationPromise.catch((error) => {
        showError(error instanceof Error ? error.message : "Verification failed. Please try again.");
      });

      startCountdown(destinationPromise);
    })();
  </script>
</body>
</html>
