<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rudra Movies</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  overflow: hidden;
  font-family: Arial, sans-serif;
  font-variant-caps: all-small-caps;
  background:
    radial-gradient(circle at 10% 15%,#087caa55,transparent 40%),
    radial-gradient(circle at 90% 85%,#8125c855,transparent 40%),
    linear-gradient(145deg,#080e1e,#151a32,#0b1020);
  color: white;
}

/* BACKGROUND GLOW */

.glow {
  position: fixed;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  filter: blur(90px);
  opacity: .5;
  pointer-events: none;
}

.glow.one {
  background: #00aaff;
  top: 5%;
  left: -100px;
}

.glow.two {
  background: #a52cff;
  bottom: 5%;
  right: -100px;
}

/* FLOATING BUBBLES */

.bubbles {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.bubbles span {
  position: absolute;
  bottom: -70px;
  width: 20px;
  height: 20px;
  border: 1px solid #ffffff50;
  border-radius: 50%;
  background: #ffffff12;
  animation: float 12s linear infinite;
}

.bubbles span:nth-child(1){left:10%;animation-duration:11s}
.bubbles span:nth-child(2){left:35%;width:35px;height:35px;animation-duration:15s}
.bubbles span:nth-child(3){left:65%;animation-duration:10s}
.bubbles span:nth-child(4){left:90%;width:28px;height:28px;animation-duration:14s}

@keyframes float {
  0% {transform:translateY(0);opacity:0}
  20% {opacity:.8}
  100% {transform:translateY(-110vh);opacity:0}
}

/* COMPACT CARD */

.card {
  width: 90%;
  max-width: 350px;
  padding: 24px 19px;
  position: relative;
  z-index: 2;
  text-align: center;
  border-radius: 30px;
  background: linear-gradient(
    145deg,
    #1684bb42,
    #192442dc,
    #762cae38
  );
  border: 1px solid #b5dcff55;
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  box-shadow:
    0 15px 45px #0009,
    inset 0 0 25px #ffffff0b,
    0 0 25px #378cff25;
}

/* LOGO */

.logo-wrapper {
  margin-bottom: 16px;
}

.logo-img {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid #a7eaff;
  background: #111a32;
  box-shadow: 0 0 20px #16caff70;
}

.brand-title {
  font-size: 25px;
  font-weight: 900;
  letter-spacing: 2px;
  color: #f1f7ff;
  text-shadow: 0 2px 12px #0008;
}

/* BADGE */

.security-badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin-top: 12px;
  padding: 8px 13px;
  border-radius: 30px;
  background: #00bfff18;
  border: 1px solid #40bfff65;
  color: #73d9ff;
  font-size: 13px;
}

.security-badge span {
  width: 8px;
  height: 8px;
  background: #28e6b1;
  border-radius: 50%;
  box-shadow: 0 0 10px #28e6b1;
}

/* ROUND COUNTDOWN */

.timer-container {
  width: 155px;
  height: 155px;
  margin: 28px auto;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
}

/* OUTER RING */

.outer-ring {
  position: absolute;
  inset: 0;
  border: 2px dashed #65cfff90;
  border-radius: 50%;
  animation: rotate 15s linear infinite;
}

@keyframes rotate {
  to {transform:rotate(360deg)}
}

/* INNER BUBBLE */

.inner-ring {
  position: absolute;
  width: 132px;
  height: 132px;
  border-radius: 50%;
  overflow: hidden;
  background: #122747;
  border: 4px solid #5ccaff;
  box-shadow:
    0 0 0 5px #329cff25,
    0 0 25px #23aaff60,
    inset 0 0 20px #0008;
}

/* WATER FLOW */

.water {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 0%;
  background: linear-gradient(
    180deg,#62efff,#169dff,#5147e8
  );
  transition: height 1s ease;
}

.water::before {
  content: "";
  position: absolute;
  top: -11px;
  left: -50%;
  width: 200%;
  height: 22px;
  background: #e3ffffa0;
  border-radius: 50%;
  animation: wave 3s linear infinite;
}

.water::after {
  content: "";
  position: absolute;
  top: 20px;
  left: 25%;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #ffffffa0;
  box-shadow: 30px 20px 0 #ffffff65;
  animation: bubble 2s infinite;
}

@keyframes wave {
  to {transform:rotate(360deg)}
}

@keyframes bubble {
  0%,100% {transform:translateY(8px);opacity:.3}
  50% {transform:translateY(-10px);opacity:1}
}

/* PROGRESS */

.progress-svg {
  position: absolute;
  width: 155px;
  height: 155px;
  transform: rotate(-90deg);
  z-index: 3;
  pointer-events: none;
}

.progress-svg circle {
  fill: none;
  cx: 77.5;
  cy: 77.5;
  r: 73;
  stroke-width: 3.5;
}

.progress-bg {
  stroke: #ffffff25;
}

.progress-bar {
  stroke: #64dfff;
  stroke-linecap: round;
  stroke-dasharray: 458.67;
  stroke-dashoffset: 458.67;
  transition: stroke-dashoffset 1s linear;
}

/* NUMBER */

.timer-number {
  position: relative;
  z-index: 4;
  font-size: 51px;
  font-weight: 900;
  color: white;
  text-shadow: 0 3px 15px #001c45;
}

/* STATUS */

.status-badge {
  font-size: 19px;
  font-weight: 900;
  color: #f0f5ff;
}

.status-highlight {
  margin: 8px 0 20px;
  font-size: 16px;
  color: #bdcce5;
}

/* BUTTONS */

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 52px;
  margin-top: 11px;
  border-radius: 18px;
  text-decoration: none;
  font-size: 17px;
  font-weight: bold;
  transition: .3s;
}

.btn-disabled {
  background: linear-gradient(110deg,#167ebd,#4059c9);
  color: #d5e7ff;
  opacity: .75;
  pointer-events: none;
}

.btn-ready {
  color: white;
  background: linear-gradient(110deg,#087edb,#2478fa,#7544ec);
  box-shadow: 0 5px 20px #358aff55;
}

.btn-telegram {
  color: white;
  background: #ffffff12;
  border: 1px solid #ffffff45;
}

.btn:active {
  transform: scale(.96);
}

.footer {
  margin-top: 20px;
  color: #a9bddb;
  font-size: 13px;
  letter-spacing: 1px;
}
</style>
</head>

<body>

<div class="glow one"></div>
<div class="glow two"></div>

<div class="bubbles">
  <span></span>
  <span></span>
  <span></span>
  <span></span>
</div>

<div class="card">

  <div class="logo-wrapper">
    <img
      src="RudraMovies.png"
      alt="Rudra Movies Logo"
      class="logo-img"
      onerror="this.outerHTML='<div class=&quot;logo-img&quot; style=&quot;display:grid;place-items:center;font-size:24px;font-weight:bold&quot;>RM</div>'"
    >
  </div>

  <div class="brand-title">
    RUDRA MOVIES
  </div>

  <div class="security-badge">
    <span></span>
    LINK PREPARATION
  </div>

  <div class="timer-container">

    <div class="outer-ring"></div>

    <div class="inner-ring">
      <div class="water" id="water"></div>
    </div>

    <svg class="progress-svg" viewBox="0 0 155 155">
      <circle class="progress-bg"
        cx="77.5" cy="77.5" r="73"/>

      <circle class="progress-bar"
        id="progress-bar"
        cx="77.5" cy="77.5" r="73"/>
    </svg>

    <div class="timer-number" id="timer">5</div>

  </div>

  <div class="status-badge">
    DOWNLOAD STATUS
  </div>

  <div class="status-highlight" id="status-msg">
    PREPARING YOUR DOWNLOAD LINK...
  </div>

  <a id="action-btn"
     class="btn btn-disabled"
     href="#">
    PLEASE WAIT...
  </a>

  <a href="https://t.me/RudraMoviez"
     target="_blank"
     rel="noopener noreferrer"
     class="btn btn-telegram">
    ➤ ⚡ JOIN OFFICIAL CHANNEL ✨
  </a>

  <div class="footer">
    ⚡ RUDRA MOVIES EXPERIENCE
  </div>

</div>

<script>
const params = new URLSearchParams(location.search);
const rawRedirect = params.get("redirect");

let targetRedirect = null;

try {
  if (rawRedirect) {
    const parsed = new URL(rawRedirect);

    if (parsed.protocol === "https:") {
      targetRedirect = parsed.href;
    }
  }
} catch (e) {}

const totalSeconds = 5;
let seconds = totalSeconds;

const timer = document.getElementById("timer");
const water = document.getElementById("water");
const status = document.getElementById("status-msg");
const button = document.getElementById("action-btn");
const progress = document.getElementById("progress-bar");

const circumference = 2 * Math.PI * 73;

progress.style.strokeDasharray = circumference;
progress.style.strokeDashoffset = circumference;

const interval = setInterval(() => {

  seconds--;

  const percentage = (totalSeconds - seconds) / totalSeconds;

  water.style.height = (percentage * 85) + "%";

  progress.style.strokeDashoffset =
    circumference - circumference * percentage;

  if (seconds > 0) {

    timer.textContent = seconds;
    button.textContent = `PLEASE WAIT (${seconds}s)`;

    if (seconds <= 2) {
      status.textContent = "ALMOST READY...";
    }

  } else {

    clearInterval(interval);

    timer.textContent = "✓";
    water.style.height = "100%";

    if (targetRedirect) {

      status.textContent = "YOUR LINK IS READY!";

      button.href = targetRedirect;
      button.textContent = "CONTINUE TO LINK ➜";

      button.classList.remove("btn-disabled");
      button.classList.add("btn-ready");

    } else {

      status.textContent = "LINK NOT AVAILABLE";
      button.textContent = "DIRECT LINK NOT FOUND";

    }
  }

}, 1000);
</script>

</body>
</html>
