<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PREPARING YOUR DOWNLOAD LINK... | RUDRA MOVIES</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070b14;
      --cyan-glow: #00d2ff;
      --blue-deep: #1e62d0;
      --purple-glow: #a82ffc;
      --gold-accent: #f5b942;
      --text-white: #ffffff;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--bg-dark);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-white);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Background Lighting matching reference */
    .ambient-stage {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .ambient-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.65;
      animation: ambientPulse 10s ease-in-out infinite alternate;
    }

    /* Top-left cyan/blue illumination */
    .blob-tl {
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, #00b4d8 0%, #0077b6 50%, transparent 75%);
      top: 2%;
      left: -18%;
    }

    /* Top-right purple/magenta illumination */
    .blob-tr {
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, #9d4edd 0%, #5a189a 55%, transparent 75%);
      top: 5%;
      right: -18%;
      animation-delay: -3s;
    }

    /* Bottom-right vibrant purple/pink illumination */
    .blob-br {
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, #b5179e 0%, #7209b7 55%, transparent 75%);
      bottom: 4%;
      right: -12%;
      animation-delay: -6s;
    }

    /* Subtle center-gold warmth */
    .blob-gold {
      width: 240px;
      height: 240px;
      background: radial-gradient(circle, rgba(245, 185, 66, 0.22) 0%, transparent 70%);
      bottom: 15%;
      left: 10%;
    }

    @keyframes ambientPulse {
      0% { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.08) translate(12px, -12px); }
    }

    /* Main Glassmorphism Card */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 380px;
      border-radius: 26px;
      padding: 30px 22px 22px;
      text-align: center;
      background: 
        radial-gradient(circle at 0% 0%, rgba(0, 195, 255, 0.28) 0%, transparent 50%),
        radial-gradient(circle at 100% 0%, rgba(168, 85, 247, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 100% 100%, rgba(192, 38, 211, 0.38) 0%, transparent 55%),
        linear-gradient(165deg, rgba(20, 29, 49, 0.88) 0%, rgba(13, 18, 32, 0.94) 100%);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1.5px solid rgba(255, 255, 255, 0.16);
      box-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.75),
        inset 0 1px 1px rgba(255, 255, 255, 0.25);
      overflow: hidden;
    }

    /* Circular Logo Frame */
    .logo-ring {
      width: 74px;
      height: 74px;
      margin: 0 auto 14px;
      border-radius: 50%;
      padding: 4px;
      background: rgba(10, 15, 28, 0.9);
      border: 2px solid rgba(255, 255, 255, 0.12);
      box-shadow: 
        0 8px 20px rgba(0, 0, 0, 0.6),
        0 0 18px rgba(0, 210, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .logo-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    /* Title */
    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 12px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    /* Pill Tagline Badge */
    .tagline-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 999px;
      background: rgba(16, 34, 62, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.28);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.08), 0 4px 12px rgba(0, 0, 0, 0.25);
      margin-bottom: 26px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981, 0 0 14px rgba(16, 185, 129, 0.8);
      animation: dotBlink 2s infinite ease-in-out;
    }

    @keyframes dotBlink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.85); }
    }

    .tagline-text {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 1.1px;
      text-transform: uppercase;
      color: #67e8f9;
    }

    /* Circular Countdown & Liquid Orb */
    .orb-wrapper {
      position: relative;
      width: 146px;
      height: 146px;
      margin: 0 auto 26px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Outer SVG Rings (Dashed + Solid Progress Arc) */
    .orb-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      z-index: 3;
      pointer-events: none;
    }

    .ring-dashed {
      fill: none;
      stroke: rgba(56, 189, 248, 0.32);
      stroke-width: 2;
      stroke-dasharray: 4 5;
    }

    .ring-track {
      fill: none;
      stroke: rgba(255, 255, 255, 0.07);
      stroke-width: 4.5;
    }

    .ring-progress {
      fill: none;
      stroke: url(#cyanArcGrad);
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-dasharray: 408;
      stroke-dashoffset: 408;
      filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.85));
    }

    /* Inner 3D Glass Sphere */
    .liquid-sphere {
      position: relative;
      width: 114px;
      height: 114px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 25%, #162642 0%, #091122 80%);
      border: 2px solid rgba(56, 189, 248, 0.45);
      box-shadow: 
        inset 0 8px 18px rgba(0, 0, 0, 0.85),
        inset 0 -6px 14px rgba(0, 180, 255, 0.35),
        0 0 25px rgba(0, 180, 255, 0.25);
      overflow: hidden;
      z-index: 2;
    }

    /* Rising Liquid Body */
    .liquid-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0%;
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 55%, #0369a1 100%);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.8);
      transition: height 0.08s linear;
    }

    /* 3D Meniscus Surface Rim on Top of Liquid */
    .liquid-fill::before {
      content: '';
      position: absolute;
      top: -6px;
      left: -8%;
      width: 116%;
      height: 12px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, #bae6fd 0%, #38bdf8 60%, rgba(2, 132, 199, 0) 100%);
      box-shadow: 0 0 10px rgba(186, 230, 253, 0.85);
      animation: liquidSlosh 2.4s ease-in-out infinite alternate;
    }

    @keyframes liquidSlosh {
      0% { transform: translateY(0px) scaleY(1); }
      100% { transform: translateY(2px) scaleY(1.25); }
    }

    /* Glossy 3D Sphere Highlight Overlay */
    .sphere-gloss {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 22%, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.04) 35%, transparent 60%);
      z-index: 3;
      pointer-events: none;
    }

    /* Countdown Number */
    .countdown-num {
      position: absolute;
      z-index: 4;
      font-size: 2.65rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.65);
      user-select: none;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .countdown-num.pop {
      transform: scale(1.16);
    }

    /* Status Text Block */
    .status-block {
      margin-bottom: 20px;
    }

    .status-heading {
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 5px;
    }

    .status-sub {
      font-size: 0.78rem;
      font-weight: 500;
      color: #cbd5e1;
    }

    /* Error Box */
    .error-banner {
      display: none;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid rgba(239, 68, 68, 0.45);
      color: #fecaca;
      font-size: 0.78rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 16px;
    }

    /* Buttons Stack */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 18px;
    }

    .btn {
      width: 100%;
      height: 50px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    /* Primary Action Button (Teal -> Blue gradient like screenshot) */
    .btn-primary {
      background: linear-gradient(90deg, #1b6ca8 0%, #2563eb 55%, #3b4cca 100%);
      border: 1px solid rgba(96, 165, 250, 0.35);
      color: rgba(255, 255, 255, 0.75);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.3);
      pointer-events: none;
    }

    .btn-primary.ready {
      background: linear-gradient(90deg, #0ea5e9 0%, #2563eb 50%, #4f46e5 100%);
      border-color: rgba(125, 211, 252, 0.65);
      color: #ffffff;
      pointer-events: auto;
      box-shadow: 0 8px 25px rgba(14, 165, 233, 0.5);
    }

    .btn-primary.ready:hover,
    .btn-primary.ready:active {
      transform: translateY(-1px);
      box-shadow: 0 10px 28px rgba(14, 165, 233, 0.7);
    }

    /* Circular Spinner inside Primary Button during countdown */
    .btn-spinner {
      width: 17px;
      height: 17px;
      border-radius: 50%;
      border: 2.2px solid rgba(125, 211, 252, 0.3);
      border-top-color: #38bdf8;
      animation: spin 0.85s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Secondary Telegram Channel Button */
    .btn-channel {
      background: linear-gradient(90deg, rgba(45, 55, 85, 0.6) 0%, rgba(88, 52, 125, 0.65) 100%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .btn-channel:hover,
    .btn-channel:active {
      background: linear-gradient(90deg, rgba(55, 68, 105, 0.75) 0%, rgba(108, 62, 150, 0.8) 100%);
      border-color: rgba(255, 255, 255, 0.32);
      transform: translateY(-1px);
    }

    .tg-send-icon {
      width: 16px;
      height: 16px;
      color: #38bdf8;
      flex-shrink: 0;
    }

    /* Bottom Footer Caption */
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(203, 213, 225, 0.65);
    }
  </style>
</head>
<body>

  <!-- Ambient Background Glows -->
  <div class="ambient-stage">
    <div class="ambient-blob blob-tl"></div>
    <div class="ambient-blob blob-tr"></div>
    <div class="ambient-blob blob-br"></div>
    <div class="ambient-blob blob-gold"></div>
  </div>

  <!-- Main UI Card -->
  <main class="card">
    <!-- Logo -->
    <div class="logo-ring">
      <img src="RudraMovies.png" alt="RUDRA MOVIES" onerror="this.style.opacity='0.25'" />
    </div>

    <!-- Brand Name -->
    <h1 class="brand-title">RUDRA MOVIES</h1>

    <!-- Tagline Pill -->
    <div class="tagline-pill">
      <span class="status-dot" id="statusDot"></span>
      <span class="tagline-text">YOUR CINEMATIC UNIVERSE</span>
    </div>

    <!-- Animated Circular Liquid Countdown -->
    <div class="orb-wrapper">
      <svg class="orb-svg" viewBox="0 0 146 146">
        <defs>
          <linearGradient id="cyanArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="60%" stop-color="#0ea5e9" />
            <stop offset="100%" stop-color="#a855f7" />
          </linearGradient>
        </defs>
        <!-- Outer Dashed Ring -->
        <circle class="ring-dashed" cx="73" cy="73" r="69" />
        <!-- Solid Ring Track -->
        <circle class="ring-track" cx="73" cy="73" r="65" />
        <!-- Animated Progress Arc -->
        <circle class="ring-progress" id="ringProgress" cx="73" cy="73" r="65" />
      </svg>

      <!-- Inner Liquid Sphere -->
      <div class="liquid-sphere">
        <div class="liquid-fill" id="liquidFill"></div>
        <div class="sphere-gloss"></div>
      </div>

      <!-- Countdown Digit -->
      <div class="countdown-num" id="countdownNum">5</div>
    </div>

    <!-- Loading Status Text -->
    <div class="status-block">
      <div class="status-heading" id="statusHeading">PREPARING YOUR DOWNLOAD LINK...</div>
      <div class="status-sub" id="statusSub">Redirecting in progress...</div>
    </div>

    <!-- Error Message Box (Hidden unless invalid/missing link) -->
    <div class="error-banner" id="errorBanner"></div>

    <!-- Action Buttons -->
    <div class="btn-group">
      <a href="#" id="downloadBtn" class="btn btn-primary" role="button" aria-disabled="true">
        <span class="btn-spinner" id="btnSpinner"></span>
        <span id="downloadBtnText">PREPARING...</span>
      </a>

      <a href="https://t.me/RudraMovies" id="telegramBtn" target="_blank" rel="noopener noreferrer" class="btn btn-channel">
        <svg class="tg-send-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3.4 20.4l17.45-7.48a1 1 0 0 0 0-1.84L3.4 3.6a.993.993 0 0 0-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.07-.87.5-.87 1l.01 4.61c0 .71.73 1.2 1.39.91z"/>
        </svg>
        <span>⚡ RUDRA MAIN CHANNEL ✨</span>
      </a>
    </div>

    <!-- Footer -->
    <div class="card-footer">
      <span>⚡ RUDRA MOVIES</span>
    </div>
  </main>

  <script>
    (function () {
      const COUNTDOWN_SECONDS = 5;
      const ARC_CIRCUMFERENCE = 2 * Math.PI * 65; // ~408.4

      const countdownNum = document.getElementById('countdownNum');
      const ringProgress = document.getElementById('ringProgress');
      const liquidFill = document.getElementById('liquidFill');
      const statusHeading = document.getElementById('statusHeading');
      const statusSub = document.getElementById('statusSub');
      const statusDot = document.getElementById('statusDot');
      const errorBanner = document.getElementById('errorBanner');
      const downloadBtn = document.getElementById('downloadBtn');
      const downloadBtnText = document.getElementById('downloadBtnText');
      const btnSpinner = document.getElementById('btnSpinner');

      ringProgress.style.strokeDasharray = `${ARC_CIRCUMFERENCE}`;
      ringProgress.style.strokeDashoffset = `${ARC_CIRCUMFERENCE}`;

      let finalRedirectUrl = null;
      let hasError = false;

      // Validate and sanitize target URL
      function parseValidUrl(input) {
        if (!input || typeof input !== 'string') return null;
        const raw = input.trim();
        if (!raw) return null;

        if (/^(https?:\/\/|tg:\/\/)/i.test(raw)) {
          return raw;
        }

        // Support Base64-encoded redirect URLs if passed
        try {
          const decoded = atob(raw).trim();
          if (/^(https?:\/\/|tg:\/\/)/i.test(decoded)) {
            return decoded;
          }
        } catch (_) {}

        return null;
      }

      function displayError(msg) {
        hasError = true;
        btnSpinner.style.display = 'none';
        downloadBtnText.textContent = 'LINK ERROR';
        statusHeading.textContent = 'INVALID OR MISSING LINK';
        statusHeading.style.color = '#f87171';
        statusSub.textContent = 'Unable to proceed with redirect.';
        statusDot.style.background = '#ef4444';
        statusDot.style.boxShadow = '0 0 8px #ef4444';
        countdownNum.textContent = '!';
        errorBanner.textContent = msg;
        errorBanner.style.display = 'block';
        downloadBtn.classList.remove('ready');
        downloadBtn.removeAttribute('href');
      }

      // Preserve ?token= (/api/verify) and ?redirect= parameters
      async function resolveDestination() {
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const redirect = params.get('redirect');

        if (token) {
          try {
            let res = await fetch(`/api/verify?token=${encodeURIComponent(token)}`, {
              method: 'GET',
              headers: { 'Accept': 'application/json' }
            });

            if (res.status === 405) {
              res = await fetch('/api/verify', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Accept': 'application/json'
                },
                body: JSON.stringify({ token, redirect })
              });
            }

            const data = await res.json().catch(() => ({}));

            if (!res.ok || data.error || data.valid === false || data.success === false) {
              throw new Error(data.message || data.error || 'This download token is invalid or has expired.');
            }

            const target = data.redirect || data.url || data.target || data.link || redirect;
            const validTarget = parseValidUrl(target);

            if (!validTarget) {
              throw new Error('Destination download link is missing or invalid.');
            }

            return validTarget;
          } catch (err) {
            displayError(err.message || 'Failed to verify download token. Please try again from the channel.');
            return null;
          }
        }

        if (redirect) {
          const validTarget = parseValidUrl(redirect);
          if (validTarget) {
            return validTarget;
          }
          displayError('The provided redirect URL is invalid.');
          return null;
        }

        displayError('No download link or token was found in the URL.');
        return null;
      }

      function startCountdown() {
        const destinationPromise = resolveDestination();
        const startTime = performance.now();
        const totalDuration = COUNTDOWN_SECONDS * 1000;
        let currentDisplayed = COUNTDOWN_SECONDS;

        // Start liquid at 20% height so it looks full & lively from 5 down to 1
        liquidFill.style.height = '20%';

        function tick(now) {
          if (hasError) return;

          const elapsed = Math.min(now - startTime, totalDuration);
          const progress = elapsed / totalDuration; // 0.0 -> 1.0
          const secondsLeft = Math.max(1, Math.ceil((totalDuration - elapsed) / 1000));

          // Update circular progress arc
          const dashOffset = ARC_CIRCUMFERENCE * (1 - progress);
          ringProgress.style.strokeDashoffset = `${dashOffset}`;

          // Smoothly fill liquid sphere from 20% to 88%
          const fillPercent = 20 + progress * 68;
          liquidFill.style.height = `${fillPercent.toFixed(1)}%`;

          // Update number 5, 4, 3, 2, 1
          if (secondsLeft !== currentDisplayed && elapsed < totalDuration) {
            currentDisplayed = secondsLeft;
            countdownNum.textContent = String(secondsLeft);
            countdownNum.classList.add('pop');
            setTimeout(() => countdownNum.classList.remove('pop'), 180);
          }

          if (elapsed < totalDuration) {
            requestAnimationFrame(tick);
          } else {
            completeCountdown(destinationPromise);
          }
        }

        requestAnimationFrame(tick);
      }

      async function completeCountdown(destinationPromise) {
        finalRedirectUrl = await destinationPromise;
        if (hasError || !finalRedirectUrl) return;

        ringProgress.style.strokeDashoffset = '0';
        liquidFill.style.height = '90%';
        countdownNum.textContent = '1';

        statusSub.textContent = 'Your download link is ready!';
        btnSpinner.style.display = 'none';
        downloadBtnText.textContent = 'DOWNLOAD NOW';
        downloadBtn.href = finalRedirectUrl;
        downloadBtn.classList.add('ready');
        downloadBtn.setAttribute('aria-disabled', 'false');

        // Automatic redirect
        setTimeout(() => {
          window.location.href = finalRedirectUrl;
        }, 300);
      }

      downloadBtn.addEventListener('click', function (e) {
        if (!finalRedirectUrl || hasError) {
          e.preventDefault();
          return;
        }
        window.location.href = finalRedirectUrl;
      });

      startCountdown();
    })();
  </script>
</body>
</html>
